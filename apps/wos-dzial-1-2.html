<!doctype html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOS: człowiek, rodzina, szkoła, samorząd – quiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7F3; --grid:#DFEBE2; --ink:#16271D; --muted:#56695C; --line:#CADCCF; --surface:#FFFFFF; --soft:#E9F2EC;
  --accent:#2E8B57; --accent-ink:#FFFFFF; --ok:#1C7F54; --okbg:#E2F3EA; --bad:#C0284E; --badbg:#FBE5EB; --warn:#9A6700; --warnbg:#FFF4D6;
  --sel:#2F5BD3; --selbg:#E6EDFF;
  --shadow:0 1px 2px rgba(22,39,29,.06),0 6px 18px rgba(22,39,29,.06);
  --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1813; --grid:#16231B; --ink:#E6F0E9; --muted:#9DB3A4; --line:#29402F; --surface:#15221A; --soft:#1B2B21;
    --accent:#5CC98A; --accent-ink:#0F1813; --ok:#55D197; --okbg:#10362A; --bad:#FF7C9C; --badbg:#3C1628; --warn:#FFD36B; --warnbg:#3A3116;
    --sel:#8FB0FF; --selbg:#1C2847; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--ink); font:18px/1.5 var(--fb); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px}
.wrap{max-width:660px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px max(90px,calc(env(safe-area-inset-bottom) + 80px))}
h1,h2{font-family:var(--fh); line-height:1.12; margin:0}
h1{font-size:clamp(26px,7vw,36px); font-weight:800; letter-spacing:-.02em}
h2{font-size:21px; font-weight:800; margin-bottom:8px}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.btn{border:2px solid var(--ink); background:transparent; border-radius:12px; padding:9px 16px; font:800 16px var(--fh)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%; padding:13px}
.btn:disabled{opacity:.4}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15px; font-weight:700}
.big{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow); margin-bottom:10px}
.big .i{font-size:28px; width:38px; text-align:center; flex:none}
.big .t{font:800 18px var(--fh); display:block}
.big .d{color:var(--muted); font-size:14px; line-height:1.35; display:block}
.big.dark{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.big.dark .d{color:var(--paper); opacity:.8}
.big.trap{border:2px solid #E0A800}
.bar{height:7px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; background:var(--ok); border-radius:6px}
.top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.back{border:1px solid var(--line); background:var(--surface); width:44px; height:44px; border-radius:50%; font-size:20px; flex:none; box-shadow:var(--shadow)}
.prog{height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:12px}
.prog span{display:block; height:100%; background:var(--accent); transition:width .25s}

/* fiszka */
.q{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow)}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.qlab{font:700 13px var(--fh); color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.qt{font:800 21px/1.3 var(--fh); margin:6px 0 14px}
.tag{display:inline-block; background:var(--warnbg); color:var(--warn); border-radius:8px; padding:0 8px; font:700 12px var(--fh)}
.opts{display:grid; gap:8px}
.opt{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; line-height:1.35; font-weight:700}
.opts.two{grid-template-columns:repeat(2,1fr)} .opts.two .opt{text-align:center; padding:16px 4px; font-size:17px}
.opts.five{grid-template-columns:repeat(5,1fr); gap:6px} .opts.five .opt{text-align:center; padding:16px 2px; font-size:16px}
.opts.three{grid-template-columns:repeat(3,1fr)} .opts.three .opt{text-align:center; padding:16px 4px; font-size:17px}
.opt.ok{border-color:var(--ok); background:var(--okbg)} .opt.no{border-color:var(--bad); background:var(--badbg)}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pairs .col{display:grid; gap:8px; align-content:start}
.pb{position:relative; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 10px 9px 12px; line-height:1.3; font-size:15px; font-weight:700; min-height:48px}
.pb.sel{border-color:var(--sel); background:var(--selbg)}
.pb .n{position:absolute; top:-8px; right:-6px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:800 12px var(--fh); color:#fff}
.pb.ok{border-color:var(--ok); background:var(--okbg)} .pb.no{border-color:var(--bad); background:var(--badbg)}
.why{margin-top:12px; border-radius:14px; padding:12px 14px}
.why.ok{background:var(--okbg)} .why.bad{background:var(--badbg)}
.why .h{font:800 18px var(--fh)}
.why .w{margin-top:6px; font-size:16px}
.why ul{margin:6px 0 0; padding-left:1.1em; font-size:16px}
.diff{border-top:1px solid var(--line); padding:10px 0}
.diff .qq{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* wybierz wszystkie + kolejność */
.opt.sel{border-color:var(--sel); background:var(--selbg)}
.opt.miss{border-style:dashed; border-color:var(--ok)}
.opt .box{display:inline-block; width:1.2em}
.ord{display:grid; gap:8px; margin-bottom:10px}
.slot{display:flex; gap:10px; align-items:center; min-height:46px; border:2px dashed var(--line); border-radius:12px; padding:8px 12px; text-align:left; background:transparent; font-weight:700}
.slot.full{border-style:solid; background:var(--surface)}
.slot .k{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--soft); font:800 13px var(--fh)}
.slot.ok{border-color:var(--ok); background:var(--okbg)} .slot.no{border-color:var(--bad); background:var(--badbg)}
.pool{display:flex; flex-wrap:wrap; gap:8px}
.pool .opt{flex:1 1 auto}
.score{font:800 56px/1 var(--fh)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ============ GRACZ ============ */
const KIDS={wiktor:'Wiktor',igor:'Igor',zoja:'Zoja'};
let kid=(new URLSearchParams(location.search).get('dla')||'wiktor').toLowerCase();
if(!KIDS[kid]) kid='wiktor';

/* ============ PYTANIA ============ */
// Treść z „WOS kl. 8 – powtórka przed sprawdzianem” (Dział I i II), zgodnie z listą zagadnień od nauczyciela.
// Przykłady w pytaniach są inne niż w ćwiczeniach materiału, żeby ćwiczenia zostały na samodzielną próbę.
// mc: o[0] = poprawna. tf: zdanie + true/false. pairs: [lewa, prawa]. multi: [tekst, czy pasuje]. order: elementy w poprawnej kolejności.
const SECTIONS={pot:'Potrzeby i człowiek',zb:'Zbiorowości i grupy',konf:'Konflikty i decyzje',rodz:'Rodzina',gosp:'Gospodarstwo domowe',szk:'Szkoła i samorząd szkolny',prawa:'Prawa i obowiązki ucznia',samt:'Samorząd terytorialny',fin:'Finanse samorządu'};
const Q=[];
const mc=(s,id,q,o,e)=>Q.push({s,id,type:'mc',q,o,e});
const tf=(s,id,q,val,e)=>Q.push({s,id,type:'tf',q,val,e});
const pairs=(s,id,q,p,e)=>Q.push({s,id,type:'pairs',q,p,e});
const multi=(s,id,q,o,e)=>Q.push({s,id,type:'multi',q,o,e});
const order=(s,id,q,items,e)=>Q.push({s,id,type:'order',q,items,e});

// 1. Potrzeby i człowiek
multi('pot','a1','Zaznacz wszystkie potrzeby biologiczne (pierwotne).',[['sen',1],['picie',1],['jedzenie',1],['oddychanie',1],['uznanie',0],['miłość',0]],'Potrzeby pierwotne decydują o przetrwaniu, więc zaspokajamy je najpierw; uznanie i miłość to potrzeby wtórne.');
pairs('pot','a2','Dobierz potrzebę do jej rodzaju.',[['jedzenie','biologiczna (pierwotna)'],['miłość','psychiczna (wtórna)'],['uznanie','społeczna (wtórna)']],'Psychiczne: poczucie bezpieczeństwa, miłość, akceptacja; społeczne: kontakt z innymi, przynależność do grupy, uznanie, działanie na rzecz innych.');
mc('pot','a3','Dlaczego człowiek jest istotą społeczną?',['w grupie ma najlepsze możliwości istnienia, rozwoju i zaspokajania potrzeb','bo lubi rozmawiać z innymi','bo nakazuje mu to prawo','bo tylko zwierzęta żyją samotnie'],'Od urodzenia nie jest samodzielny, a zasad życia uczy się od innych (socjalizacja) – dzieci wychowane w izolacji ich nie nabywały.');
multi('pot','a4','Zaznacz cechy, które odróżniają człowieka od zwierząt.',[['rozum i świadome planowanie',1],['mowa i język',1],['sumienie i moralność',1],['tworzenie kultury, sztuki i nauki',1],['potrzeba jedzenia i snu',0],['oddychanie',0]],'Jedzenie, sen i oddychanie to potrzeby biologiczne – mają je też zwierzęta; człowieka wyróżniają też samoświadomość i wolna wola.');
pairs('pot','a5','Dobierz pojęcie do wyjaśnienia.',[['socjalizacja','uczenie się zasad życia w społeczeństwie przez naśladowanie innych'],['interakcja','wzajemne oddziaływanie ludzi – początek relacji'],['rola społeczna','zachowania związane z miejscem w grupie, np. uczeń, syn']],'Socjalizacja trwa całe życie: rodzina, przedszkole, szkoła, praca.');

// 2. Zbiorowości i grupy
pairs('zb','b1','Rozpoznaj rodzaj zbiorowości.',[['brat i siostra','para'],['ludzie w poczekalni u lekarza','krąg społeczny'],['klub szachowy','grupa społeczna'],['mieszkańcy Krakowa','społeczność'],['Polacy razem z instytucjami państwa','społeczeństwo']],'Krąg społeczny ma kontakt, ale bez silnych więzi i struktury; naród to wspólnota z poczuciem odrębności, wspólną kulturą, historią i zwykle językiem.');
mc('zb','b2','Grupa społeczna to…',['co najmniej 3 osoby z trwałą więzią, wspólnym celem i zasadami','dowolne dwie osoby','wszyscy mieszkańcy kraju','ludzie czekający na przystanku'],'Dwie osoby to para, a przypadkowi ludzie w jednym miejscu to krąg społeczny.');
mc('zb','b3','Czym różni się społeczność od społeczeństwa?',['społeczność to mieszkańcy wspólnego obszaru, a społeczeństwo to bardzo duża zbiorowość złożona ze społeczności i wspierana przez instytucje','niczym – to to samo','społeczeństwo jest mniejsze od społeczności','społeczność ma instytucje państwa, a społeczeństwo nie'],'Społeczność to np. mieszkańcy miasta lub regionu połączeni tradycjami lub interesami; społeczeństwo to np. społeczeństwo polskie.');
pairs('zb','b4','Określ rodzaj grupy.',[['rodzina','mała, pierwotna, formalna'],['pracownicy dużej firmy','duża, wtórna, formalna'],['paczka kolegów z osiedla','mała, pierwotna, nieformalna']],'Pierwotne mają silne więzi osobiste, wtórne – więzi ze wspólnych zadań; formalne mają spisane zasady i listę członków.');

// 3. Konflikty i decyzje
pairs('konf','c1','Dobierz sposób dochodzenia do kompromisu do opisu.',[['arbitraż','arbiter wysłuchuje stron i sam rozstrzyga'],['mediacja','mediator pomaga znaleźć rozwiązanie, ale go nie narzuca'],['negocjacje','strony rozmawiają same, bez osoby trzeciej']],'Arbiter decyduje, mediator pomaga, a w negocjacjach nie ma osoby trzeciej.');
mc('konf','c2','Sąsiedzi kłócą się o płot. Sołtys wysłuchał obu stron i pomógł im samym wymyślić rozwiązanie. Jak to się nazywa?',['mediacja','arbitraż','negocjacje','decyzja lidera'],'To mediacja, bo mediator nie narzuca rozwiązania, tylko pomaga je znaleźć; gdyby sołtys sam rozstrzygnął, byłby to arbitraż.');
mc('konf','c3','Kiedy konflikt kończy się kompromisem?',['gdy każda strona rezygnuje z części żądań i godzi się na część cudzych','gdy jedna strona za wszelką cenę stawia na swoim','gdy strony odkładają rozstrzygnięcie na później','gdy strony przestają ze sobą rozmawiać'],'Inne zakończenia to walka (każdy chce postawić na swoim) i zawieszenie broni (odsunięcie rozstrzygnięcia).');
pairs('konf','c4','Dobierz sposób podejmowania decyzji do opisu.',[['konsensus','każdy akceptuje – wszyscy zadowoleni, ale trwa długo'],['głosowanie','wygrywa większość – szybko, ale mniejszość bywa niezadowolona'],['decyzja lidera','jedna osoba decyduje – najszybciej, ale inni nie mają wpływu']],'W głosowaniu każdy głos jest tak samo ważny.');
order('konf','c5','Ułóż etapy podejmowania decyzji.',['określenie celu','analiza środków i sposobów działania','ocena możliwych skutków','realizacja decyzji'],'Najpierw wiesz, czego chcesz, potem sprawdzasz, jak to osiągnąć i co z tego wyniknie – dopiero wtedy działasz.');

// 4. Rodzina
pairs('rodz','d1','Dobierz typ rodziny do opisu.',[['nuklearna','rodzice i dzieci'],['wielopokoleniowa','dziadkowie, rodzice i dzieci we wspólnym gospodarstwie'],['partnerska','rodzice decydują wspólnie i radzą się dzieci'],['patriarchalna','dominuje mężczyzna'],['matriarchalna','dominuje kobieta']],'W Polsce najczęściej są rodziny dwupokoleniowe (nuklearne); poligamiczna (jedna osoba ma kilku małżonków) jest w Polsce zakazana.');
pairs('rodz','d2','Jaką funkcję rodziny pokazuje sytuacja?',[['narodziny dziecka','prokreacyjna'],['babcia pielęgnuje chorego wnuka','opiekuńcza'],['rodzice uczą dziecko zachowania przy stole','socjalizacyjno-wychowawcza'],['rodzice pocieszają smutne dziecko','emocjonalna'],['rodzice zarabiają na utrzymanie domu','ekonomiczna'],['rodzina razem obchodzi Wigilię i rocznice','kulturowa']],'Na sprawdzianie podawaj nazwę funkcji i przykład.');
mc('rodz','d3','Komu przysługuje władza rodzicielska?',['w równym stopniu obojgu rodzicom','tylko ojcu','tylko matce','dziadkom'],'Jeśli rodzice nie wywiązują się z obowiązków, sąd rodzinny może ograniczyć lub odebrać im prawa rodzicielskie.');
multi('rodz','d4','Zaznacz obowiązki DZIECKA w rodzinie.',[['pomoc w gospodarstwie domowym',1],['realizowanie obowiązku szkolnego',1],['pomoc rodzicom w starości lub chorobie',1],['utrzymanie rodziny',0],['wymierzanie kar rodzeństwu',0]],'Utrzymanie dziecka to obowiązek rodziców; rodzice mają też troszczyć się o rozwój dziecka i nie stosować kar cielesnych.');
tf('rodz','d5','Konstytucja RP obejmuje rodzinę ochroną i opieką państwa.',true,'Art. 18 Konstytucji: małżeństwo, rodzina, macierzyństwo i rodzicielstwo są pod ochroną i opieką Rzeczypospolitej Polskiej.');

// 5. Gospodarstwo domowe
pairs('gosp','e1','Dobierz dochód do jego grupy.',[['pensja z umowy o pracę','z pracy najemnej'],['zysk z własnej firmy','z działalności gospodarczej'],['emerytura, renta, zasiłek','spoza pracy (świadczenia)'],['wynajem mieszkania, odsetki','z majątku i kapitału']],'Dochody niezwiązane z pracą to też wygrane, stypendia, darowizny i spadki.');
pairs('gosp','e2','Dobierz wydatek do rodzaju.',[['rachunek za prąd','konsumpcyjny stały'],['nowa lodówka','konsumpcyjny zmienny'],['ubezpieczenie na życie','inwestycyjny stały'],['kurs językowy','inwestycyjny zmienny']],'Konsumpcyjne są na potrzeby bieżące, inwestycyjne – na przyszłe; stałe są regularne, zmienne zwykle jednorazowe.');
mc('gosp','e3','Rodzina ma 6000 zł dochodów i 6500 zł wydatków. Jaki jest jej budżet?',['deficyt – 500 zł','zrównoważony','nadwyżka – 500 zł','deficyt – 6500 zł'],'Deficyt to wydatki większe od dochodów – często prowadzi do kredytów; żelazna zasada: nie wydawaj więcej, niż zarabiasz.');
mc('gosp','e4','Dlaczego gospodarstwa domowe są ważne dla gospodarki państwa?',['kupują towary i usługi i płacą podatki, z których państwo finansuje np. edukację','produkują prąd dla firm','drukują pieniądze','ustalają ceny w sklepach'],'Obok przedsiębiorstw gospodarstwa domowe są jednym z najważniejszych uczestników gospodarki.');
multi('gosp','e5','Zaznacz zasady racjonalnego gospodarowania pieniędzmi.',[['planowanie większych wydatków',1],['odkładanie części dochodu „na czarną godzinę”',1],['zakupy z listą',1],['wydawanie więcej, niż się zarabia',0],['branie nowych pożyczek na spłatę starych',0]],'Nowe pożyczki na spłatę starych to pułapka zadłużenia.');

// 6. Szkoła i samorząd szkolny
pairs('szk','f1','Dobierz szkołę po podstawówce do opisu.',[['liceum ogólnokształcące','4 lata, kończy się maturą'],['technikum','5 lat, matura i egzaminy zawodowe'],['branżowa szkoła I stopnia','3 lata, egzamin zawodowy'],['branżowa szkoła II stopnia','2 lata, przygotowuje do matury']],'Jest też szkoła specjalna przysposabiająca do pracy (3 lata); po maturze – studia lub szkoła policealna.');
mc('szk','f2','Po ilu latach nauki, licząc od 1 klasy podstawówki, zdasz maturę w technikum?',['13','12','14','11'],'Liceum: 8 + 4 = 12 lat; technikum: 8 + 5 = 13; branżowa I i II stopnia: 8 + 3 + 2 = 13.');
pairs('szk','f3','Kto za co odpowiada w szkolnictwie?',[['Ministerstwo Edukacji','kieruje polityką oświatową i nadzoruje szkolnictwo'],['kurator oświaty','realizuje politykę oświatową w województwie'],['organ prowadzący szkoły publicznej','najczęściej samorząd: gmina, powiat lub województwo']],'Szkoły niepubliczne prowadzą stowarzyszenia, fundacje i osoby prywatne.');
mc('szk','f4','Samorządność to…',['prawo do samodzielnego podejmowania decyzji w sprawach, które nas dotyczą','obowiązek wykonywania poleceń dyrektora','rządzenie krajem przez premiera','zbiór ocen ucznia'],'Są samorządy terytorialne (gminy, powiaty, województwa) i specjalne – np. szkolny, lekarski, adwokacki.');
tf('szk','f5','Samorząd szkolny to tylko przewodniczący i zarząd wybrani przez uczniów.',false,'Samorząd szkolny tworzą wszyscy uczniowie szkoły (Prawo oświatowe); przewodniczący i zarząd to jego przedstawiciele.');
multi('szk','f6','Zaznacz uprawnienia samorządu szkolnego.',[['wydawanie gazety szkolnej',1],['wybór nauczyciela – opiekuna samorządu',1],['organizowanie działalności kulturalnej i sportowej (z dyrektorem)',1],['zapoznanie się z programem nauczania',1],['wystawianie ocen uczniom',0],['zatrudnianie nauczycieli',0]],'Samorząd ma też prawo do jawnej i umotywowanej oceny oraz do zachowania proporcji między nauką a zainteresowaniami.');
pairs('szk','f7','Dobierz zasadę wyborów do wyjaśnienia.',[['powszechne','każdy uczeń może głosować'],['równe','każdy ma jeden głos'],['tajne','głosuje się w odosobnieniu'],['bezpośrednie','głosuje się osobiście']],'Nie myl zasad: jeden głos to równość, a tajność to głosowanie w odosobnieniu.');

// 7. Prawa i obowiązki ucznia
mc('prawa','g1','W którym dokumencie szkolnym zapisane są prawa i obowiązki ucznia?',['w statucie szkoły','w dzienniku lekcyjnym','w planie lekcji','w regulaminie stołówki'],'Każda szkoła musi mieć statut; prawa ucznia wynikają też np. z Konwencji o prawach dziecka (ONZ, 1989) i Konstytucji RP.');
multi('prawa','g2','Zaznacz PRAWA ucznia (nie obowiązki).',[['odpoczynek w czasie przerw',1],['sprawiedliwa, jawna i uzasadniona ocena',1],['swoboda wyrażania poglądów',1],['pomoc w razie trudności w nauce',1],['systematyczne przygotowanie do lekcji',0],['dbałość o mienie szkoły',0],['udział w zajęciach lekcyjnych',0]],'Korzystanie z praw nie zależy od wypełniania obowiązków – ale za niewypełnianie obowiązków grożą konsekwencje.');
mc('prawa','g3','Ola nie odrabia zadań i nie powtarza materiału przed lekcjami. Którego obowiązku nie wypełnia?',['systematycznego przygotowania do lekcji','udziału w zajęciach lekcyjnych','dbałości o mienie szkoły','kultury współżycia'],'Inne obowiązki to m.in. przestrzeganie porządku szkolnego i dbałość o zdrowie i bezpieczeństwo swoje i innych.');
pairs('prawa','g4','Gdzie szukać pomocy, gdy prawa ucznia są łamane?',[['w szkole','wychowawca, pedagog, rzecznik praw ucznia'],['poza szkołą','Rzecznik Praw Dziecka, kurator oświaty'],['w poważnych sprawach','policja, prokuratura, sąd']],'W szkole pomoże też psycholog, dyrektor i samorząd szkolny.');

// 8. Samorząd terytorialny
mc('samt','h1','Od kiedy obowiązuje trójstopniowy podział Polski i ile jest województw?',['od 1999 r.; 16 województw','od 1989 r.; 12 województw','od 2017 r.; 16 województw','od 1999 r.; 18 województw'],'Województwa → powiaty → gminy; jednostki nie są od siebie zależne – każda ma własne zadania.');
pairs('samt','h2','Dobierz organ samorządu do jego roli.',[['rada gminy','organ stanowiący gminy'],['wójt / burmistrz / prezydent miasta','organ wykonawczy gminy'],['zarząd powiatu ze starostą','organ wykonawczy powiatu'],['sejmik województwa','organ stanowiący województwa'],['zarząd województwa z marszałkiem','organ wykonawczy województwa']],'Organ stanowiący uchwala prawo miejscowe, a wykonawczy je realizuje; organem stanowiącym powiatu jest rada powiatu.');
mc('samt','h3','Kto wybiera starostę i marszałka województwa?',['starostę – rada powiatu, marszałka – sejmik województwa','mieszkańcy w wyborach bezpośrednich','premier','wojewoda'],'Bezpośrednio mieszkańcy wybierają tylko rady, sejmik oraz wójta, burmistrza lub prezydenta miasta.');
mc('samt','h4','Wojewoda to…',['przedstawiciel rządu w województwie, który może uchylić sprzeczne z prawem decyzje samorządu','szef samorządu województwa','osoba wybierana przez mieszkańców województwa','przewodniczący sejmiku'],'Wojewodę powołuje premier – to administracja rządowa, a nie samorząd; szefem zarządu województwa (samorząd) jest marszałek.');
pairs('samt','h5','Do którego samorządu należy zadanie?',[['szkoły podstawowe, wywóz śmieci, wodociągi','gmina'],['szkoły średnie, zwalczanie bezrobocia','powiat'],['szpitale specjalistyczne, promocja regionu','województwo']],'Gmina to samorząd lokalny, a powiat i województwo – regionalny.');
pairs('samt','h6','Gdzie załatwisz sprawę?',[['dowód osobisty, akt urodzenia, meldunek','urząd gminy'],['prawo jazdy, rejestracja samochodu','starostwo powiatowe'],['paszport, sprawy obywatelstwa','urząd wojewódzki']],'Najwięcej codziennych spraw załatwiamy w urzędzie gminy; zasiłek dla bezrobotnych daje Powiatowy Urząd Pracy.');

// 9. Finanse samorządu
multi('fin','i1','Zaznacz źródła dochodów gminy.',[['podatki od mieszkańców i firm',1],['subwencje i dotacje z budżetu państwa',1],['środki unijne',1],['obligacje komunalne',1],['wynagrodzenia radnych',0],['opłata za wybory do rady gminy',0]],'Gmina ma też dochody z prywatyzacji swojego majątku i nadwyżki z lat ubiegłych.');
pairs('fin','i2','Zadanie własne czy zlecone?',[['zadanie własne','służy wspólnocie, finansowane z pieniędzy gminy – np. park'],['zadanie zlecone','zadanie państwa, pieniądze daje rząd – np. wypłata 800 plus']],'Na sprawdzianie przy wyjaśnieniu różnicy podaj też przykład każdego zadania.');
tf('fin','i3','Fundusze unijne trafiają głównie do najbogatszych regionów.',false,'Jest odwrotnie: im biedniejszy region, tym większe dotacje; idą głównie na drogi, wodociągi, szkoły i szpitale.');
mc('fin','i4','Kto kontroluje finanse samorządu?',['regionalne izby obrachunkowe','kurator oświaty','sejmik województwa','Rzecznik Praw Dziecka'],'Każdą jednostkę samorządu może też skontrolować Najwyższa Izba Kontroli.');

/* ============ ZAPIS ============ */
const KEY='wos-dzial1-2-v1:'+kid;
let S={wrong:[],last:null,best:null}, canSave=true;
try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){ canSave=false; }
const save=()=>{ if(!canSave) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ canSave=false; } };

/* ============ POMOCNICZE ============ */
const $app=document.getElementById('app'), $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const topBar=t=>`<div class="top"><button class="back" id="bBack" aria-label="Wróć">←</button><h2 style="margin:0;flex:1">${t}</h2></div>`;
const COLORS=['#2F5BD3','#C2410C','#7C3AED','#0E7490'];
const QN=Object.fromEntries(Q.map(q=>[q.id,q]));
const KIND={mc:'wybierz jedną',tf:'prawda czy fałsz?',pairs:'dobierz w pary',multi:'zaznacz wszystkie pasujące',order:'ułóż w kolejności'};
function answerText(q){
  if(q.type==='mc') return esc(q.o[0]);
  if(q.type==='tf') return q.val?'Prawda':'Fałsz';
  if(q.type==='pairs') return q.p.map(([a,b])=>`${esc(a)} → ${esc(b)}`).join('<br>');
  if(q.type==='multi') return q.o.filter(x=>x[1]).map(x=>esc(x[0])).join(' · ');
  return q.items.map(esc).join(' → ');
}

/* ============ EKRAN GŁÓWNY ============ */
function home(){
  window.scrollTo(0,0);
  const wr=S.wrong.filter(id=>QN[id]);
  $app.innerHTML=`<h1>⚖️ WOS – Dział I i II</h1>
    <p class="muted" style="margin-top:4px">Cześć, ${esc(KIDS[kid])}! Quiz przed sprawdzianem: potrzeby, grupy, konflikty, rodzina, gospodarstwo domowe, szkoła, samorząd szkolny i terytorialny. Po każdej odpowiedzi od razu wyjaśnienie.</p>
    <div class="pills">${S.last?`<span class="pill">ostatnio: ${S.last.ok}/${S.last.n}</span>`:''}${S.best!=null?`<span class="pill">🏆 najlepszy wynik: ${S.best}%</span>`:''}</div>
    <button class="big dark" id="bAll"><span class="i">🎯</span><span><span class="t">Cały quiz</span><span class="d">${Q.length} pytań w losowej kolejności</span></span></button>
    <button class="big" id="bWrong" ${wr.length?'':'disabled style="opacity:.5"'}><span class="i">🩹</span><span><span class="t">Powtórz tylko błędne</span><span class="d">${wr.length?`${wr.length} z ostatniego podejścia`:'Na razie brak błędów do powtórki'}</span></span></button>
    <div class="card"><h2>Zakres</h2>${Object.entries(SECTIONS).map(([k,n])=>`<button class="big" data-s="${k}" style="box-shadow:none;margin-bottom:8px"><span class="t">${esc(n)}</span><span class="d" style="margin-left:auto">${Q.filter(q=>q.s===k).length} pytań</span></button>`).join('')}</div>
    ${canSave?'':'<p class="muted small">Ta przeglądarka nie zapisze wyników.</p>'}`;
  $('bAll').onclick=()=>run(shuffle(Q),'Cały quiz');
  $('bWrong').onclick=()=>{ if(wr.length) run(shuffle(wr.map(id=>QN[id])),'🩹 Błędne'); };
  $app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>run(shuffle(Q.filter(q=>q.s===b.dataset.s)),SECTIONS[b.dataset.s]));
}

/* ============ QUIZ ============ */
function run(items,title){
  window.scrollTo(0,0);
  let i=0; const wrong=[];
  function next(){
    if(i>=items.length) return finish();
    const q=items[i];
    $app.innerHTML=`${topBar(esc(title))}<div class="prog"><span style="width:${100*i/items.length}%"></span></div>
      <div class="q" id="qc"><div class="qlab"><span>${esc(SECTIONS[q.s])} · ${KIND[q.type]}</span><span>${i+1}/${items.length}</span></div>
      <div class="qt">${esc(q.q)}</div><div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
    $('bBack').onclick=home;
    const after=(ok,detail)=>{
      if(!ok) wrong.push(q);
      $('qc').classList.add(ok?'ok':'bad');
      $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Źle ❌'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
        <button class="btn primary wide" id="bNext" style="margin-top:10px">${i+1<items.length?'Dalej':'Wynik'}</button>`;
      $('bNext').onclick=()=>{ i++; next(); }; $('bNext').focus({preventScroll:true});
      $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    ({mc:askMc,tf:askTf,pairs:askPairs,multi:askMulti,order:askOrder})[q.type](q,after);
  }
  function finish(){
    const n=items.length, ok=n-wrong.length, pc=Math.round(100*ok/n);
    if(title==='Cały quiz'){ S.last={ok,n}; S.best=Math.max(S.best||0,pc); S.wrong=wrong.map(q=>q.id); }
    else if(title==='🩹 Błędne'){ S.wrong=wrong.map(q=>q.id); }
    else { S.wrong=[...new Set([...S.wrong.filter(id=>!items.some(q=>q.id===id)),...wrong.map(q=>q.id)])]; }
    save();
    window.scrollTo(0,0);
    $app.innerHTML=`${topBar(esc(title))}<div class="card" style="text-align:center"><div class="score">${ok}/${n}</div>
      <h2 style="margin-top:8px">${pc}% – ${!wrong.length?'bezbłędnie! 🏆':pc>=80?'bardzo dobrze! 👏':pc>=60?'nieźle – powtórz błędne.':'powtórz błędne i spróbuj jeszcze raz.'}</h2>
      <div class="row" style="justify-content:center;margin-top:10px">${wrong.length?'<button class="btn primary" id="bRep">Powtórz tylko błędne</button>':''}<button class="btn" id="bAgain">Jeszcze raz wszystko</button><button class="btn" id="bHome">Menu</button></div></div>
      ${wrong.length?`<div class="card"><h2>Do powtórzenia (${wrong.length})</h2>${wrong.map(q=>`<div class="diff"><div class="qq">${esc(q.q)}</div><div>✅ ${answerText(q)}</div><div class="muted small">${esc(q.e)}</div></div>`).join('')}</div>`:''}`;
    $('bBack').onclick=home; $('bHome').onclick=home;
    $('bAgain').onclick=()=>run(shuffle(items),title);
    if(wrong.length) $('bRep').onclick=()=>run(shuffle(wrong),'🩹 Błędne');
  }
  next();
}

/* ============ TYPY PYTAŃ ============ */
function askMc(q,after){
  const order=shuffle(q.o.map((_,i)=>i));
  $('ans').innerHTML=`<div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===0;
    btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===0) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${esc(q.o[0])}</b></div>`); });
}
function askTf(q,after){
  $('ans').innerHTML=`<div class="opts two"><button class="opt" data-v="1">Prawda</button><button class="opt" data-v="0">Fałsz</button></div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=(b.dataset.v==='1')===q.val;
    btns.forEach(x=>{ x.disabled=true; if((x.dataset.v==='1')===q.val) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${q.val?'Prawda':'Fałsz'}</b></div>`); });
}
function askMulti(q,after){
  const order=shuffle(q.o.map((_,i)=>i)), sel=new Set();
  $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Zaznacz wszystkie poprawne odpowiedzi i naciśnij „Sprawdź”.</p>
    <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}"><span class="box">☐</span> ${esc(q.o[i][0])}</button>`).join('')}</div>
    <button class="btn primary wide" id="bChk" style="margin-top:12px" disabled>Sprawdź</button>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; sel.has(i)?sel.delete(i):sel.add(i);
    b.classList.toggle('sel',sel.has(i)); b.querySelector('.box').textContent=sel.has(i)?'☑':'☐'; $('bChk').disabled=!sel.size; });
  $('bChk').onclick=()=>{
    let ok=true;
    btns.forEach(b=>{ const i=+b.dataset.i, good=!!q.o[i][1], picked=sel.has(i); b.disabled=true; b.classList.remove('sel');
      if(good&&picked) b.classList.add('ok'); else if(!good&&picked){ b.classList.add('no'); ok=false; } else if(good&&!picked){ b.classList.add('miss'); ok=false; } });
    $('bChk').remove();
    after(ok,ok?'':`<div>Poprawne: <b>${answerText(q)}</b></div><div class="muted small">Przerywana zielona ramka = to też trzeba było zaznaczyć.</div>`);
  };
}
function askOrder(q,after){
  let pool=shuffle(q.items.map((_,i)=>i)); while(pool.every((v,k)=>v===k)) pool=shuffle(pool);
  const chosen=[]; let locked=false;
  const draw=()=>{
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotykaj po kolei. Dotknięcie ułożonego elementu cofa go.</p>
      <div class="ord">${chosen.map((v,k)=>`<button class="slot full" data-k="${k}"><span class="k">${k+1}</span>${esc(q.items[v])}</button>`).join('')}${chosen.length<q.items.length?`<div class="slot"><span class="k">${chosen.length+1}</span><span class="muted small">wybierz z listy poniżej</span></div>`:''}</div>
      <div class="pool">${pool.filter(v=>!chosen.includes(v)).map(v=>`<button class="opt" data-v="${v}">${esc(q.items[v])}</button>`).join('')}</div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${chosen.length===q.items.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('.pool .opt').forEach(b=>b.onclick=()=>{ if(locked) return; chosen.push(+b.dataset.v); draw(); });
    $('ans').querySelectorAll('button.slot').forEach(b=>b.onclick=()=>{ if(locked) return; const k=+b.dataset.k; if(chosen[k]!=null){ chosen.splice(k,1); draw(); } });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=chosen.every((v,k)=>v===k);
    $('ans').querySelectorAll('button.slot').forEach(b=>{ const k=+b.dataset.k; b.disabled=true; b.classList.add(chosen[k]===k?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<div>Poprawna kolejność: <b>${answerText(q)}</b></div>`);
  };
  draw();
}
function askPairs(q,after){
  const L=q.p.map((p,i)=>({i,t:p[0]})), R=shuffle(q.p.map((p,i)=>({i,t:p[1]})));
  const match={}; let selL=null, locked=false;   // match[indeks lewej] = indeks prawej
  const draw=()=>{
    const keys=Object.keys(match);
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotknij pojęcia po lewej, a potem pasującego po prawej.</p>
      <div class="pairs"><div class="col">${L.map(l=>{ const k=keys.indexOf(String(l.i)); return `<button class="pb${selL===l.i?' sel':''}" data-l="${l.i}">${esc(l.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div>
      <div class="col">${R.map(r=>{ const li=keys.find(k=>match[k]===r.i); const k=li!=null?keys.indexOf(li):-1; return `<button class="pb" data-r="${r.i}">${esc(r.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div></div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${keys.length===L.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ if(locked) return; const i=+b.dataset.l; if(i in match){ delete match[i]; selL=i; } else selL=selL===i?null:i; draw(); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(locked||selL===null) return; const r=+b.dataset.r; const prev=Object.keys(match).find(k=>match[k]===r); if(prev!=null) delete match[prev]; match[selL]=r; selL=null; draw(); });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=L.every(l=>match[l.i]===l.i);
    $('ans').querySelectorAll('[data-l]').forEach(b=>{ const i=+b.dataset.l; b.disabled=true; b.classList.add(match[i]===i?'ok':'no'); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>{ b.disabled=true; const r=+b.dataset.r; const li=Object.keys(match).find(k=>match[k]===r); b.classList.add(+li===r?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<ul>${q.p.map(([a,b],i)=>`<li>${match[i]===i?'✅':'❌'} ${esc(a)} → <b>${esc(b)}</b></li>`).join('')}</ul>`);
  };
  draw();
}

/* ============ START ============ */
home();
</script>
