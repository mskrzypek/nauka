<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7F3; --grid:#DFEBE2; --ink:#16271D; --muted:#56695C; --line:#CADCCF; --surface:#FFFFFF; --soft:#E9F2EC;
  --accent:#2E8B57; --accent-ink:#FFFFFF; --ok:#1C7F54; --okbg:#E2F3EA; --bad:#C0284E; --badbg:#FBE5EB; --warn:#9A6700; --warnbg:#FFF4D6;
  --sel:#2F5BD3; --selbg:#E6EDFF;
  --shadow:0 1px 2px rgba(22,39,29,.06),0 6px 18px rgba(22,39,29,.06);
  --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1813; --grid:#16231B; --ink:#E6F0E9; --muted:#9DB3A4; --line:#29402F; --surface:#15221A; --soft:#1B2B21;
    --accent:#5CC98A; --accent-ink:#0F1813; --ok:#55D197; --okbg:#10362A; --bad:#FF7C9C; --badbg:#3C1628; --warn:#FFD36B; --warnbg:#3A3116;
    --sel:#8FB0FF; --selbg:#1C2847; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--ink); font:18px/1.5 var(--fb); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px}
.wrap{max-width:660px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px max(90px,calc(env(safe-area-inset-bottom) + 80px))}
h1,h2{font-family:var(--fh); line-height:1.12; margin:0}
h1{font-size:clamp(26px,7vw,36px); font-weight:800; letter-spacing:-.02em}
h2{font-size:21px; font-weight:800; margin-bottom:8px}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.btn{border:2px solid var(--ink); background:transparent; border-radius:12px; padding:9px 16px; font:800 16px var(--fh)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%; padding:13px}
.btn:disabled{opacity:.4}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15px; font-weight:700}
.big{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow); margin-bottom:10px}
.big .i{font-size:28px; width:38px; text-align:center; flex:none}
.big .t{font:800 18px var(--fh); display:block}
.big .d{color:var(--muted); font-size:14px; line-height:1.35; display:block}
.big.dark{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.big.dark .d{color:var(--paper); opacity:.8}
.big.trap{border:2px solid #E0A800}
.bar{height:7px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; background:var(--ok); border-radius:6px}
.top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.back{border:1px solid var(--line); background:var(--surface); width:44px; height:44px; border-radius:50%; font-size:20px; flex:none; box-shadow:var(--shadow)}
.prog{height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:12px}
.prog span{display:block; height:100%; background:var(--accent); transition:width .25s}

/* fiszka */
.q{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow)}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.qlab{font:700 13px var(--fh); color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.qt{font:800 21px/1.3 var(--fh); margin:6px 0 14px}
.tag{display:inline-block; background:var(--warnbg); color:var(--warn); border-radius:8px; padding:0 8px; font:700 12px var(--fh)}
.opts{display:grid; gap:8px}
.opt{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; line-height:1.35; font-weight:700}
.opts.two{grid-template-columns:repeat(2,1fr)} .opts.two .opt{text-align:center; padding:16px 4px; font-size:17px}
.opts.five{grid-template-columns:repeat(5,1fr); gap:6px} .opts.five .opt{text-align:center; padding:16px 2px; font-size:16px}
.opts.three{grid-template-columns:repeat(3,1fr)} .opts.three .opt{text-align:center; padding:16px 4px; font-size:17px}
.opt.ok{border-color:var(--ok); background:var(--okbg)} .opt.no{border-color:var(--bad); background:var(--badbg)}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pairs .col{display:grid; gap:8px; align-content:start}
.pb{position:relative; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 10px 9px 12px; line-height:1.3; font-size:15px; font-weight:700; min-height:48px}
.pb.sel{border-color:var(--sel); background:var(--selbg)}
.pb .n{position:absolute; top:-8px; right:-6px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:800 12px var(--fh); color:#fff}
.pb.ok{border-color:var(--ok); background:var(--okbg)} .pb.no{border-color:var(--bad); background:var(--badbg)}
.why{margin-top:12px; border-radius:14px; padding:12px 14px}
.why.ok{background:var(--okbg)} .why.bad{background:var(--badbg)}
.why .h{font:800 18px var(--fh)}
.why .w{margin-top:6px; font-size:16px}
.why ul{margin:6px 0 0; padding-left:1.1em; font-size:16px}
.diff{border-top:1px solid var(--line); padding:10px 0}
.diff .qq{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ============ GRACZ ============ */
const KIDS={wiktor:'Wiktor',igor:'Igor',zoja:'Zoja'};
let kid=(new URLSearchParams(location.search).get('dla')||'wiktor').toLowerCase();
if(!KIDS[kid]) kid='wiktor';

/* ============ PYTANIA ============ */
// Treść wyłącznie z materiału „B7b · Rośliny okrytonasienne” i jego klucza.
// mc: o[0] = poprawna odpowiedź (kolejność jest losowana; Prawda/Fałsz i Tak/Nie – stała). pairs: [lewa, prawa] = poprawne pary.
// fx: stałe przyciski (drzewo / krzew / krzewinka, korzeń / łodyga / liść), c = indeks poprawnej.
// trap: najczęstsze pułapki (częściej w powtórkach + osobny tryb „Pułapki”).
const GROUPS=[
  {id:'g1',n:'Formy, jedno- i dwuliścienne',i:'🌾'},
  {id:'g2',n:'Przekształcenia organów',i:'🥔'},
  {id:'g3',n:'Liść i rozmnażanie wegetatywne',i:'🍃'},
  {id:'g4',n:'Kwiat i zapylenie',i:'🌸'},
  {id:'g5',n:'Kwiatostany',i:'🌻'},
  {id:'g6',n:'Nasiono i rozsiewanie',i:'🌰'},
  {id:'g7',n:'16 drzew',i:'🌳'},
  {id:'g8',n:'Rośliny użytkowe',i:'🌽'},
];
const Q=[];
const FORM=['drzewo','krzew','krzewinka'], ORG=['korzeń','łodyga','liść'];
const mc=(g,id,q,o,e,trap)=>Q.push({g,id,type:'mc',q,o,c:0,e,trap:!!trap});
const fx=(g,id,q,opts,ans,e,trap)=>Q.push({g,id,type:'mc',q,o:opts,c:opts.indexOf(ans),fixed:true,e,trap:!!trap});
const pairs=(g,id,q,p,e,trap)=>Q.push({g,id,type:'pairs',q,p,e,trap:!!trap});

// 1. Formy, jedno- i dwuliścienne
fx('g1','1a','Leszczyna pospolita rozgałęzia się już przy ziemi na kilka równorzędnych pędów. To…',FORM,'krzew','Krzew rozgałęzia się przy ziemi na kilka równorzędnych pędów (leszczyna, bez czarny), a drzewo ma jeden pień.',true);
fx('g1','1b','Borówka czernica – niska (do ok. pół metra), zdrewniała u dołu, silnie rozgałęziona, płożąca się. To…',FORM,'krzewinka','Krzewinka to niska, wieloletnia roślina zdrewniała u dołu, często płożąca się – borówka czernica, wrzos, żurawina.');
mc('g1','1c','Od czego pochodzi nazwa „jednoliścienne”?',['od liczby liścieni w zarodku nasiona','od liczby liści na roślinie','od jednego liścia na każdej łodydze','od kształtu liści'],'Jednoliścienne mają w zarodku jeden liścień (ziarno kukurydzy), dwuliścienne – dwa (fasola rozłupuje się na dwie połówki); nie chodzi o liczbę liści.',true);
mc('g1','1d','Która trójka cech pasuje do roślin JEDNOLIŚCIENNYCH?',['korzenie wiązkowe, unerwienie równoległe, części kwiatu po 3','korzeń palowy, unerwienie siateczkowate, części kwiatu po 5','korzenie wiązkowe, unerwienie siateczkowate, części kwiatu po 4','korzeń palowy, unerwienie równoległe, części kwiatu po 3'],'Dwuliścienne mają odwrotnie: korzeń palowy, unerwienie siateczkowate i części kwiatu po 4 lub 5.');
mc('g1','1e','Który zestaw to same rośliny jednoliścienne?',['pszenica, kukurydza, tulipan, cebula, storczyk, aloes','fasola, róża, słonecznik, dąb','pszenica, fasola, tulipan, marchew','kukurydza, ziemniak, cebula, róża'],'Jednoliścienne: trawy, zboża, kukurydza, tulipan, lilia, cebula, storczyki, aloes; dwuliścienne: fasola, róża, słonecznik, dąb, marchew, ziemniak.');

// 2. Przekształcenia organów
fx('g2','2a','Bulwa ziemniaka powstała z…',ORG,'łodyga','Bulwa ma pąki („oczka”), z których wyrastają nowe pędy, i rośnie na końcach podziemnych pędów – a korzenie pąków nie mają.',true);
mc('g2','2b','Prawda czy fałsz: „Marchew to przekształcona łodyga.”',['Fałsz – to korzeń spichrzowy','Prawda'],'Marchew i burak to korzenie spichrzowe – magazyn substancji zapasowych; łodygą jest bulwa ziemniaka.',true);
fx('g2','2c','Cebula (jej jadalna część) to głównie przekształcone…',ORG,'liść','Cebula to mięsiste liście spichrzowe na krótkiej łodydze (piętce) – magazyn i przetrwanie.',true);
fx('g2','2d','Wąsy grochu powstały z…',ORG,'liść','Wąsy grochu są liściowe, a wąsy winorośli – łodygowe; jedne i drugie przyczepiają pnącze.',true);
fx('g2','2e','Ciernie kaktusa powstały z…',ORG,'liść','Kaktus ma ciernie zamiast liści (mała powierzchnia = mało parowania, ochrona); ciernie głogu i tarniny to łodyga.',true);
fx('g2','2f','Kłącze konwalii (i perzu) to…',ORG,'łodyga','Kłącze to łodyga podziemna rosnąca poziomo – magazyn, przetrwanie zimy, rozmnażanie; dlatego perz tak trudno wyplenić.');
pairs('g2','2g','Przekształcone korzenie – do czego służą?',[['spichrzowy (marchew, burak)','magazyn substancji zapasowych'],['czepne (bluszcz)','przyczepianie do muru, pnia'],['podporowe (kukurydza)','podpierają roślinę u nasady łodygi'],['powietrzne (storczyk)','pochłaniają wilgoć z powietrza'],['ssawki (jemioła)','pobierają wodę z rośliny żywiciela']],'Przy każdej przekształconej części pytaj: z czego powstała i do czego służy – klucz chce obu.');
pairs('g2','2h','Do czego służy dane przekształcenie?',[['bulwa ziemniaka (łodyga)','magazyn skrobi, rozmnażanie'],['rozłogi truskawki (łodyga)','rozmnażanie wegetatywne'],['wąsy winorośli (łodyga)','przyczepianie pnącza'],['liście rosiczki (liść)','pułapki – zdobywanie azotu'],['liście aloesu (liść)','miękisz wodny – magazyn wody']],'Liście pułapkowe zdobywają azot na ubogich glebach, a mięsiste liście sukulentów z suchych miejsc magazynują wodę.');

// 3. Liść i rozmnażanie wegetatywne
pairs('g3','3a','Dobierz cechę budowy liścia do funkcji.',[['miękisz palisadowy pełen chloroplastów','fotosynteza'],['skórka z aparatami szparkowymi','wymiana gazowa i transpiracja'],['kutikula (woskowa warstwa)','ochrona przed utratą wody'],['nerwy (wiązki drewna i łyka)','doprowadzają wodę, odprowadzają cukry'],['blaszka, ogonek, nerwy','części liścia']],'Na konkursie pytają o związek budowy z funkcją: cecha budowy + do czego służy.');
pairs('g3','3b','Rozmnażanie wegetatywne – dobierz sposób do rośliny.',[['rozłogi','truskawka'],['kłącza','perz'],['cebule','tulipan'],['sadzonki','wierzba, pelargonia'],['szczepienie','drzewa owocowe']],'Do tego bulwy (ziemniak) i odkłady – przygięty pęd ukorzenia się w ziemi.');
mc('g3','3c','Dlaczego rośliny z rozmnażania wegetatywnego są wierną kopią rośliny matecznej?',['nie ma zapłodnienia – mają ten sam materiał genetyczny','wyrastają z nasion rośliny matecznej','zapyla je ten sam owad','mają tyle samo liścieni'],'Nowa roślina powstaje z części starej, bez kwiatów i nasion – nie ma łączenia komórek rozrodczych.');

// 4. Kwiat i zapylenie
pairs('g4','4a','Budowa kwiatu – z czego się składa?',[['pręcik','nitka + pylnik'],['słupek','znamię + szyjka + zalążnia'],['okwiat','kielich + korona']],'Kwiat obupłciowy ma pręciki i słupek (jabłoń, tulipan), jednopłciowy – tylko pręciki albo tylko słupki (kukurydza, leszczyna).');
mc('g4','4b','Zapylenie to…',['przeniesienie pyłku z pylnika na znamię słupka','połączenie komórki plemnikowej z komórką jajową w zalążku','powstanie owocu z zalążni','wytworzenie nektaru'],'Zapylenie zachodzi na znamieniu, a zapłodnienie – w zalążku: łagiewka pyłkowa wrasta przez szyjkę i dostarcza komórkę plemnikową (bez wody).',true);
mc('g4','4c','Z czego powstaje owoc, a z czego nasiono?',['owoc z zalążni, nasiono z zalążka','owoc z zalążka, nasiono z zalążni','owoc z pylnika, nasiono ze znamienia','oba z dna kwiatowego'],'Po zapłodnieniu z zalążka powstaje nasiono, a z zalążni – owoc, który okrywa nasiona (stąd nazwa okrytonasienne).',true);
mc('g4','4d','Miąższ jabłka powstaje głównie z…',['dna kwiatowego – to owoc rzekomy','zalążka','kielicha','pylników'],'„Oczko” na końcu jabłka to zasuszone działki kielicha, a ogonek to szypułka.',true);
mc('g4','4e','Które cechy ma kwiat WIATROPYLNY?',['niepozorny, dużo suchego pyłku, wystające pręciki, pierzaste znamiona','barwny, pachnący, z nektarem i lepkim pyłkiem','duży i barwny, pręciki schowane w kwiecie','pachnący, z nektarem, mało pyłku'],'Wiatropylny nie musi nikogo wabić: wystające pręciki pozwalają wiatrowi porywać pyłek, a pierzaste znamiona łatwiej go „łapią”.');
mc('g4','4f','Który zestaw to same rośliny wiatropylne?',['trawy, kukurydza, leszczyna, brzoza, olsza','jabłoń, rzepak, lipa, mniszek','mniszek, róża, leszczyna, brzoza','lipa, brzoza, jabłoń, kukurydza'],'Owadopylne: jabłoń, rzepak, lipa, mniszek, róża; wiatropylne: trawy, zboża, kukurydza, leszczyna, brzoza, olsza, topola.',true);
mc('g4','4g','Zapylanie kwiatów przez pszczoły to zależność…',['nieantagonistyczna – żaden organizm nie traci','antagonistyczna – pszczoła zabiera nektar','antagonistyczna – kwiat traci pyłek','pasożytnictwo'],'Roślina zostaje zapylona, owad dostaje pokarm (mutualizm); antagonistyczna – gdy przynajmniej jeden organizm traci.');

// 5. Kwiatostany
pairs('g5','5a','Dobierz roślinę do kwiatostanu.',[['żyto, pszenica','kłos'],['konwalia','grono'],['marchew','baldach'],['stokrotka, rumianek','koszyczek']],'Kwiatostan to pęd z wieloma kwiatami ułożonymi w określony sposób.');
pairs('g5','5b','Dobierz kwiatostan do rośliny.',[['główka','koniczyna'],['kolba','kukurydza'],['wiecha','owies'],['koszyczek','słonecznik']],'Kukurydza ma kolbę (żeńską) i wiechę (męską); owies – luźną wiechę z kłoskami jak dzwoneczki.');
mc('g5','5c','„Kwiat” słonecznika to tak naprawdę…',['koszyczek – setki drobnych kwiatów','jeden duży kwiat','baldach','kolba'],'Tak samo „kwiat” rumianku i stokrotki to koszyczek.',true);

// 6. Nasiono i rozsiewanie
pairs('g6','6a','Części nasienia – do czego służą?',[['łupina nasienna','ochrona przed uszkodzeniem i wyschnięciem'],['zarodek (korzonek, pączek, liścienie)','mała roślinka – rozwinie się w nową'],['tkanka zapasowa','pokarm dla kiełkującego zarodka']],'Zapas pokarmu: u zbóż i kukurydzy w bielmie (z niego mąka), u fasoli i grochu w liścieniach.');
mc('g6','6b','Czego zwykle NIE potrzebuje nasiono do kiełkowania?',['światła','wody','tlenu','odpowiedniej temperatury'],'Zapas pokarmu jest w nasieniu, więc światło zwykle nie jest potrzebne (fasola kiełkuje też w ciemności); pierwszy wyrasta korzeń.',true);
pairs('g6','6c','Kto lub co rozsiewa owoce i nasiona?',[['skrzydlaki (klon, jesion)','wiatr'],['mięsiste owoce (wiśnia, jarzębina)','zwierzęta, które je zjadają'],['haczyki (łopian, przytulia)','zwierzęta – czepiają się sierści'],['żołędzie, orzechy, bukiew','zwierzęta zbierające zapasy'],['pękający owoc (niecierpek, groch)','sama roślina']],'Wiatr roznosi też orzeszki ze skrzydełkami (brzoza, grab) i nasiona z puchem (mniszek, wierzba).');
mc('g6','6d','Nasiona którego drzewa roznosi wiatr?',['brzoza brodawkowata','buk pospolity','kasztanowiec pospolity','leszczyna pospolita'],'Pytaj: czy owoc ma skrzydełko albo puch? Duże, ciężkie owoce bez skrzydełek (bukiew, kasztan, orzechy) roznoszą zwierzęta, nie wiatr.',true);

// 7. 16 drzew
mc('g7','7a','Który gatunek? Żołędzie na długich szypułkach; liść prawie bez ogonka, u nasady „uszka”.',['dąb szypułkowy','dąb bezszypułkowy','buk pospolity','grab zwyczajny'],'Dąb szypułkowy – żołędzie na szypułkach, liść prawie bez ogonka; bezszypułkowy – odwrotnie.',true);
mc('g7','7b','Który gatunek? Żołędzie siedzące (bez szypułek); liść z dłuższym ogonkiem, bez „uszek”.',['dąb bezszypułkowy','dąb szypułkowy','buk pospolity','kasztanowiec pospolity'],'Dąb bezszypułkowy – żołędzie siedzące, a liść z ogonkiem; u szypułkowego szypułkę ma żołądź, nie liść.',true);
mc('g7','7c','Który gatunek? Liść dłoniasto klapowany, klapy z ostrymi ząbkami, mleczny sok w ogonku; skrzydlaki rozwarte prawie poziomo.',['klon zwyczajny','klon jawor','klon polny','klon jesionolistny'],'Klon zwyczajny – ostre ząbki, skrzydlaki szeroko; jawor – karbowany brzeg, skrzydlaki wąsko; polny – małe tępe klapy, skrzydlaki w linii.',true);
mc('g7','7d','Który gatunek? Duży liść, 5 klap, brzeg karbowano-piłkowany, bez mlecznego soku, spód sinawy; skrzydlaki pod ostrym kątem.',['klon jawor','klon zwyczajny','klon polny','klon jesionolistny'],'Jawor ma karbowany brzeg i skrzydlaki ustawione wąsko (prawie równolegle), a klon zwyczajny – ostre ząbki i skrzydlaki szeroko.',true);
mc('g7','7e','Który gatunek? Mały liść, 3–5 klap o tępych, zaokrąglonych końcach; skrzydlaki ułożone poziomo, w jednej linii.',['klon polny','klon zwyczajny','klon jawor','klon jesionolistny'],'Klon polny – mały liść z tępymi klapami i skrzydlaki w jednej linii.',true);
mc('g7','7f','Który gatunek? Liść złożony z 9–13 listków, czarne pąki; pojedyncze skrzydlaki w pękach.',['jesion wyniosły','klon jesionolistny','kasztanowiec pospolity','klon jawor'],'Jesion i klon jesionolistny mają liście złożone: jesion 9–13 listków i pojedyncze skrzydlaki, klon jesionolistny 3–5 listków i podwójne skrzydlaki.',true);
mc('g7','7g','Który gatunek? Liść złożony z 3–5 listków; podwójne skrzydlaki pod ostrym kątem w zwisających gronach.',['klon jesionolistny','jesion wyniosły','kasztanowiec pospolity','klon polny'],'Klon jesionolistny ma liść podobny do jesionu, ale tylko 3–5 listków i podwójne skrzydlaki.',true);
mc('g7','7h','Który gatunek? Liść jajowaty, brzeg gładki, falisty; trójgraniaste orzeszki po 2–3 w kolczastej okrywie.',['buk pospolity','grab zwyczajny','kasztanowiec pospolity','lipa drobnolistna'],'Buk – brzeg gładki, owoc (bukiew) w kolczastej okrywie pękającej na 4 części; grab – brzeg piłkowany i pofałdowany.',true);
mc('g7','7i','Który gatunek? Liść pofałdowany wzdłuż nerwów, podwójnie piłkowany; żeberkowany orzeszek u nasady trójklapowego skrzydełka.',['grab zwyczajny','buk pospolity','brzoza brodawkowata','lipa szerokolistna'],'Grab – orzeszek u nasady skrzydełka z 3 klapami; lipa – kuliste orzeszki na szypułce przyrośniętej do jednego, języczkowatego skrzydełka.',true);
mc('g7','7j','Który gatunek? Liść sercowaty, mały (4–7 cm), spód z rdzawymi kępkami włosków; kuliste orzeszki na wspólnej szypułce z podsadką.',['lipa drobnolistna','lipa szerokolistna','grab zwyczajny','olsza czarna'],'Lipa drobnolistna – mały liść z rdzawymi kępkami włosków; szerokolistna – większy liść, białawe kępki i orzeszki z żeberkami.',true);
mc('g7','7k','Który gatunek? Liść sercowaty, większy (do 12 cm), owłosiony, kępki włosków białawe; orzeszki z wyraźnymi żeberkami, z podsadką.',['lipa szerokolistna','lipa drobnolistna','grab zwyczajny','buk pospolity'],'Obie lipy mają sercowate liście i orzeszki na szypułce z podsadką – szerokolistną poznasz po większym liściu i żeberkach na orzeszkach.',true);
pairs('g7','7l','Dobierz gatunek do opisu.',[['olsza czarna','zdrewniałe „szyszeczki”, rośnie nad wodą'],['brzoza brodawkowata','biała kora, liść romboidalny'],['wierzba biała','liść wąski, lancetowaty, spód srebrzysty'],['kasztanowiec pospolity','liść dłoniasto złożony, kolczasta torebka'],['leszczyna pospolita','orzech laskowy, wiosną wiszące „bazie”']],'Na konkursie pisz pełną nazwę gatunkową – „dąb” bez „szypułkowy” = 0 pkt.');

// 8. Rośliny użytkowe
pairs('g8','8a','Dobierz roślinę do części użytkowej i produktu.',[['słonecznik','nasiona → olej'],['pszenica','ziarno (bielmo) → mąka, makaron'],['żyto (kłos z długimi ośćmi)','ziarno → mąka żytnia, chleb razowy'],['owies (wiecha)','ziarno → płatki owsiane'],['rzepak','nasiona → olej, biopaliwo'],['burak cukrowy','korzeń → cukier']],'Rzepak to też roślina miododajna, a burak ćwikłowy i pastewny to warzywo i pasza.');
pairs('g8','8b','Którą część tej rośliny wykorzystujemy?',[['marchew','korzeń'],['kapusta','liście (główka)'],['brukselka','pąki boczne na łodydze'],['kukurydza','ziarno z kolby']],'Marchew to korzeń spichrzowy (karoten), a „główki” brukselki to pąki boczne.');
mc('g8','8c','Chmiel to…',['pnącze; jego „szyszki” to kwiatostany żeńskie → piwo','roślina nagonasienna z szyszkami','zboże z kłosem → mąka','krzewinka z jagodami'],'Chmiel to dwuliścienne pnącze owijające się wokół podpór; „szyszki” to kwiatostany żeńskie z łuskami, a nie szyszki nagonasiennych.',true);

/* ============ ZAPIS ============ */
const KEY='b7b-fiszki-v1:'+kid, INT=[0,1,3,7,14], KNOWN=2;
let S={q:{},days:[],rounds:[]}, canSave=true;
try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){ canSave=false; }
const save=()=>{ if(!canSave) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ canSave=false; } };
const dayStr=d=>d.toLocaleDateString('sv');
const today=()=>dayStr(new Date());
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dayStr(d); };
const st=q=>S.q[q.id];
const box=q=>(st(q)||{}).b||0;
const known=q=>box(q)>=KNOWN;
// Pomyłka: pudełko 0 i powrót jeszcze dziś. Dobra odpowiedź: kolejne pudełko i coraz dłuższa przerwa (1, 3, 7, 14 dni).
function record(q,ok){
  const e=S.q[q.id]||(S.q[q.id]={b:0,due:today(),r:0,w:0});
  if(ok){ e.r++; e.b=Math.min(INT.length-1,e.b+1); e.due=addDays(INT[e.b]); } else { e.w++; e.b=0; e.due=today(); }
  const d=today(); if(!S.days.includes(d)) S.days.push(d); save();
}

/* ============ POMOCNICZE ============ */
const $app=document.getElementById('app'), $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pct=(a,b)=>b?Math.round(100*a/b):0;
const topBar=t=>`<div class="top"><button class="back" id="bBack" aria-label="Wróć">←</button><h2 style="margin:0;flex:1">${t}</h2></div>`;
const GN=Object.fromEntries(GROUPS.map(g=>[g.id,g]));
const COLORS=['#2F5BD3','#C2410C','#7C3AED','#0E7490'];
function streak(){ let n=0; const d=new Date(); if(!S.days.includes(dayStr(d))) d.setDate(d.getDate()-1); while(S.days.includes(dayStr(d))){ n++; d.setDate(d.getDate()-1); } return n; }

/* ============ DOBÓR FISZEK ============ */
// Najpierw te do powtórki (pomylone i z minionym terminem), potem nowe, a znane tylko wtedy, gdy brakuje innych.
function pick(pool,n){
  const t=today();
  const rank=q=>{ const e=st(q); let k;
    if(!e) k=1; else if(e.due<=t) k=e.b===0?0:.5; else k=2+e.b;
    return k-(q.trap?.4:0)+Math.random()*.6; };
  return pool.map(q=>({q,k:rank(q)})).sort((a,b)=>a.k-b.k).slice(0,n).map(x=>x.q);
}
const dueCount=pool=>pool.filter(q=>{ const e=st(q); return e&&e.due<=today(); }).length;
const hard=()=>Q.filter(q=>{ const e=st(q); return e&&e.w>0&&e.b<KNOWN; });

/* ============ EKRAN GŁÓWNY ============ */
function home(){
  window.scrollTo(0,0);
  const k=Q.filter(known).length, traps=Q.filter(q=>q.trap), hd=hard().length, s=streak(), due=dueCount(Q);
  $app.innerHTML=`<h1>🌸 B7b – rośliny okrytonasienne</h1>
    <p class="muted" style="margin-top:4px">Cześć, ${esc(KIDS[kid])}! Fiszki do konkursu: organy i ich przekształcenia, kwiat, nasiona, 16 drzew i rośliny użytkowe. To, co mylisz, wraca częściej; to, co umiesz – rzadziej.</p>
    <div class="pills"><span class="pill">🔥 ${s} ${s===1?'dzień':'dni'} z rzędu</span><span class="pill">✅ umiesz ${k} z ${Q.length}</span>${due?`<span class="pill">🔁 do powtórki: ${due}</span>`:''}</div>
    <button class="big dark" id="bAll"><span class="i">🎴</span><span><span class="t">Fiszki ze wszystkiego</span><span class="d">12 fiszek – najpierw powtórki i nowe</span></span></button>
    <button class="big trap" id="bTrap"><span class="i">⚠️</span><span><span class="t">Pułapki</span><span class="d">Bulwa to łodyga, zapylenie vs zapłodnienie, wiatr czy zwierzęta, pary drzew, które się mylą (${traps.filter(known).length}/${traps.length})</span></span></button>
    <button class="big" id="bHard" ${hd?'':'disabled style="opacity:.5"'}><span class="i">🩹</span><span><span class="t">Trudne</span><span class="d">${hd?`${hd} ${hd===1?'fiszka sprawia':hd<5?'fiszki sprawiają':'fiszek sprawia'} trudność`:'Na razie nic nie sprawia trudności'}</span></span></button>
    <div class="card"><h2>Grupy</h2>${GROUPS.map(g=>{ const l=Q.filter(q=>q.g===g.id), kk=l.filter(known).length;
      return `<button class="big" data-g="${g.id}" style="box-shadow:none;margin-bottom:8px"><span class="i">${g.i}</span><span style="flex:1"><span class="t">${esc(g.n)}</span><span class="d">umiesz ${kk} z ${l.length}${dueCount(l)?` · do powtórki ${dueCount(l)}`:''}</span><span class="bar"><span style="width:${pct(kk,l.length)}%"></span></span></span></button>`; }).join('')}</div>
    ${canSave?'':'<p class="muted small">Ta przeglądarka nie zapisze postępów.</p>'}`;
  $('bAll').onclick=()=>round(pick(Q,12),'Wszystko');
  $('bTrap').onclick=()=>round(pick(traps,12),'⚠️ Pułapki');
  $('bHard').onclick=()=>{ if(hard().length) round(pick(hard(),12),'🩹 Trudne'); };
  $app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const g=GN[b.dataset.g]; round(pick(Q.filter(q=>q.g===g.id),12),`${g.i} ${g.n}`); });
}

/* ============ RUNDA ============ */
function round(items,title){
  window.scrollTo(0,0);
  const queue=items.map(q=>({q,again:false})), total=items.length, log=new Map(); let done=0;
  function next(){
    if(!queue.length) return finish();
    const cur=queue.shift(), q=cur.q;
    $app.innerHTML=`${topBar(esc(title))}<div class="prog"><span style="width:${100*done/total}%"></span></div>
      <div class="q" id="qc"><div class="qlab"><span>${GN[q.g].i} ${esc(GN[q.g].n)}${q.trap?' <span class="tag">pułapka</span>':''}</span><span>${cur.again?'jeszcze raz 💪':`${done+1}/${total}`}</span></div>
      <div class="qt">${esc(q.q)}</div><div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
    $('bBack').onclick=home;
    const after=(ok,detail)=>{
      if(!cur.again) record(q,ok);
      const L=log.get(q.id)||{q,wrong:0}; if(!ok) L.wrong++; log.set(q.id,L);
      if(!ok&&!cur.again) queue.splice(Math.min(queue.length,3),0,{q,again:true}); // pomylona fiszka wraca w tej samej rundzie
      if(ok||cur.again) done++;
      $('qc').classList.add(ok?'ok':'bad');
      $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Nie tym razem'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
        <button class="btn primary wide" id="bNext" style="margin-top:10px">Dalej</button>`;
      $('bNext').onclick=next; $('bNext').focus({preventScroll:true});
      $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    if(q.type==='mc') askMc(q,after); else askPairs(q,after);
  }
  function finish(){
    const entries=[...log.values()], wrong=entries.filter(x=>x.wrong>0), ok=entries.length-wrong.length;
    S.rounds.push({d:today(),n:entries.length,ok}); save();
    $app.innerHTML=`${topBar(esc(title))}<div class="card" style="text-align:center"><div style="font:800 52px/1 var(--fh)">${ok}/${entries.length}</div>
      <h2 style="margin-top:8px">${!wrong.length?'Bezbłędnie! 🏆':wrong.length<=2?'Bardzo dobrze! 👏':'Dobra robota – trudne fiszki wrócą w powtórce.'}</h2>
      <p class="muted small">dobrze za pierwszym razem</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="bAgain">Kolejna runda</button><button class="btn" id="bHome">Menu</button></div></div>
      ${wrong.length?`<div class="card"><h2>Sprawiły trudność</h2>${wrong.map(x=>`<div class="diff"><div class="qq">${esc(x.q.q)}</div><div>✅ ${x.q.type==='mc'?esc(x.q.o[x.q.c||0]):x.q.p.map(([a,b])=>`${esc(a)} → ${esc(b)}`).join('<br>✅ ')}</div><div class="muted small">${esc(x.q.e)}</div></div>`).join('')}</div>`:''}`;
    $('bBack').onclick=home; $('bHome').onclick=home;
    $('bAgain').onclick=()=>{ const pool=title==='⚠️ Pułapki'?Q.filter(q=>q.trap):title==='🩹 Trudne'?(hard().length?hard():Q):title==='Wszystko'?Q:Q.filter(q=>`${GN[q.g].i} ${GN[q.g].n}`===title); round(pick(pool,12),title); };
  }
  next();
}

/* ============ WYBÓR Z 2–4 ============ */
function askMc(q,after){
  const C=q.c||0;
  const order=q.fixed?q.o.map((_,i)=>i):q.o.length===2&&/^(Fałsz|Prawda|Tak|Nie)\b/.test(q.o[0])?q.o.map((_,i)=>i).sort((a,b)=>/^(Prawda|Tak)\b/.test(q.o[a])?-1:1):shuffle(q.o.map((_,i)=>i));
  $('ans').innerHTML=`<div class="opts${q.fixed?' '+({2:'two',3:'three',5:'five'}[q.o.length]||''):''}">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===C;
    btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===C) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${esc(q.o[C])}</b></div>`); });
}

/* ============ DOBIERZ W PARY ============ */
function askPairs(q,after){
  const L=q.p.map((p,i)=>({i,t:p[0]})), R=shuffle(q.p.map((p,i)=>({i,t:p[1]})));
  const match={}; let selL=null, locked=false;   // match[indeks lewej] = indeks prawej
  const draw=()=>{
    const usedR=Object.values(match), num=Object.keys(match).map(Number);
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotknij pojęcia po lewej, a potem pasującego po prawej.</p>
      <div class="pairs"><div class="col">${L.map(l=>{ const k=num.indexOf(l.i); return `<button class="pb${selL===l.i?' sel':''}" data-l="${l.i}">${esc(l.t)}${l.i in match?`<span class="n" style="background:${COLORS[Object.keys(match).indexOf(String(l.i))%4]}">${Object.keys(match).indexOf(String(l.i))+1}</span>`:''}</button>`; }).join('')}</div>
      <div class="col">${R.map(r=>{ const li=Object.keys(match).find(k=>match[k]===r.i); const k=li!=null?Object.keys(match).indexOf(li):-1; return `<button class="pb" data-r="${r.i}">${esc(r.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div></div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${Object.keys(match).length===L.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ if(locked) return; const i=+b.dataset.l; if(i in match){ delete match[i]; selL=i; } else selL=selL===i?null:i; draw(); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(locked||selL===null) return; const r=+b.dataset.r; const prev=Object.keys(match).find(k=>match[k]===r); if(prev!=null) delete match[prev]; match[selL]=r; selL=null; draw(); });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=L.every(l=>match[l.i]===l.i);
    $('ans').querySelectorAll('[data-l]').forEach(b=>{ const i=+b.dataset.l; b.disabled=true; b.classList.add(match[i]===i?'ok':'no'); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>{ b.disabled=true; const r=+b.dataset.r; const li=Object.keys(match).find(k=>match[k]===r); b.classList.add(+li===r?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<ul>${q.p.map(([a,b],i)=>`<li>${match[i]===i?'✅':'❌'} ${esc(a)} → <b>${esc(b)}</b></li>`).join('')}</ul>`);
  };
  draw();
}

/* ============ START ============ */
home();
</script>
<script src="../nav.js" defer></script>
<script src="../learn.js" defer></script>
