<!doctype html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luki B1–B12 – czego jeszcze nie było</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7F3; --grid:#DFEBE2; --ink:#16271D; --muted:#56695C; --line:#CADCCF; --surface:#FFFFFF; --soft:#E9F2EC;
  --accent:#2E8B57; --accent-ink:#FFFFFF; --ok:#1C7F54; --okbg:#E2F3EA; --bad:#C0284E; --badbg:#FBE5EB; --warn:#9A6700; --warnbg:#FFF4D6;
  --sel:#2F5BD3; --selbg:#E6EDFF;
  --shadow:0 1px 2px rgba(22,39,29,.06),0 6px 18px rgba(22,39,29,.06);
  --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1813; --grid:#16231B; --ink:#E6F0E9; --muted:#9DB3A4; --line:#29402F; --surface:#15221A; --soft:#1B2B21;
    --accent:#5CC98A; --accent-ink:#0F1813; --ok:#55D197; --okbg:#10362A; --bad:#FF7C9C; --badbg:#3C1628; --warn:#FFD36B; --warnbg:#3A3116;
    --sel:#8FB0FF; --selbg:#1C2847; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--ink); font:18px/1.5 var(--fb); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px}
.wrap{max-width:660px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px max(90px,calc(env(safe-area-inset-bottom) + 80px))}
h1,h2{font-family:var(--fh); line-height:1.12; margin:0}
h1{font-size:clamp(26px,7vw,36px); font-weight:800; letter-spacing:-.02em}
h2{font-size:21px; font-weight:800; margin-bottom:8px}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.btn{border:2px solid var(--ink); background:transparent; border-radius:12px; padding:9px 16px; font:800 16px var(--fh)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%; padding:13px}
.btn:disabled{opacity:.4}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15px; font-weight:700}
.big{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow); margin-bottom:10px}
.big .i{font-size:28px; width:38px; text-align:center; flex:none}
.big .t{font:800 18px var(--fh); display:block}
.big .d{color:var(--muted); font-size:14px; line-height:1.35; display:block}
.big.dark{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.big.dark .d{color:var(--paper); opacity:.8}
.big.trap{border:2px solid #E0A800}
.bar{height:7px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; background:var(--ok); border-radius:6px}
.top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.back{border:1px solid var(--line); background:var(--surface); width:44px; height:44px; border-radius:50%; font-size:20px; flex:none; box-shadow:var(--shadow)}
.prog{height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:12px}
.prog span{display:block; height:100%; background:var(--accent); transition:width .25s}

/* fiszka */
.q{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow)}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.qlab{font:700 13px var(--fh); color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.qt{font:800 21px/1.3 var(--fh); margin:6px 0 14px}
.tag{display:inline-block; background:var(--warnbg); color:var(--warn); border-radius:8px; padding:0 8px; font:700 12px var(--fh)}
.opts{display:grid; gap:8px}
.opt{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; line-height:1.35; font-weight:700}
.opts.two{grid-template-columns:repeat(2,1fr)} .opts.two .opt{text-align:center; padding:16px 4px; font-size:17px}
.opts.five{grid-template-columns:repeat(5,1fr); gap:6px} .opts.five .opt{text-align:center; padding:16px 2px; font-size:16px}
.opts.three{grid-template-columns:repeat(3,1fr)} .opts.three .opt{text-align:center; padding:16px 4px; font-size:17px}
.opt.ok{border-color:var(--ok); background:var(--okbg)} .opt.no{border-color:var(--bad); background:var(--badbg)}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pairs .col{display:grid; gap:8px; align-content:start}
.pb{position:relative; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 10px 9px 12px; line-height:1.3; font-size:15px; font-weight:700; min-height:48px}
.pb.sel{border-color:var(--sel); background:var(--selbg)}
.pb .n{position:absolute; top:-8px; right:-6px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:800 12px var(--fh); color:#fff}
.pb.ok{border-color:var(--ok); background:var(--okbg)} .pb.no{border-color:var(--bad); background:var(--badbg)}
.why{margin-top:12px; border-radius:14px; padding:12px 14px}
.why.ok{background:var(--okbg)} .why.bad{background:var(--badbg)}
.why .h{font:800 18px var(--fh)}
.why .w{margin-top:6px; font-size:16px}
.why ul{margin:6px 0 0; padding-left:1.1em; font-size:16px}
.diff{border-top:1px solid var(--line); padding:10px 0}
.diff .qq{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* wybierz wszystkie + kolejność */
.opt.sel{border-color:var(--sel); background:var(--selbg)}
.opt.miss{border-style:dashed; border-color:var(--ok)}
.opt .box{display:inline-block; width:1.2em}
.ord{display:grid; gap:8px; margin-bottom:10px}
.slot{display:flex; gap:10px; align-items:center; min-height:46px; border:2px dashed var(--line); border-radius:12px; padding:8px 12px; text-align:left; background:transparent; font-weight:700}
.slot.full{border-style:solid; background:var(--surface)}
.slot .k{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--soft); font:800 13px var(--fh)}
.slot.ok{border-color:var(--ok); background:var(--okbg)} .slot.no{border-color:var(--bad); background:var(--badbg)}
.pool{display:flex; flex-wrap:wrap; gap:8px}
.pool .opt{flex:1 1 auto}
.ph{margin:0 0 12px} .ph img{display:block; width:100%; height:min(52vh,340px); object-fit:contain; background:var(--soft); border-radius:14px}
.ph figcaption{font-size:12px; color:var(--muted); margin-top:4px; text-align:right} .ph a{color:inherit}
.dimg{float:left; width:84px; height:84px; object-fit:cover; border-radius:10px; margin:2px 10px 4px 0} .diff{overflow:hidden}
.svgfig{margin:0 0 12px; background:var(--soft); border-radius:14px; padding:10px; color:var(--ink)} .svgfig svg{display:block; width:100%; max-height:230px}
.quote{margin:-4px 0 14px; padding:10px 14px; border-left:4px solid var(--sel); background:var(--selbg); border-radius:10px; font-style:italic; font-weight:700}
.score{font:800 56px/1 var(--fh)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ============ GRACZ ============ */
const KIDS={wiktor:'Wiktor',igor:'Igor',zoja:'Zoja'};
let kid=(new URLSearchParams(location.search).get('dla')||'wiktor').toLowerCase();
if(!KIDS[kid]) kid='wiktor';

/* ============ PYTANIA ============ */
// „Luki B1–B12” – fakty, których nie było w innych quizach; wersja podana przez tatę.
// mc: o[0] = poprawna. tf: zdanie + true/false. pairs: [lewa, prawa]. multi: [tekst, czy pasuje]. order: elementy w poprawnej kolejności.
const SECTIONS={b1:'B1/B2 – technika',b3:'B3 – chemizm i komórki',b4:'B4 – choroby i odporność',b5:'B5 – fotosynteza i oddychanie',b6:'B6 – kręgowce',b7a:'B7a – nagonasienne i paprotniki',b7b:'B7b – okrytonasienne',b8:'B8 – protisty i grzyby',b9a1:'B9a1 – odżywianie i skóra',b9a2:'B9a2 – krążenie i odporność',b9b1:'B9b1 – wydalanie i oddychanie',b9b2:'B9b2 – nerwy i zmysły',b12:'B12 – bezkręgowce'};
const Q=[];
const mc=(s,id,q,o,e)=>Q.push({s,id,type:'mc',q,o,e});
const tf=(s,id,q,val,e)=>Q.push({s,id,type:'tf',q,val,e});
const pairs=(s,id,q,p,e)=>Q.push({s,id,type:'pairs',q,p,e});
const multi=(s,id,q,o,e)=>Q.push({s,id,type:'multi',q,o,e});
const order=(s,id,q,items,e)=>Q.push({s,id,type:'order',q,items,e});

// B1/B2 – technika
mc('b1','a1','Oznaczasz roślinę kluczem dwudzielnym. Jak to robisz?',['zaczynam od pary 1, czytam oba zdania i zapisuję ścieżkę, np. 1b → 3b → 5b → 6a','zaczynam od pary, która pasuje do koloru kwiatów','czytam tylko zdanie a w każdej parze','zapisuję tylko końcową nazwę'],'W kluczu budowa jest ważniejsza niż kolor; zapisana ścieżka pozwala sprawdzić, gdzie się pomyliłeś.');
mc('b1','a2','Układasz własny klucz dwudzielny. Która para zdań jest poprawna?',['1a liście igiełkowate – 1b liście szerokie, płaskie','1a liście igiełkowate – 1b roślina rośnie w lesie','1a kwiaty żółte – 1b łodyga wysoka','1a ma szyszki – 1b ma liście'],'Zdania a i b w parze dotyczą tej samej cechy i są przeciwstawne.');
mc('b1','a3','Okular powiększa 20 razy, a obiektyw 60 razy. Jakie jest powiększenie mikroskopu?',['1200 razy','80 razy','3 razy','600 razy'],'Powiększenie = okular × obiektyw, np. 10 × 40 = 400, 20 × 60 = 1200.');
mc('b1','a4','Największa wartość w danych to 37, a na osi masz 10 kratek. Jaką skalę wybierzesz?',['4 na kratkę','3,7 na kratkę','3 na kratkę','37 na kratkę'],'Największa wartość : liczba kratek = 3,7 → zaokrąglasz w górę do 1, 2, 4, 5 lub 10, czyli do 4; skala musi być równa.');
multi('b1','a5','Zaznacz wszystkie czynności życiowe organizmów.',[['odżywianie',1],['oddychanie',1],['wydalanie',1],['ruch',1],['reagowanie na bodźce',1],['wzrost i rozwój',1],['rozmnażanie',1],['rdzewienie',0],['krystalizacja',0]],'Czynności życiowych jest siedem – wszystkie zaznaczone poprawne.');
mc('b1','a6','Do którego królestwa należą wirusy?',['do żadnego – nie są organizmami','do bakterii','do protistów','do grzybów'],'Królestwa to: bakterie, protisty, grzyby, rośliny i zwierzęta.');

// B3 – chemizm i komórki
order('b3','b1','Ułóż poziomy organizacji od najprostszego.',['pierwiastek (węgiel)','prosta cząsteczka (glukoza)','makrocząsteczka (skrobia)','organellum (mitochondrium)','komórka'],'Inne przykłady: żelazo – aminokwas – białko lub DNA – rybosom – komórka.');
mc('b3','b2','Który pierwiastek buduje i białka, i DNA?',['azot','siarka','wapń','magnez'],'Azot i siarka budują białka (siarka np. w keratynie), ale w DNA jest tylko azot.');
multi('b3','b3','Zaznacz makroelementy.',[['węgiel (C)',1],['fosfor (P)',1],['siarka (S)',1],['wapń (Ca)',1],['potas (K)',1],['żelazo (Fe)',0],['jod (I)',0]],'Makroelementy: C, H, O, N, P, S, Ca, Mg, K, Na, Cl; żelazo i jod to mikroelementy.');
mc('b3','b4','Euglena ma chloroplasty. Czy jest rośliną?',['nie – to protist: jednokomórkowa, bez ściany z celulozy, z wicią, w ciemności cudzożywna','tak – bo ma chloroplasty','tak – bo jest samożywna','nie – to bakteria'],'Chloroplasty nie wystarczą – euglena nie ma ściany z celulozy i w ciemności odżywia się cudzożywnie.');
multi('b3','b5','Zaznacz cechy tkanki mięśniowej serca.',[['komórki rozgałęzione, połączone wstawkami',1],['skurcze rytmiczne',1],['niezależna od woli',1],['nie męczy się',1],['zależna od woli',0],['komórki wrzecionowate z jednym jądrem',0]],'Komórki wrzecionowate z jednym jądrem ma tkanka gładka.');

// B4 – choroby i odporność
pairs('b4','c1','Dobierz chorobę do opisu.',[['COVID-19','wirus, kropelkowo – szczepionka, maseczki, dystans'],['ospa wietrzna','wirus – swędząca wysypka z pęcherzykami, szczepionka'],['Ebola','wirus – krew i płyny ciała chorego, izolacja chorych'],['krztusiec i błonica','bakterie – szczepionka razem z tężcem'],['angina i szkarlatyna','paciorkowce – brak szczepionki, antybiotyk']],'Ospa wietrzna jest bardzo zaraźliwa, a Ebola ma bardzo wysoką śmiertelność.');
multi('b4','c2','Zaznacz szczepienia OBOWIĄZKOWE.',[['gruźlica',1],['WZW B',1],['tężec',1],['odra',1],['polio',1],['grypa',0],['HPV',0],['kleszczowe zapalenie mózgu',0]],'Obowiązkowe są też błonica, krztusiec, świnka i różyczka; grypa, KZM i HPV to szczepienia zalecane.');
mc('b4','c3','Odporność zbiorowa to sytuacja, gdy…',['zaszczepiona jest większość ludzi, więc choroba trudno się przenosi – chroni to też tych, których nie można zaszczepić','dziecko dostaje przeciwciała od matki','cała klasa przechorowała grypę','grupa dostaje surowicę'],'Dlatego szczepienia chronią nie tylko zaszczepionego.');
pairs('b4','c4','Dobierz kształt bakterii do nazwy.',[['ziarniak','pojedyncza kulka'],['dwoinka','dwie kulki'],['paciorkowiec','kulki w łańcuszku'],['gronkowiec','kulki w „grono”'],['przecinkowiec','wygięta pałeczka'],['krętek','spiralka']],'Jest jeszcze pałeczka – wydłużona bakteria.');

// B5 – fotosynteza i oddychanie
order('b5','d1','Ułóż etapy doświadczenia „czy w liściu w świetle powstaje skrobia”.',['roślina 2 doby w ciemności','część liścia zasłonięta folią','roślina na świetle','liść w gorącym alkoholu (odbarwienie)','płyn Lugola – granatowa tylko część oświetlona'],'Skrobia powstaje tylko w świetle – zasłonięta część po płynie Lugola nie granatowieje.');
mc('b5','d2','Coraz silniej oświetlasz moczarkę. Co dzieje się z fotosyntezą?',['przyspiesza, ale tylko do nasycenia','przyspiesza bez końca','zwalnia','nie zmienia się'],'Więcej światła – szybsza fotosynteza, ale tylko do pewnej granicy (nasycenie).');
mc('b5','d3','Dlaczego w szklarniach dodaje się CO₂?',['więcej CO₂ (do granicy) przyspiesza fotosyntezę','CO₂ zastępuje roślinom wodę','CO₂ odstrasza szkodniki','rośliny oddychają CO₂ zamiast tlenu'],'CO₂ to substrat fotosyntezy – jego więcej przyspiesza ją, ale tylko do granicy.');
mc('b5','d4','Dlaczego kiełkujące nasiona w termosie się ogrzewają?',['w oddychaniu część energii ucieka jako ciepło','przeprowadzają fotosyntezę','fermentują alkoholowo','termos sam się grzeje'],'W fotosyntezie energia świetlna zamienia się w chemiczną (w glukozie), a w oddychaniu część energii uwalnia się jako ciepło.');
mc('b5','d5','Doświadczenie: czy drożdże potrzebują cukru do fermentacji? Jaka jest próba kontrolna?',['drożdże w wodzie bez cukru','drożdże z cukrem w lodówce','drożdże z podwójną ilością cukru','drożdże z cukrem we wrzątku'],'Kontrolna różni się tylko badanym czynnikiem – brakiem cukru.');
mc('b5','d6','Co jest w pęcherzykach wydzielanych w dzień przez moczarkę?',['tlen – w dzień fotosynteza przeważa nad oddychaniem','CO₂ z oddychania','para wodna','azot'],'W dzień roślina oddaje O₂, bo fotosynteza jest szybsza niż oddychanie.');

// B6 – kręgowce
pairs('b6','e1','Dobierz rybę do opisu.',[['łosoś','wędruje z morza do rzek na tarło'],['węgorz','wędruje z rzek do Morza Sargassowego'],['rekin i płaszczka','szkielet z chrząstki, bez pęcherza pławnego']],'Inne ryby: karp, szczupak, pstrąg, okoń, śledź, dorsz.');
mc('b6','e2','Dzięki czemu ryba unosi się i opada bez wysiłku?',['dzięki pęcherzowi pławnemu','dzięki linii bocznej','dzięki płetwie ogonowej','dzięki skrzelom'],'Pęcherz pławny reguluje zanurzenie, a linia boczna wyczuwa ruchy wody.');
multi('b6','e3','Zaznacz gady, których młode wykluwają się z jaj jeszcze w ciele matki.',[['żmija zygzakowata',1],['jaszczurka żyworodna',1],['jaszczurka zwinka',0],['żółw błotny',0]],'Gady linieją; polskie jaszczurki to zwinka, żyworodna i padalec (beznoga jaszczurka).');
pairs('b6','e4','Dobierz gromadę do jej znaczenia.',[['ryby','pokarm – białko, omega-3, jod, witamina D'],['płazy','zjadają owady i ślimaki, wskaźnik czystego środowiska'],['gady','zjadają gryzonie; z jadu żmii – surowica'],['ptaki','zjadają szkodniki i gryzonie']],'Każda gromada jest ważna w przyrodzie i dla człowieka.');
mc('b6','e5','Które pisklęta to zagniazdowniki?',['kury, kaczki, łabędzie','wróble, bociany, sowy','tylko sowy','wróble i kaczki'],'Zagniazdowniki są opierzone i od razu chodzą; gniazdowniki (wróbel, bocian, sowy) są nieporadne i karmione w gnieździe.');

// B7a – nagonasienne i paprotniki
multi('b7a','f1','Zaznacz znaczenie roślin nagonasiennych.',[['tworzą bory i produkują tlen',1],['nasiona z szyszek jedzą wiewiórki, dzięcioły i krzyżodzioby',1],['dają drewno',1],['dają żywicę',1],['dały węgiel kamienny',0]],'Węgiel kamienny powstał z paprotników sprzed ok. 300 mln lat.');
mc('b7a','f2','Która część cisa NIE jest trująca?',['czerwona osnówka','igły','nasiono','kora'],'Cis jest trujący w całości – oprócz czerwonej osnówki.');
pairs('b7a','f3','Z czego powstało?',[['węgiel kamienny','z paprotników sprzed ok. 300 mln lat'],['torf','z obumarłych torfowców']],'Torf powstaje z mchów (torfowców), a węgiel kamienny – z dawnych paprotników.');

// B7b – okrytonasienne

const KEY='luki-b1b12-v1:'+kid;
let S={wrong:[],last:null,best:null}, canSave=true;
try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){ canSave=false; }
const save=()=>{ if(!canSave) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ canSave=false; } };

/* ============ POMOCNICZE ============ */
const $app=document.getElementById('app'), $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const topBar=t=>`<div class="top"><button class="back" id="bBack" aria-label="Wróć">←</button><h2 style="margin:0;flex:1">${t}</h2></div>`;
const COLORS=['#2F5BD3','#C2410C','#7C3AED','#0E7490'];
const QN=Object.fromEntries(Q.map(q=>[q.id,q]));
const KIND={bin:'wybierz jedno z dwóch',mc:'wybierz jedną',tf:'prawda czy fałsz?',pairs:'dobierz w pary',multi:'zaznacz wszystkie pasujące',order:'ułóż w kolejności'};
function answerText(q){
  if(q.type==='mc') return esc(q.o[0]);
  if(q.type==='tf') return q.val?'Prawda':'Fałsz';
  if(q.type==='bin') return esc(q.l[q.c]);
  if(q.type==='pairs') return q.p.map(([a,b])=>`${esc(a)} → ${esc(b)}`).join('<br>');
  if(q.type==='multi') return q.o.filter(x=>x[1]).map(x=>esc(x[0])).join(' · ');
  return q.items.map(esc).join(' → ');
}

    ${zButton()}

    <button class="big dark" id="bAll"><span class="i">🎯</span><span><span class="t">Cały quiz</span><span class="d">${Q.length} pytań w losowej kolejności</span></span></button>
    <button class="big" id="bWrong" ${wr.length?'':'disabled style="opacity:.5"'}><span class="i">🩹</span><span><span class="t">Powtórz tylko błędne</span><span class="d">${wr.length?`${wr.length} z ostatniego podejścia`:'Na razie brak błędów do powtórki'}</span></span></button>

/* ============ QUIZ ============ */
const photo=q=>`<figure class="ph"><img src="${esc(q.img)}" alt="Zdjęcie do rozpoznania"><figcaption><a href="${esc(q.src)}" target="_blank" rel="noopener">${esc(q.cred)}</a></figcaption></figure>`;
function run(items,title){
  items.forEach(q=>{ if(q.img){ const i=new Image(); i.src=q.img; } });  // zdjęcia ładują się z góry
  window.scrollTo(0,0);
  let i=0; const wrong=[];
  function next(){
    if(i>=items.length) return finish();
    const q=items[i];
    $app.innerHTML=`${topBar(esc(title))}<div class="prog"><span style="width:${100*i/items.length}%"></span></div>
      <div class="q" id="qc"><div class="qlab"><span>${esc(SECTIONS[q.s])} · ${KIND[q.type]}</span><span>${i+1}/${items.length}</span></div>
      <div class="qt">${esc(q.q)}</div>${q.quote?`<blockquote class="quote">${esc(q.quote)}</blockquote>`:''}${q.img?photo(q):''}${q.svg?`<div class="svgfig">${q.svg}</div>`:''}<div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
    $('bBack').onclick=home;
    const after=(ok,detail)=>{
      if(!ok) wrong.push(q);
      $('qc').classList.add(ok?'ok':'bad');
      $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Źle ❌'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
        <button class="btn primary wide" id="bNext" style="margin-top:10px">${i+1<items.length?'Dalej':'Wynik'}</button>`;
      $('bNext').onclick=()=>{ i++; next(); }; $('bNext').focus({preventScroll:true});
      $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    ({bin:askBin,mc:askMc,tf:askTf,pairs:askPairs,multi:askMulti,order:askOrder})[q.type](q,after);
  }
  function finish(){
    const n=items.length, ok=n-wrong.length, pc=Math.round(100*ok/n);
    if(title==='Cały quiz'){ S.last={ok,n}; S.best=Math.max(S.best||0,pc); S.wrong=wrong.map(q=>q.id); }
    else if(title==='🩹 Błędne'){ S.wrong=wrong.map(q=>q.id); }
    else { S.wrong=[...new Set([...S.wrong.filter(id=>!items.some(q=>q.id===id)),...wrong.map(q=>q.id)])]; }
    save();
    window.scrollTo(0,0);
    $app.innerHTML=`${topBar(esc(title))}<div class="card" style="text-align:center"><div class="score">${ok}/${n}</div>
      <h2 style="margin-top:8px">${pc}% – ${!wrong.length?'bezbłędnie! 🏆':pc>=80?'bardzo dobrze! 👏':pc>=60?'nieźle – powtórz błędne.':'powtórz błędne i spróbuj jeszcze raz.'}</h2>
      <div class="row" style="justify-content:center;margin-top:10px">${wrong.length?'<button class="btn primary" id="bRep">Powtórz tylko błędne</button>':''}<button class="btn" id="bAgain">Jeszcze raz wszystko</button><button class="btn" id="bHome">Menu</button></div></div>
      ${wrong.length?`<div class="card"><h2>Do powtórzenia (${wrong.length})</h2>${wrong.map(q=>`<div class="diff">${q.img?`<img class="dimg" src="${esc(q.img)}" alt="">`:''}<div class="qq">${esc(q.q)}</div><div>✅ ${answerText(q)}</div><div class="muted small">${esc(q.e)}</div></div>`).join('')}</div>`:''}`;
    $('bBack').onclick=home; $('bHome').onclick=home;
    $('bAgain').onclick=()=>run(shuffle(items),title);
    if(wrong.length) $('bRep').onclick=()=>run(shuffle(wrong),'🩹 Błędne');
  }
  next();
}

/* ============ TYPY PYTAŃ ============ */
function askMc(q,after){
  const order=shuffle(q.o.map((_,i)=>i));
  $('ans').innerHTML=`<div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===0;
    btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===0) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${esc(q.o[0])}</b></div>`); });
}
function askBin(q,after){
  $('ans').innerHTML=`<div class="opts two">${q.l.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===q.c;
    btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===q.c) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${esc(q.l[q.c])}</b></div>`); });
}
function askTf(q,after){
  $('ans').innerHTML=`<div class="opts two"><button class="opt" data-v="1">Prawda</button><button class="opt" data-v="0">Fałsz</button></div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=(b.dataset.v==='1')===q.val;
    btns.forEach(x=>{ x.disabled=true; if((x.dataset.v==='1')===q.val) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${q.val?'Prawda':'Fałsz'}</b></div>`); });
}
function askMulti(q,after){
  const order=shuffle(q.o.map((_,i)=>i)), sel=new Set();
  $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Zaznacz wszystkie poprawne odpowiedzi i naciśnij „Sprawdź”.</p>
    <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}"><span class="box">☐</span> ${esc(q.o[i][0])}</button>`).join('')}</div>
    <button class="btn primary wide" id="bChk" style="margin-top:12px" disabled>Sprawdź</button>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; sel.has(i)?sel.delete(i):sel.add(i);
    b.classList.toggle('sel',sel.has(i)); b.querySelector('.box').textContent=sel.has(i)?'☑':'☐'; $('bChk').disabled=!sel.size; });
  $('bChk').onclick=()=>{
    let ok=true;
    btns.forEach(b=>{ const i=+b.dataset.i, good=!!q.o[i][1], picked=sel.has(i); b.disabled=true; b.classList.remove('sel');
      if(good&&picked) b.classList.add('ok'); else if(!good&&picked){ b.classList.add('no'); ok=false; } else if(good&&!picked){ b.classList.add('miss'); ok=false; } });
    $('bChk').remove();
    after(ok,ok?'':`<div>Poprawne: <b>${answerText(q)}</b></div><div class="muted small">Przerywana zielona ramka = to też trzeba było zaznaczyć.</div>`);
  };
}
function askOrder(q,after){
  let pool=shuffle(q.items.map((_,i)=>i)); while(pool.every((v,k)=>v===k)) pool=shuffle(pool);
  const chosen=[]; let locked=false;
  const draw=()=>{
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotykaj po kolei. Dotknięcie ułożonego elementu cofa go.</p>
      <div class="ord">${chosen.map((v,k)=>`<button class="slot full" data-k="${k}"><span class="k">${k+1}</span>${esc(q.items[v])}</button>`).join('')}${chosen.length<q.items.length?`<div class="slot"><span class="k">${chosen.length+1}</span><span class="muted small">wybierz z listy poniżej</span></div>`:''}</div>
      <div class="pool">${pool.filter(v=>!chosen.includes(v)).map(v=>`<button class="opt" data-v="${v}">${esc(q.items[v])}</button>`).join('')}</div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${chosen.length===q.items.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('.pool .opt').forEach(b=>b.onclick=()=>{ if(locked) return; chosen.push(+b.dataset.v); draw(); });
    $('ans').querySelectorAll('button.slot').forEach(b=>b.onclick=()=>{ if(locked) return; const k=+b.dataset.k; if(chosen[k]!=null){ chosen.splice(k,1); draw(); } });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=chosen.every((v,k)=>v===k);
    $('ans').querySelectorAll('button.slot').forEach(b=>{ const k=+b.dataset.k; b.disabled=true; b.classList.add(chosen[k]===k?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<div>Poprawna kolejność: <b>${answerText(q)}</b></div>`);
  };
  draw();
}
function askPairs(q,after){
  const L=q.p.map((p,i)=>({i,t:p[0]})), R=shuffle(q.p.map((p,i)=>({i,t:p[1]})));
  const match={}; let selL=null, locked=false;   // match[indeks lewej] = indeks prawej
  const draw=()=>{
    const keys=Object.keys(match);
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotknij pojęcia po lewej, a potem pasującego po prawej.</p>
      <div class="pairs"><div class="col">${L.map(l=>{ const k=keys.indexOf(String(l.i)); return `<button class="pb${selL===l.i?' sel':''}" data-l="${l.i}">${esc(l.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div>
      <div class="col">${R.map(r=>{ const li=keys.find(k=>match[k]===r.i); const k=li!=null?keys.indexOf(li):-1; return `<button class="pb" data-r="${r.i}">${esc(r.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div></div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${keys.length===L.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ if(locked) return; const i=+b.dataset.l; if(i in match){ delete match[i]; selL=i; } else selL=selL===i?null:i; draw(); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(locked||selL===null) return; const r=+b.dataset.r; const prev=Object.keys(match).find(k=>match[k]===r); if(prev!=null) delete match[prev]; match[selL]=r; selL=null; draw(); });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=L.every(l=>match[l.i]===l.i);
    $('ans').querySelectorAll('[data-l]').forEach(b=>{ const i=+b.dataset.l; b.disabled=true; b.classList.add(match[i]===i?'ok':'no'); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>{ b.disabled=true; const r=+b.dataset.r; const li=Object.keys(match).find(k=>match[k]===r); b.classList.add(+li===r?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<ul>${q.p.map(([a,b],i)=>`<li>${match[i]===i?'✅':'❌'} ${esc(a)} → <b>${esc(b)}</b></li>`).join('')}</ul>`);
  };
  draw();
}

/* ============ ZALICZ WSZYSTKO ============ */
// Wszystkie pytania do skutku: pomyłka wraca na koniec kolejki, zalicza dopiero dobra odpowiedź.
// Stan w S.z (q – kolejka id, ok – zaliczone, miss – pomylone choć raz) zapisuje się po każdej odpowiedzi; odznaka w S.zDone.
const zAll=()=>typeof fullSet==='function'?fullSet():Q;
const zGet=id=>typeof getQ==='function'?getQ(id):Q.find(q=>q.id===id);
const zToday=()=>new Date().toLocaleDateString('sv');
const zDate=d=>d.split('-').reverse().join('.');
const zPl=n=>n===1?'pytanie':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'pytania':'pytań';
function zState(){
  if(!S.z){ S.z={q:shuffle(zAll()).map(q=>q.id),ok:[],miss:[]}; save(); return S.z; }
  const z=S.z; z.q=z.q.filter(id=>zGet(id)); z.ok=z.ok.filter(id=>zGet(id));
  const seen=new Set([...z.q,...z.ok]), add=shuffle(Q.filter(q=>!seen.has(q.id))).map(q=>q.id);
  if(add.length){ z.q.push(...add); save(); }  // pytania dopisane do quizu po starcie trybu
  if(!z.q.length&&!S.zDone){ S.zDone={d:zToday(),n:z.ok.length}; save(); }
  return z;
}
function zCount(){ if(!S.z) return [0,zAll().length]; const z=zState(); return [z.ok.length,z.ok.length+z.q.length]; }
const zBadge=()=>S.zDone?`<span class="pill">✅ zaliczony 100% (${zDate(S.zDone.d)})</span>`:'';
function zButton(){
  const [x,n]=zCount();
  const sub=S.z&&!S.z.q.length?`zaliczony 100% (${zDate(S.zDone.d)}) – możesz zacząć od nowa`
    :S.z&&(x||S.z.miss.length)?`Wznów – do zaliczenia jeszcze ${n-x}`:`Wszystkie ${n} ${zPl(n)} do skutku – pomyłki wracają na koniec kolejki`;
  return `<button class="big" id="bZal" style="border:2px solid var(--ok)"><span class="i">✅</span><span style="flex:1"><span class="t">Zalicz wszystko (${x}/${n})</span><span class="d">${sub}</span><span class="bar"><span style="width:${n?Math.round(100*x/n):0}%"></span></span></span></button>`;
}
function zalicz(){
  const z=zState();
  if(!z.q.length) return zFinish();
  const id=z.q[0], q=zGet(id), n=z.ok.length+z.q.length, again=z.miss.includes(id);
  const nx=z.q[1]&&zGet(z.q[1]); if(nx&&nx.img){ const i=new Image(); i.src=nx.img; }  // następne zdjęcie ładuje się z góry
  const lab=typeof GN!=='undefined'?`${GN[q.g].i} ${esc(GN[q.g].n)}${q.trap?' <span class="tag">pułapka</span>':''}`:`${esc(SECTIONS[q.s])} · ${KIND[q.type]}`;
  window.scrollTo(0,0);
  $app.innerHTML=`${topBar('✅ Zalicz wszystko')}<div style="position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0 1px;margin-top:-6px"><div class="row" style="justify-content:space-between;font-weight:700;margin-bottom:6px"><span>zaliczone ${z.ok.length} z ${n}</span><span class="muted small">${again?'jeszcze raz 💪':`w kolejce: ${z.q.length}`}</span></div>
    <div class="prog"><span style="width:${100*z.ok.length/n}%"></span></div></div>
    <div class="q" id="qc"><div class="qlab"><span>${lab}</span></div>
    <div class="qt">${esc(q.q)}</div>${q.quote?`<blockquote class="quote">${esc(q.quote)}</blockquote>`:''}${q.img&&typeof photo==='function'?photo(q):''}${q.svg?`<div class="svgfig">${q.svg}</div>`:''}<div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
  $('bBack').onclick=home;
  const after=(ok,detail)=>{
    if(typeof record==='function'&&!again) record(q,ok);  // fiszki: pierwsza odpowiedź liczy się też do powtórek
    z.q.shift();
    if(ok) z.ok.push(id); else { z.q.push(id); if(!again) z.miss.push(id); }
    const fin=!z.q.length; if(fin) S.zDone={d:zToday(),n};
    save();
    $('qc').classList.add(ok?'ok':'bad');
    $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Źle ❌ – to pytanie wróci na końcu kolejki'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
      <button class="btn primary wide" id="bNext" style="margin-top:10px">${fin?'Wynik':'Dalej'}</button>`;
    $('bNext').onclick=zalicz; $('bNext').focus({preventScroll:true});
    $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
  };
  window['ask'+q.type[0].toUpperCase()+q.type.slice(1)](q,after);
}
function zFinish(){
  const z=S.z, n=z.ok.length;
  window.scrollTo(0,0);
  $app.innerHTML=`${topBar('✅ Zalicz wszystko')}<div class="card" style="text-align:center"><div style="font:800 52px/1 var(--fh)">100%</div>
    <h2 style="margin-top:8px">zaliczone wszystkie ${n} ${zPl(n)} 🏆</h2>
    <p class="muted">${zDate(S.zDone.d)} · ${z.miss.length?`po drodze poprawione: ${z.miss.length}`:'bez ani jednej pomyłki'}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="bZNew">Zacznij od nowa</button><button class="btn" id="bHome">Menu</button></div></div>`;
  $('bBack').onclick=home; $('bHome').onclick=home;
  $('bZNew').onclick=()=>{ S.z=null; save(); zalicz(); };
}

/* ============ START ============ */
home();
</script>
