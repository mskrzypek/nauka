<!doctype html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praca, moc, energia – trening przed kartkówką</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FB; --grid:#E1E7F0; --ink:#172238; --muted:#566280; --line:#CCD5E3; --surface:#FFFFFF; --soft:#EEF2F8;
  --accent:#E8A317; --accent-ink:#1B1400; --blue:#2F5BD3; --ok:#1C7F54; --okbg:#E2F3EA; --bad:#C0284E; --badbg:#FBE5EB; --warnbg:#FFF4D6;
  --shadow:0 1px 2px rgba(23,34,56,.06),0 6px 18px rgba(23,34,56,.06);
  --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1626; --grid:#18223A; --ink:#E7ECF6; --muted:#9DAAC4; --line:#2C3A58; --surface:#152036; --soft:#1B2842;
    --accent:#FFC14D; --accent-ink:#1B1400; --blue:#8FB0FF; --ok:#52CF94; --okbg:#10362A; --bad:#FF7C9C; --badbg:#3C1628; --warnbg:#3A3116;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink); font:17px/1.5 var(--fb);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:720px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px max(90px,calc(env(safe-area-inset-bottom) + 80px))}
h1,h2,h3{font-family:var(--fh); line-height:1.12; margin:0}
h1{font-size:clamp(28px,7.5vw,40px); font-weight:800; letter-spacing:-.02em}
h2{font-size:22px; font-weight:800; margin:0 0 10px}
h3{font-size:18px; font-weight:800; margin:18px 0 6px}
p{margin:0 0 .7em}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:disabled{cursor:not-allowed; opacity:.45}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.sub{color:var(--muted); margin:4px 0 12px}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15px; font-weight:700}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:12px 2px 14px; margin:0 -2px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:.45em .85em; font:700 16px var(--fh)}
.tab[aria-selected="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px}
.btn{border:2px solid var(--ink); background:transparent; border-radius:12px; padding:9px 16px; font:800 16px var(--fh)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.small{padding:5px 12px; font-size:14px}
.btn.wide{width:100%; padding:13px}
.big{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px}
.big .ico{font-size:30px; width:40px; text-align:center; flex:none}
.big .t{font:800 19px var(--fh); display:block}
.big .d{color:var(--muted); font-size:15px}
.big.dark{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.big.dark .d{color:var(--paper); opacity:.8}

/* postęp tematów */
.topic{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic .n{font-weight:700; line-height:1.3}
.topic .bar{grid-column:1/2; height:8px; background:var(--soft); border-radius:6px; overflow:hidden}
.topic .bar span{display:block; height:100%; background:var(--ok); border-radius:6px}
.topic .pct{font:800 15px var(--fh); color:var(--muted); text-align:right}
.topic .go{grid-row:1/3; grid-column:2}

/* pytanie */
.qhead{display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:10px; font:700 15px var(--fh); color:var(--muted)}
.prog{height:8px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:12px}
.prog span{display:block; height:100%; background:var(--accent); transition:width .25s}
.qtext{font-size:19px; line-height:1.45; margin-bottom:14px}
.qtext b{color:var(--blue)}
.opts{display:grid; gap:8px}
.opt{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok); background:var(--okbg)}
.opt.no{border-color:var(--bad); background:var(--badbg)}
.opt:disabled{cursor:default; opacity:1}
.tf{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tf .opt{text-align:center; font:800 18px var(--fh)}
.numrow{display:flex; gap:8px; align-items:stretch}
.num{flex:1; min-width:0; font:800 24px var(--fh); padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink)}
.num:focus{border-color:var(--blue); outline:none}
.fixu{display:grid; place-items:center; padding:0 14px; border-radius:12px; background:var(--soft); font:800 20px var(--fh)}
.units{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 12px}
.unit{border:2px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 0; width:calc((100% - 30px)/6); font:800 16px var(--fh)}
.unit[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
.fb{margin-top:12px; border-radius:12px; padding:12px 14px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb .h{font:800 18px var(--fh); margin-bottom:4px}
.sol{margin-top:8px; font-size:16px; background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:10px 12px}
.sol div{margin:2px 0}
.sol .k{font-weight:700; color:var(--muted)}
.next{margin-top:12px}

/* krok po kroku */
.steps{margin:12px 0 0; background:var(--soft); border-radius:12px; padding:10px 12px; font-size:16px}
.steps .ln{margin:3px 0} .steps .k{font-weight:700}
.steps .ok{color:var(--ok)} .steps .bad{color:var(--bad)}
.stepq{margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.stepq .lab{font:800 16px var(--fh); color:var(--blue); margin-bottom:8px}

/* przemiany */
.forms{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.form{border:2px solid var(--line); background:var(--surface); border-radius:99px; padding:6px 12px; font-size:15px; font-weight:700}
.chain{min-height:54px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--soft); border-radius:12px; padding:10px; font-weight:700}
.chain .f{background:var(--accent); color:var(--accent-ink); border-radius:99px; padding:4px 10px; font-size:15px}
.chain .ar{color:var(--muted)}
.scen{font-size:20px; font-weight:700; margin:4px 0 2px}

/* ściąga */
.cheat h3:first-child{margin-top:0}
.def{background:var(--soft); border-left:4px solid var(--blue); border-radius:0 10px 10px 0; padding:10px 12px; margin:8px 0}
.formula{font:800 28px var(--fh); text-align:center; margin:8px 0}
.warn{background:var(--warnbg); border-radius:12px; padding:12px 14px; margin:10px 0}
.warn ul,.cheat ul{margin:.3em 0 .3em; padding-left:1.2em} li{margin:.25em 0}
table{border-collapse:collapse; width:100%; font-size:15px}
td,th{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
th{background:var(--soft)}
.tri{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:8px 0}
.tri svg{width:130px; height:auto}
.tri text{font-family:var(--fh); font-weight:800; fill:var(--ink)}
.tri path{fill:none; stroke:var(--ink); stroke-width:3}
details{margin:6px 0} summary{cursor:pointer; font-weight:700}

.grade{font:800 60px/1 var(--fh)}
.review{border-top:1px solid var(--line); padding:10px 0}
.review .q{font-weight:700}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:12px; z-index:50; font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>⚡ Praca, moc, energia</h1>
  <div class="sub" id="hello"></div>
  <div class="pills" id="pills"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="view"></div>
</main>
<script>
"use strict";
/* ============ KTO ĆWICZY ============ */
const KIDS={wiktor:'Wiktor'};
let kid=(new URLSearchParams(location.search).get('dla')||'wiktor').toLowerCase();
if(!KIDS[kid]) kid='wiktor';
const NAME=KIDS[kid];

/* ============ ZAPIS ============ */
const SKEY='fizyka-pme-v1:'+kid;
const blank=()=>({q:{},days:[],tests:[],total:0,correct:0});
let S=blank(), canSave=true;
try{ const r=localStorage.getItem(SKEY); if(r) S=Object.assign(blank(),JSON.parse(r)); }catch(e){ canSave=false; }
function save(){ if(!canSave) return; try{ localStorage.setItem(SKEY,JSON.stringify(S)); }catch(e){ canSave=false; } }
const today=()=>new Date().toLocaleDateString('sv');
function streak(){ let n=0; const d=new Date(); if(!S.days.includes(d.toLocaleDateString('sv'))) d.setDate(d.getDate()-1); while(S.days.includes(d.toLocaleDateString('sv'))){ n++; d.setDate(d.getDate()-1); } return n; }
function record(id,ok){
  const e=S.q[id]||(S.q[id]={b:0,r:0,w:0});
  if(ok){ e.r++; e.b=Math.min(3,e.b+1); } else { e.w++; e.b=0; }
  S.total++; if(ok) S.correct++;
  const d=today(); if(!S.days.includes(d)) S.days.push(d);
  save();
}

/* ============ POMOCNICZE ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
const pct=(a,b)=>b?Math.round(100*a/b):0;

/* ============ JEDNOSTKI ============ */
const U={J:{d:'E',f:1},kJ:{d:'E',f:1e3},MJ:{d:'E',f:1e6},mJ:{d:'E',f:1e-3},
  W:{d:'P',f:1},kW:{d:'P',f:1e3},MW:{d:'P',f:1e6},
  N:{d:'F',f:1},kN:{d:'F',f:1e3},
  m:{d:'s',f:1},cm:{d:'s',f:.01},km:{d:'s',f:1e3},
  s:{d:'t',f:1},min:{d:'t',f:60},h:{d:'t',f:3600},
  'm/s':{d:'v',f:1},'km/h':{d:'v',f:1/3.6},kg:{d:'m',f:1}};
const BASE={E:'J',P:'W',F:'N',s:'m',t:'s',v:'m/s',m:'kg'};
const DIMNAME={E:'pracę (dżule)',P:'moc (waty)',F:'siłę (niutony)',s:'drogę (metry)',t:'czas (sekundy)',v:'prędkość (m/s)'};
const CHIPS=['J','kJ','MJ','W','kW','N','kN','m','cm','km','s','min','h'];
const UNAME={kJ:'kilodżulach',J:'dżulach',MJ:'megadżulach',W:'watach',kW:'kilowatach',min:'minutach',s:'sekundach',h:'godzinach',m:'metrach',km:'kilometrach',N:'niutonach',kN:'kiloniutonach'};
const fmtN=x=>{ const r=Math.round(x*10000)/10000; return r.toLocaleString('pl-PL',{maximumFractionDigits:4}); };
const V=(val,u)=>`${fmtN(val/U[u].f)} ${u}`;
const niceIn=(val,u)=>{ const x=val/U[u].f; return x>=0.01 && Math.abs(x*100-Math.round(x*100))<1e-6; };
const pickU=(val,c)=>{ const ok=c.filter(u=>niceIn(val,u)); return ok.length?rnd(ok):c[0]; };
function parseNum(str){
  const s=String(str).replace(/[\s ]/g,'').replace(',', '.');
  const m=s.match(/^-?\d*\.?\d+/); return m?parseFloat(m[0]):NaN;
}

/* ============ TEMATY ============ */
const TOPICS=[
  {id:'praca',  n:'Kiedy siła wykonuje pracę', e:'🧱'},
  {id:'wzorW',  n:'Wzór na pracę W = F · s', e:'📐'},
  {id:'wzorP',  n:'Wzór na moc P = W / t', e:'⚙️'},
  {id:'jedn',   n:'Jednostki i ich zamiana', e:'📏'},
  {id:'mocUrz', n:'Co oznacza moc urządzenia', e:'🔌'},
  {id:'zlozone',n:'Zadania złożone (przekształcanie wzorów)', e:'🧠'},
  {id:'energia',n:'Energia i jej przemiany', e:'🔋'},
];
const TN=Object.fromEntries(TOPICS.map(t=>[t.id,t]));

/* ============ PYTANIA ZAMKNIĘTE ============ */
// Poprawna odpowiedź zawsze pierwsza – kolejność losowana przy wyświetlaniu.
const QS=[];
const mc=(id,t,q,o,e,star)=>QS.push({id,t,type:'mc',q,o,e,star:!!star});
const tf=(id,t,q,truth,e)=>QS.push({id,t,type:'tf',q,o:truth?['Prawda','Fałsz']:['Fałsz','Prawda'],e});

// --- kiedy praca
mc('p1','praca','Kiedy siła wykonuje pracę mechaniczną?',['gdy działa na ciało, a ciało przemieszcza się w kierunku innym niż prostopadły do kierunku działania siły','zawsze, gdy działa na jakieś ciało','gdy przy działaniu siły ktoś się mocno zmęczy','tylko wtedy, gdy ciało stoi w miejscu'],'Potrzebne są dwie rzeczy: siła i przemieszczenie, które nie jest prostopadłe do siły. Sam wysiłek to nie praca w sensie fizycznym.');
tf('p2','praca','Chłopiec z całej siły napiera na ścianę, która się nie przesuwa. Chłopiec wykonuje pracę mechaniczną.',false,'Ściana się nie przesuwa, więc s = 0 i W = F · 0 = 0 J. Chłopiec się męczy, ale praca mechaniczna jest równa zero.');
mc('p3','praca','Kto wykonuje większą pracę mechaniczną?',['dziewczynka, która przesuwa książkę po stole','chłopiec, który z całej siły napiera na ścianę','obaj tyle samo','nie da się tego ocenić'],'Książka się przesuwa (s > 0), więc praca jest wykonana. Ściana stoi (s = 0), więc praca chłopca to 0 J. To zadanie z Waszej karty pracy.');
mc('p4','praca','Na lampę wiszącą pod sufitem działa siła ciężkości, a mimo to praca tej siły jest równa zero, bo:',['lampa się nie przemieszcza (s = 0)','siła ciężkości jest równa zero (F = 0)','siła jest prostopadła do ruchu','lampa jest za lekka'],'Siła działa (F ≠ 0), ale droga s = 0, więc W = F · 0 = 0.');
mc('p5','praca','Idziesz po poziomym chodniku i niesiesz torbę. Siła, którą trzymasz torbę (skierowana w górę), nie wykonuje pracy, bo:',['kierunek siły jest prostopadły do kierunku ruchu','torba się nie przemieszcza','siła jest równa zero','idziesz za wolno'],'Siła działa pionowo, a torba przesuwa się poziomo – kierunki są prostopadłe (F ⊥ s), więc ta siła nie wykonuje pracy.');
mc('p6','praca','Które zdanie to trzy przypadki, gdy praca NIE jest wykonywana?',['F = 0, s = 0 albo siła prostopadła do przemieszczenia','F = 0, s = 0 albo ciało porusza się szybko','siła jest duża, droga długa albo czas krótki','ciało jest ciężkie, lekkie albo średnie'],'Z karty pracy: praca nie jest wykonywana, gdy 1) F = 0, 2) s = 0, 3) F ⊥ s.');
tf('p7','praca','Stoisz w miejscu i trzymasz w ręce siatkę z zakupami. Wykonujesz przy tym pracę mechaniczną.',false,'Siatka się nie przemieszcza (s = 0), więc W = 0 J – choć ręka się męczy.');
tf('p8','praca','Mocno zgniatając gąbkę, wykonujesz pracę mechaniczną.',true,'Tak – gąbka się odkształca, czyli jej części przesuwają się pod wpływem siły. Odkształcanie ciała też jest wykonywaniem pracy.');
tf('p9','praca','Podnosząc plecak z podłogi na biurko, wykonujesz pracę mechaniczną.',true,'Działasz siłą w górę, a plecak przesuwa się w górę – kierunek siły i ruchu jest zgodny.');
tf('p10','praca','Uczeń, który przez godzinę rozwiązuje zadania z matematyki, wykonuje pracę mechaniczną.',false,'To praca umysłowa, nie mechaniczna. W fizyce praca wymaga siły i przemieszczenia.');
mc('p11','praca','Krążek hokejowy sunie po idealnie gładkim lodzie ruchem jednostajnym. Nic go nie popycha ani nie hamuje. Praca w kierunku ruchu jest równa zero, bo:',['w kierunku ruchu nie działa żadna siła (F = 0)','krążek się nie przemieszcza (s = 0)','krążek jest za lekki','lód jest zimny'],'Krążek się przemieszcza, ale w kierunku ruchu nie działa żadna siła – przypadek F = 0.');
mc('p12','praca','Satelita krąży wokół Ziemi po okręgu. Siła grawitacji działa na niego zawsze prostopadle do kierunku ruchu. Praca siły grawitacji jest:',['równa zero','bardzo duża','ujemna','równa energii satelity'],'Siła prostopadła do kierunku ruchu nie wykonuje pracy (F ⊥ s).',true);
mc('p13','praca','Od czego zależy praca mechaniczna (gdy siła działa w kierunku ruchu)?',['od wartości siły i od drogi','od czasu i zmęczenia','tylko od siły','od masy i koloru ciała'],'W = F · s – liczy się siła i droga. Czas nie ma wpływu na pracę (ma wpływ na moc).');
mc('p14','praca','Przesuwasz tę samą skrzynię tą samą siłą na tę samą odległość – raz idąc, raz biegnąc. Wykonana praca:',['jest taka sama (biegnąc, pracujesz z większą mocą)','jest większa, gdy biegniesz','jest większa, gdy idziesz','jest równa zero'],'Praca W = F · s nie zależy od czasu. Szybciej = ta sama praca w krótszym czasie = większa moc.');
tf('p15','praca','Wzór W = F · s stosujemy wtedy, gdy przemieszczenie ciała jest zgodne z kierunkiem i zwrotem działającej siły.',true,'Tak brzmi definicja z Waszej karty pracy.');
mc('p16','praca','Wiadro wyciągane ze studni na linie do góry. Czy siła naciągu liny wykonuje pracę?',['tak – siła i przemieszczenie mają ten sam kierunek i zwrot','nie – bo wiadro jest ciężkie','nie – bo siła działa w górę','tak, ale tylko gdy wiadro jest puste'],'Lina ciągnie w górę i wiadro jedzie w górę – praca jest wykonywana.');

// --- wzór na pracę
mc('w1','wzorW','Wzór na pracę mechaniczną to:',['W = F · s','W = F / s','W = s / F','W = F + s'],'Praca = siła · droga.');
mc('w2','wzorW','W wzorze W = F · s litera s oznacza:',['drogę (przesunięcie) w metrach','czas w sekundach','siłę w niutonach','szybkość'],'Uwaga na pułapkę: w tym wzorze s to droga, a nie sekundy.');
mc('w3','wzorW','Jak obliczyć siłę, znając pracę i drogę?',['F = W / s','F = W · s','F = s / W','F = W − s'],'Z W = F · s dzielimy obie strony przez s: F = W / s. Pomaga trójkąt: W na górze, F i s na dole.');
mc('w4','wzorW','Jak obliczyć drogę, znając pracę i siłę?',['s = W / F','s = W · F','s = F / W','s = W − F'],'Z W = F · s dzielimy obie strony przez F: s = W / F.');
mc('w5','wzorW','Praca to:',['iloczyn siły i drogi','iloraz siły i drogi','iloczyn mocy i drogi','suma siły i drogi'],'Iloczyn = wynik mnożenia. W = F · s.');

mc('w8','wzorW','Symbol pracy W pochodzi od angielskiego słowa:',['work','watt','weight','wave'],'Work – praca. (Uwaga: wat to jednostka mocy, też oznaczana literą W!)');

mc('m2','wzorP','Moc informuje o tym:',['jak szybko wykonywana jest praca','jak dużą siłą działa ciało','jaką drogę przebyło ciało','jak ciężkie jest ciało'],'Tak jest na Waszej karcie pracy: moc informuje o tym, jak szybko wykonywana jest praca.');
mc('m3','wzorP','Moc to:',['iloraz pracy i czasu, w którym ta praca została wykonana','iloczyn pracy i czasu','iloraz czasu i pracy','iloczyn siły i drogi'],'Iloraz = wynik dzielenia. P = W / t.');

mc('m7','wzorP','Koń i traktor zaorały takie samo pole. Traktor zrobił to 5 razy szybciej. Co jest prawdą?',['wykonały taką samą pracę, ale moc traktora była 5 razy większa','traktor wykonał 5 razy większą pracę','koń miał większą moc, bo pracował dłużej','moc obu była taka sama'],'Ta sama praca w 5 razy krótszym czasie → 5 razy większa moc.');
mc('m8','wzorP','Dwa dźwigi podniosły jednakowe ładunki na tę samą wysokość: pierwszy w 10 s, drugi w 20 s. Większą moc ma:',['pierwszy – tę samą pracę wykonał w krótszym czasie','drugi – bo pracował dłużej','oba mają taką samą moc','nie da się tego ocenić'],'Praca obu jest taka sama. P = W / t – krótszy czas to większa moc (2 razy).');
mc('m9','wzorP','Urządzenie pracuje z tą samą mocą, ale dwa razy dłużej. Wykonana praca jest:',['dwa razy większa','dwa razy mniejsza','taka sama','cztery razy większa'],'W = P · t – praca rośnie proporcjonalnie do czasu.');
mc('m10','wzorP','Moc chwilową, gdy siła działa w kierunku ruchu, można też obliczyć ze wzoru:',['P = F · v','P = F / v','P = v / F','P = F · s'],'P = W / t = F · s / t, a s / t = v, więc P = F · v. (To jest w podręczniku Nowej Ery.)',true);

mc('j3','jedn','1 J to praca, jaką wykonuje siła:',['1 N na drodze 1 m','1 W w czasie 1 s','1 N w czasie 1 s','1 kg na drodze 1 m'],'1 J = 1 N · 1 m.');

mc('j9','jedn','Przedrostek kilo (k) oznacza:',['1000 razy więcej (np. 1 kJ = 1000 J)','100 razy więcej','1 000 000 razy więcej','1000 razy mniej'],'k = 1000. 1 kJ = 1000 J, 1 kW = 1000 W, 1 kN = 1000 N.');
mc('j10','jedn','Przedrostek mega (M) oznacza:',['1 000 000 razy więcej (1 MJ = 1 000 000 J)','1000 razy więcej','1000 razy mniej','100 razy więcej'],'M = milion. Nie myl z małym m!');
mc('j11','jedn','250 mJ (milidżuli) to:',['0,25 J','250 000 J','250 000 000 J','2,5 J'],'m (mili) = 1/1000. 250 mJ = 250 : 1000 J = 0,25 J. Pułapka: mJ ≠ MJ!');

mc('j13','jedn','Nazwa jednostki pracy (dżul) pochodzi od nazwiska:',['Jamesa Prescotta Joule’a','Jamesa Watta','Isaaca Newtona','Blaise’a Pascala'],'Dżul – od angielskiego fizyka Jamesa Prescotta Joule’a (XIX w.).');
mc('j14','jedn','Koń mechaniczny (1 KM) to około:',['735 W','1 W','100 W','1 kJ'],'1 KM ≈ 735 W. Używa się go np. do podawania mocy silników samochodów.');

mc('u2','mocUrz','Moc urządzenia informuje o tym:',['jaką pracę urządzenie wykonuje w jednostce czasu (w 1 s)','jak ciężkie jest urządzenie','jak długo urządzenie może pracować','jaką siłą działa urządzenie'],'Tak to ujmuje podręcznik: moc urządzenia informuje o tym, jaką pracę wykonuje ono w jednostce czasu.');
mc('u3','mocUrz','Silnik A ma moc 1 kW, a silnik B – 500 W. W tym samym czasie:',['A wykona 2 razy większą pracę niż B','B wykona 2 razy większą pracę niż A','wykonają taką samą pracę','A wykona 500 razy większą pracę'],'1 kW = 1000 W, czyli 2 razy więcej niż 500 W. W = P · t.');

mc('z7','zlozone','Pewne urządzenie wykonuje pracę 180 J w ciągu 1 minuty. Jego moc wynosi:',['3 W','180 W','10 800 W','0,33 W'],'1 min = 60 s. P = 180 J / 60 s = 3 W. Najczęstszy błąd: niezamieniona minuta.');

mc('z10','zlozone','Dwie osoby wniosły na 2. piętro takie same paczki: Ola w 30 s, Kuba w 60 s. Co jest prawdą?',['wykonali taką samą pracę, moc Oli była 2 razy większa','Ola wykonała 2 razy większą pracę','moc Kuby była 2 razy większa','praca Kuby była 2 razy większa'],'Ta sama siła i wysokość → ta sama praca. Połowa czasu → dwa razy większa moc.');

function daneLines(g){ return (g.given||[]).map(x=>{ if(x.raw) return `${x.sym} = ${fmtN(x.val)} ${x.u}`; const b=BASE[U[x.u].d]; return x.u===b?`${x.sym} = ${V(x.val,x.u)}`:`${x.sym} = ${V(x.val,x.u)} = ${V(x.val,b)}`; }); }
function answerText(g){ const f=g.find, b=BASE[f.dim]; let s=V(f.val,f.force||b); if(!f.force&&f.dim==='E'&&f.val>=1000&&niceIn(f.val,'kJ')) s+=` (= ${V(f.val,'kJ')})`; if(!f.force&&f.dim==='P'&&f.val>=1000&&niceIn(f.val,'kW')) s+=` (= ${V(f.val,'kW')})`; return s; }
function solutionHtml(g){
  if(g.conv) return `<div class="sol">${g.calc.map(esc).join('<br>')}</div>`;
  const f=g.find;
  let calc=g.calc.slice(); if(f.force&&f.force!==BASE[f.dim]) calc[calc.length-1]+=` = ${V(f.val,f.force)}`;
  return `<div class="sol">
    <div><span class="k">Dane:</span> ${daneLines(g).map(esc).join('; ')}</div>
    <div><span class="k">Szukane:</span> ${f.sym} = ?</div>
    <div><span class="k">Wzór:</span> ${esc(g.formula)}</div>
    ${g.note?`<div class="muted small">${esc(g.note)}</div>`:''}
    <div><span class="k">Obliczenia:</span> ${calc.map(esc).join('<br>')}</div>
    <div><span class="k">Odpowiedź:</span> ${esc(g.subj)} ${esc(answerText(g))}.</div></div>`;
}
function genQ(id){ const gen=GN[id], g=gen.build(); if(g.find.force&&!g.conv) g.text+=` Wynik podaj w ${UNAME[g.find.force]||g.find.force}.`; return {id,t:gen.t,type:'num',q:g.text,g,star:!!gen.star}; }

/* ============ SPRAWDZANIE LICZB ============ */
function checkNum(g,numStr,unit){
  const n=parseNum(numStr), f=g.find;
  if(isNaN(n)) return {ok:false,empty:true};
  const u=g.fixed||unit;
  if(!u) return {ok:false,msg:'Brak jednostki! Wynik bez jednostki to na kartkówce błąd.'};
  if(U[u].d!==f.dim) return {ok:false,msg:`Zła jednostka: szukasz ${DIMNAME[f.dim]}, a wybrałeś „${u}”.`};
  const val=n*U[u].f, good=Math.abs(val-f.val)<=Math.max(1e-9,Math.abs(f.val)*0.002);
  if(good&&f.force&&u!==f.force) return {ok:false,msg:`Liczba się zgadza, ale polecenie każe podać wynik w ${UNAME[f.force]||f.force} (${f.force}). Pani by to obcięła!`};
  if(!good){
    const ratio=val/f.val; let hint='';
    if([1000,0.001,60,1/60,3600,1/3600,100,0.01].some(r=>Math.abs(ratio-r)<1e-6)) hint=' Wygląda na niezamienioną jednostkę (k, min, h albo cm)!';
    return {ok:false,msg:'Zły wynik.'+hint};
  }
  return {ok:true};
}

function go(t){ tab=t; renderTabs(); header(); window.scrollTo(0,0); ({start:vStart,nauka:vNauka,trening:vTrening,kroki:vKroki,przemiany:vPrzemiany,kartkowka:vKartkowka})[t](); }

/* ============ POSTĘP ============ */
function itemsOf(t){ return [...QS.filter(q=>q.t===t).map(q=>({id:q.id,need:2})), ...GENS.filter(g=>g.t===t).map(g=>({id:g.id,need:3})), ...(t==='energia'?BUILD.map(b=>({id:'b:'+b.id,need:1})):[])]; }
function mastery(t){ const it=itemsOf(t); return Math.round(100*it.reduce((a,x)=>a+Math.min(1,((S.q[x.id]||{}).b||0)/x.need),0)/it.length); }
function overall(){ return Math.round(TOPICS.reduce((a,t)=>a+mastery(t.id),0)/TOPICS.length); }
const errorIds=()=>Object.keys(S.q).filter(id=>S.q[id].w>0&&S.q[id].b<2&&(QS.some(q=>q.id===id)||GN[id]));

/* ============ START ============ */

    <button class="big dark" id="bTest"><span class="ico">📝</span><span><span class="t">Kartkówka próbna</span><span class="d">15 pytań ze wszystkich zagadnień, ocena na koniec${last?` · ostatnio ${last.p}%`:''}</span></span></button>

      <p class="muted small" style="margin:10px 0 0">Pasek rośnie, gdy odpowiadasz dobrze kilka razy z rzędu. Najpierw przeczytaj <a href="#" id="lNauka">ściągę</a>.</p>
    </div>

  $('view').querySelectorAll('.go').forEach(b=>b.onclick=()=>{ tab='trening'; renderTabs(); startTopic(b.dataset.t); });

/* ============ TRENING ============ */
function vTrening(){
  $('view').innerHTML=`<div class="card"><h2>Wybierz zagadnienie</h2><p class="muted small">10 pytań. Najczęściej wracają te, które jeszcze nie są opanowane.</p>
    ${TOPICS.map(t=>`<button class="big" data-t="${t.id}"><span class="ico">${t.e}</span><span><span class="t">${esc(t.n)}</span><span class="d">opanowane: ${mastery(t.id)}%</span></span></button>`).join('')}
    <button class="big dark" data-t="mix"><span class="ico">🎲</span><span><span class="t">Wszystko naraz</span><span class="d">Mieszanka ze wszystkich zagadnień</span></span></button></div>`;
  $('view').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTopic(b.dataset.t));
}
function weightOf(id,need){ const b=(S.q[id]||{}).b||0; return b>=need?0.35:1+(need-b); }
function pickItems(topics,n){
  const pool=[];
  topics.forEach(t=>{
    QS.filter(q=>q.t===t).forEach(q=>pool.push({ref:{id:q.id},w:weightOf(q.id,2)}));
    GENS.filter(g=>g.t===t).forEach(g=>pool.push({ref:{gen:g.id},w:weightOf(g.id,3)*1.6,gen:true}));
  });
  const out=[], used=new Set();
  for(let k=0;k<n&&pool.length;k++){
    const c=pool.filter((p,i)=>!used.has(i)||p.gen);
    let r=Math.random()*c.reduce((a,p)=>a+p.w,0), pick=c[c.length-1];
    for(const p of c){ r-=p.w; if(r<=0){ pick=p; break; } }
    used.add(pool.indexOf(pick)); out.push(pick.ref);
    if(pick.gen) pick.w*=0.5;
  }
  return out;
}
function startTopic(t){ const topics=t==='mix'?TOPICS.map(x=>x.id):[t]; startRound(pickItems(topics,10),t==='mix'?'Wszystko naraz':TN[t].n); }
const materialize=ref=>ref.gen?genQ(ref.gen):QS.find(q=>q.id===ref.id);

/* ============ RUNDA (trening / kartkówka) ============ */
function startRound(refs,title,test){
  window.scrollTo(0,0);
  const R={items:refs.map(materialize).filter(Boolean),i:0,ok:0,log:[]};
  if(!R.items.length){ go('start'); return; }
  function show(){
    const q=R.items[R.i];
    $('view').innerHTML=`<div class="card">
      <div class="qhead"><span>${esc(title)}</span><span>${R.i+1} / ${R.items.length}</span></div>
      <div class="prog"><span style="width:${100*R.i/R.items.length}%"></span></div>
      <div class="muted small" style="margin-bottom:4px">${TN[q.t].e} ${esc(TN[q.t].n)}${q.star?' · ⭐ z podręcznika':''}</div>
      <div id="qbox"></div>
      <div class="row" style="margin-top:14px"><button class="btn small" id="bQuit">Przerwij</button></div></div>`;
    $('bQuit').onclick=()=>{ if(!test||confirm('Przerwać kartkówkę?')) go(tab); };
    askQ(q,$('qbox'),(ok,given)=>{
      record(q.id,ok); R.log.push({q,ok,given}); if(ok) R.ok++;
      if(test){ R.i++; R.i<R.items.length?show():finish(); return true; }
      return false;
    },()=>{ R.i++; R.i<R.items.length?show():finish(); },test);
  }
  function finish(){
    const p=pct(R.ok,R.items.length);
    if(test){ S.tests.push({d:today(),p}); save(); }
    const gr=grade(p), wrong=R.log.filter(x=>!x.ok);
    $('view').innerHTML=`<div class="card" style="text-align:center">
      <p class="muted" style="margin-bottom:4px">${esc(title)}</p>
      ${test?`<div class="grade">${gr[0]}</div><p><b>${gr[1]}</b></p>`:''}
      <h2>${R.ok} z ${R.items.length} dobrze (${p}%)</h2>
      <p>${p===100?'Perfekcyjnie! Nie ma się do czego przyczepić. 🏆':p>=90?'Bardzo dobrze – dopracuj szczegóły poniżej.':p>=70?'Nieźle, ale pani znalazłaby, do czego się przyczepić. Przejrzyj błędy.':'Trzeba jeszcze poćwiczyć – zacznij od ściągi i treningu zagadnień.'}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="bAgain">${test?'Nowa kartkówka':'Jeszcze raz'}</button><button class="btn" id="bHome">Start</button></div></div>
      ${wrong.length?`<div class="card"><h2>Błędy do przejrzenia</h2>${wrong.map(x=>reviewHtml(x)).join('')}</div>`:''}
      ${test?`<p class="muted small">Ocena orientacyjna według typowej skali: poniżej 40% – 1, od 40% – 2, od 55% – 3, od 75% – 4, od 90% – 5. Na 6 zwykle trzeba mieć 100% i zadanie dodatkowe.</p>`:''}`;
    $('bAgain').onclick=()=>test?vKartkowka(true):startRound(refs,title,test);
    $('bHome').onclick=()=>go('start');
    header();
  }
  show();
}
function grade(p){ return p>=90?['5','bardzo dobry']:p>=75?['4','dobry']:p>=55?['3','dostateczny']:p>=40?['2','dopuszczający']:['1','niedostateczny']; }
function reviewHtml(x){
  const q=x.q;
  if(q.type==='num') return `<div class="review"><div class="q">${q.q}</div><div class="muted small">Twoja odpowiedź: ${esc(x.given||'—')}</div>${solutionHtml(q.g)}</div>`;
  return `<div class="review"><div class="q">${q.q}</div><div class="muted small">Twoja odpowiedź: ${esc(x.given||'—')}</div><div>✅ <b>${esc(q.o[0])}</b></div><div class="muted small">${esc(q.e)}</div></div>`;
}

/* ============ JEDNO PYTANIE ============ */
// onAnswer(ok, given) → true gdy runda sama przechodzi dalej (kartkówka: bez podpowiedzi)
function askQ(q,box,onAnswer,onNext,test){
  box.innerHTML=`<div class="qtext">${q.q}</div><div id="ans"></div><div id="fb"></div>`;
  const ans=$('ans');
  const after=(ok,given,msg)=>{
    if(onAnswer(ok,given)) return;
    const expl=q.type==='num'?solutionHtml(q.g):`<div class="muted" style="margin-top:4px">${esc(q.e)}</div>`;
    $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Nie tym razem'}</div>${msg?`<div>${esc(msg)}</div>`:''}${!ok&&q.type!=='num'?`<div>Poprawnie: <b>${esc(q.o[0])}</b></div>`:''}${expl}</div>
      <button class="btn primary wide next" id="bNext">Dalej</button>`;
    $('bNext').onclick=onNext; $('bNext').focus({preventScroll:true});
    $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
  };
  if(q.type==='num'){
    const g=q.g; let unit=null;
    ans.innerHTML=`<div class="numrow"><input class="num" id="inp" inputmode="decimal" autocomplete="off" placeholder="wynik" aria-label="Wynik">${g.fixed?`<span class="fixu">${esc(g.fixed)}</span>`:''}</div>
      ${g.fixed?'':`<div class="muted small" style="margin-top:8px">Jednostka:</div><div class="units">${CHIPS.concat(g.find.dim==='v'?['m/s']:[]).map(u=>`<button class="unit" data-u="${u}" aria-pressed="false">${u}</button>`).join('')}</div>`}
      <button class="btn primary wide" id="bCheck" style="margin-top:${g.fixed?'12px':'0'}">Sprawdź</button>`;
    ans.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{ unit=b.dataset.u; ans.querySelectorAll('.unit').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
    const check=()=>{
      const r=checkNum(g,$('inp').value,unit);
      if(r.empty){ $('inp').focus(); return; }
      $('inp').disabled=true; $('bCheck').disabled=true; ans.querySelectorAll('.unit').forEach(b=>b.disabled=true);
      after(r.ok,`${$('inp').value} ${g.fixed||unit||'(bez jednostki)'}`,r.msg);
    };
    $('bCheck').onclick=check; $('inp').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } };
    if(!matchMedia('(pointer:coarse)').matches) $('inp').focus();
    return;
  }
  const order=q.type==='tf'?(q.o[0]==='Prawda'?[0,1]:[1,0]):shuffle(q.o.map((_,i)=>i));
  ans.innerHTML=`<div class="${q.type==='tf'?'tf':'opts'}">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;
  const btns=[...ans.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===0;
    btns.forEach(x=>{ x.disabled=true; if(!test){ if(+x.dataset.i===0) x.classList.add('ok'); else if(x===b) x.classList.add('no'); } });
    after(ok,q.o[i]);
  });
}

/* ============ KROK PO KROKU ============ */
const STEP_GENS=['gW','gF','gS','gP','gWPt','gt','gFsT','gPts','gmgh','gmghP','gFv'];
function vKroki(){ window.scrollTo(0,0); const id=rnd(STEP_GENS), gen=GN[id], g=gen.build(); g.__id=id; g.__star=!!gen.star; runSteps(g); }
function runSteps(g){
  const genId=g.__id;
  const steps=[], lines=[];
  let score=0, total=0;
  const conv=(g.given||[]).filter(x=>!x.raw&&x.u!==BASE[U[x.u].d]);
  conv.forEach(x=>steps.push({kind:'conv',x}));
  steps.push({kind:'find'},{kind:'formula'},{kind:'calc'},{kind:'answer'});
  if(g.find.force) g.text+=` Wynik podaj w ${UNAME[g.find.force]||g.find.force}.`;
  let k=0;
  const daneInit=(g.given||[]).map(x=>x.raw?`${x.sym} = ${fmtN(x.val)} ${x.u}`:x.u===BASE[U[x.u].d]?`${x.sym} = ${V(x.val,x.u)}`:`${x.sym} = ${V(x.val,x.u)} = …`).join('; ');
  $('view').innerHTML=`<div class="card"><div class="qhead"><span>🪜 Zadanie krok po kroku${g.__star?' · ⭐':''}</span><button class="btn small" id="bNew">Inne zadanie</button></div>
    <div class="qtext">${g.text}</div>
    <div class="steps" id="steps"><div class="ln"><span class="k">Dane:</span> ${esc(daneInit)}</div></div>
    <div class="stepq" id="stepq"></div></div>`;
  $('bNew').onclick=vKroki;
  const addLine=(html)=>{ const d=document.createElement('div'); d.className='ln'; d.innerHTML=html; $('steps').appendChild(d); };
  function done(ok,label,correctHtml){
    total++; if(ok) score++;
    addLine(`<span class="${ok?'ok':'bad'}">${ok?'✔':'✘'}</span> <span class="k">${label}</span> ${correctHtml}`);
    k++; k<steps.length?next():finish();
  }
  function mcStep(label,prompt,opts,correct,explain){
    const order=shuffle(opts.map((_,i)=>i));
    $('stepq').innerHTML=`<div class="lab">${label}</div><p>${prompt}</p><div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(opts[i])}</button>`).join('')}</div><div id="sfb"></div>`;
    const btns=[...$('stepq').querySelectorAll('.opt')];
    btns.forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.i===0;
      btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===0) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
      const cont=()=>done(ok,label,esc(correct));
      if(ok){ setTimeout(cont,550); }
      else { $('sfb').innerHTML=`<div class="fb bad">${explain?esc(explain):''}</div><button class="btn primary wide next" id="bGoOn">Dalej</button>`; $('bGoOn').onclick=cont; }
    });
  }
  function numStep(label,prompt,sub,correctText,explain){
    $('stepq').innerHTML=`<div class="lab">${label}</div><p>${prompt}</p><div id="nbox"></div>`;
    askQ({type:'num',q:'',g:sub,t:'jedn'},$('nbox'),(ok)=>{
      const cont=()=>done(ok,label,esc(correctText));
      if(ok){ setTimeout(cont,550); return true; }
      return false;
    },()=>done(false,label,esc(correctText)));
    $('nbox').querySelector('.qtext').remove();
  }
  function next(){
    const st=steps[k];
    if(st.kind==='conv'){
      const x=st.x, b=BASE[U[x.u].d];
      numStep('Dane – zamiana jednostek',`Zamień na jednostkę podstawową: <b>${x.sym} = ${esc(V(x.val,x.u))}</b> = ? ${b}`,{fixed:b,find:{dim:U[b].d,val:x.val,force:b},conv:true,calc:[`${x.sym} = ${V(x.val,x.u)} = ${V(x.val,b)}`]},`${x.sym} = ${V(x.val,x.u)} = ${V(x.val,b)}`);
    } else if(st.kind==='find'){
      const syms=['P','W','t','F','s'].filter(s=>s!==g.find.sym);
      mcStep('Szukane','Czego szukamy?',[`${g.find.sym} = ?`,...shuffle(syms).slice(0,3).map(s=>`${s} = ?`)],`${g.find.sym} = ?`,'Przeczytaj jeszcze raz, o co pyta polecenie.');
    } else if(st.kind==='formula'){
      mcStep('Wzór','Który wzór zastosujesz?',[g.formula,...g.wrongF],g.formula,'Pomaga trójkąt: W na górze; na dole F i s albo P i t. Zakryj szukaną wielkość.');
    } else if(st.kind==='calc'){
      const c=g.calc.slice(); if(g.find.force) c[c.length-1]+=` = ${V(g.find.val,g.find.force)}`;
      numStep('Obliczenia',`Oblicz <b>${g.find.sym}</b> i wybierz jednostkę.${g.find.force?` Pamiętaj: wynik w <b>${g.find.force}</b>.`:''}${g.note?`<br><span class="muted small">${esc(g.note)}</span>`:''}`,{find:g.find,given:g.given,formula:g.formula,subj:g.subj,calc:g.calc,note:g.note,text:''},c.join('; '));
    } else {
      const f=g.find, target=f.force||BASE[f.dim], num=fmtN(f.val/U[target].f);
      const wrongUnit={E:'W',P:'J',F:'J',s:'s',t:'m',v:'m'}[f.dim];
      const opts=[`${g.subj} ${answerText(g)}.`,`${g.subj} ${num}.`,`${g.subj} ${num} ${wrongUnit}.`];
      if(f.force) opts.push(`${g.subj} ${V(f.val,BASE[f.dim])}.`); else opts.push(`${g.subj} ${fmtN(f.val/1000)} ${BASE[f.dim]}.`);
      mcStep('Odpowiedź','Wybierz poprawną odpowiedź słowną:',opts,opts[0],'Odpowiedź pełnym zdaniem, z właściwą liczbą i jednostką (i w tej jednostce, której żąda polecenie).');
    }
  }
  function finish(){
    const ok=score===total;
    if(genId) record(genId,ok);
    $('stepq').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="h">${ok?'Komplet – tak to ma wyglądać w zeszycie! 🏆':`${score} z ${total} kroków dobrze`}</div>${ok?'':'<div>Przepisz sobie poprawne rozwiązanie:</div>'}${solutionHtml(g)}</div>
      <button class="btn primary wide next" id="bMore">Następne zadanie</button>`;
    $('bMore').onclick=vKroki;
  }
  next();
}

function okChain(ch,sc){
  if(new Set(ch).size!==ch.length) return false;
  return [sc.c,...(sc.alt||[])].some(core=>{
    if(ch[0]!==core[0]) return false;
    const allowed=new Set([...core,...(sc.x||[])]); if(ch.some(f=>!allowed.has(f))) return false;
    const idx=core.map(f=>ch.indexOf(f)); return idx.every(i=>i>=0)&&idx.every((v,i)=>i===0||v>idx[i-1]);
  });
}
function vPrzemiany(){
  const pool=shuffle(BUILD.filter(b=>((S.q['b:'+b.id]||{}).b||0)<1)); const sc=(pool.length?pool:shuffle(BUILD))[0];
  let ch=[];
  const done=BUILD.filter(b=>((S.q['b:'+b.id]||{}).b||0)>=1).length;
  function draw(){
    $('view').innerHTML=`<div class="card"><div class="qhead"><span>🔋 Ułóż przemianę energii</span><span>${done} / ${BUILD.length}</span></div>
      <div class="scen">${sc.e} ${esc(sc.t)}</div>
      <p class="muted small">Klikaj formy energii po kolei – od tej, która była na początku.</p>
      <div class="chain" id="chain">${ch.length?ch.map(f=>`<span class="f">${esc(FORMS[f])}</span>`).join('<span class="ar">→</span>'):'<span class="muted">…</span>'}</div>
      <div class="forms">${Object.keys(FORMS).map(f=>`<button class="form" data-f="${f}" ${ch.includes(f)?'disabled':''}>${esc(FORMS[f])}</button>`).join('')}</div>
      <div class="row"><button class="btn small" id="bUndo" ${ch.length?'':'disabled'}>Cofnij</button><button class="btn primary" id="bChk" ${ch.length>=2?'':'disabled'}>Sprawdź</button><button class="btn small" id="bSkip">Inny przykład</button></div>
      <div id="pfb"></div></div>`;
    $('view').querySelectorAll('.form').forEach(b=>b.onclick=()=>{ ch.push(b.dataset.f); draw(); });
    $('bUndo').onclick=()=>{ ch.pop(); draw(); };
    $('bSkip').onclick=vPrzemiany;
    $('bChk').onclick=()=>{
      const ok=okChain(ch,sc); record('b:'+sc.id,ok);
      const full=sc.c.map(f=>FORMS[f]).join(' → ')+(sc.x&&sc.x.length?` (dodatkowo: ${sc.x.map(f=>FORMS[f]).join(', ')})`:'');
      $('view').querySelectorAll('button').forEach(b=>b.disabled=true);
      $('pfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Jeszcze nie'}</div><div><b>${esc(full)}</b></div><div class="muted" style="margin-top:4px">${esc(sc.ex)}</div></div>
        <button class="btn primary wide next" id="bNextP">Następny przykład</button>`;
      $('bNextP').onclick=vPrzemiany; header();
    };
  }
  draw();
}

/* ============ KARTKÓWKA ============ */
function vKartkowka(start){
  if(!start){
    const hist=S.tests.slice(-5).reverse();
    $('view').innerHTML=`<div class="card"><h2>📝 Kartkówka próbna</h2>
      <p>15 pytań ze wszystkich zagadnień – także zadania rachunkowe z jednostkami. Podpowiedzi zobaczysz dopiero na końcu, tak jak na prawdziwej kartkówce.</p>
      <p class="muted small">Przygotuj kartkę i kalkulator. Liczby możesz wpisywać z przecinkiem.</p>
      <button class="btn primary wide" id="bStart">Zaczynam</button>
      ${hist.length?`<h3>Ostatnie wyniki</h3><p>${hist.map(h=>`${h.d}: <b>${h.p}%</b> (${grade(h.p)[0]})`).join('<br>')}</p>`:''}</div>`;
    $('bStart').onclick=()=>vKartkowka(true); return;
  }
  const plan={praca:2,wzorW:2,wzorP:2,jedn:2,mocUrz:2,zlozone:2,energia:3};
  let refs=[];
  for(const [t,n] of Object.entries(plan)){
    const st=shuffle(QS.filter(q=>q.t===t&&!q.star)), gs=GENS.filter(g=>g.t===t&&!g.star);
    if(gs.length){ refs.push({gen:rnd(gs).id}); refs.push(...st.slice(0,n-1).map(q=>({id:q.id}))); }
    else refs.push(...st.slice(0,n).map(q=>({id:q.id})));
  }
  startRound(refs,'Kartkówka próbna',true);
}

function vNauka(){

  <p>Gdy przemieszczenie jest zgodne z kierunkiem i zwrotem siły:</p>
  <div class="formula">W = F · s</div>

  <p><b>Praca NIE jest wykonywana, gdy:</b></p>
  <ol><li><b>F = 0</b> – brak siły (krążek sunie po idealnie gładkim lodzie),</li>
  <li><b>s = 0</b> – ciało się nie przesuwa (pchasz ścianę, trzymasz siatkę w miejscu, wisi lampa),</li>
  <li><b>F ⊥ s</b> – siła prostopadła do ruchu (niesiesz torbę po poziomym chodniku).</li></ol>

  <h3>📏 Jednostka pracy – dżul</h3>
  <div class="def"><b>1 J</b> to praca wykonana przez siłę <b>1 N</b> na drodze <b>1 m</b>: &nbsp;<b>1 J = 1 N · 1 m</b></div>
  <p class="muted small">Od nazwiska Jamesa Prescotta Joule’a.</p>

  <h3>⚙️ Moc</h3>
  <div class="def">Moc informuje o tym, <b>jak szybko wykonywana jest praca</b>. Moc to iloraz pracy i czasu, w którym ta praca została wykonana.</div>
  <div class="formula">P = W / t</div>
  <p>P – moc [W], W – praca [J], t – czas [s]. (P od ang. <i>power</i>.)</p>
  <div class="def"><b>1 W</b> to moc urządzenia, które w ciągu <b>1 s</b> wykonuje pracę <b>1 J</b>: &nbsp;<b>1 W = 1 J / 1 s</b></div>

  <p>Wat – od nazwiska Jamesa Watta (XVIII w.), konstruktora silnika parowego. Moc pojazdów podaje się często w koniach mechanicznych: <b>1 KM ≈ 735 W</b>.</p>
