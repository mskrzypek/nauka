<!doctype html>
<html lang="pl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwasy, zasady, pH – fiszki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7F3; --grid:#DFEBE2; --ink:#16271D; --muted:#56695C; --line:#CADCCF; --surface:#FFFFFF; --soft:#E9F2EC;
  --accent:#2E8B57; --accent-ink:#FFFFFF; --ok:#1C7F54; --okbg:#E2F3EA; --bad:#C0284E; --badbg:#FBE5EB; --warn:#9A6700; --warnbg:#FFF4D6;
  --sel:#2F5BD3; --selbg:#E6EDFF;
  --shadow:0 1px 2px rgba(22,39,29,.06),0 6px 18px rgba(22,39,29,.06);
  --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1813; --grid:#16231B; --ink:#E6F0E9; --muted:#9DB3A4; --line:#29402F; --surface:#15221A; --soft:#1B2B21;
    --accent:#5CC98A; --accent-ink:#0F1813; --ok:#55D197; --okbg:#10362A; --bad:#FF7C9C; --badbg:#3C1628; --warn:#FFD36B; --warnbg:#3A3116;
    --sel:#8FB0FF; --selbg:#1C2847; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--ink); font:18px/1.5 var(--fb); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px}
.wrap{max-width:660px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px max(90px,calc(env(safe-area-inset-bottom) + 80px))}
h1,h2{font-family:var(--fh); line-height:1.12; margin:0}
h1{font-size:clamp(26px,7vw,36px); font-weight:800; letter-spacing:-.02em}
h2{font-size:21px; font-weight:800; margin-bottom:8px}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.btn{border:2px solid var(--ink); background:transparent; border-radius:12px; padding:9px 16px; font:800 16px var(--fh)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%; padding:13px}
.btn:disabled{opacity:.4}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15px; font-weight:700}
.big{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow); margin-bottom:10px}
.big .i{font-size:28px; width:38px; text-align:center; flex:none}
.big .t{font:800 18px var(--fh); display:block}
.big .d{color:var(--muted); font-size:14px; line-height:1.35; display:block}
.big.dark{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.big.dark .d{color:var(--paper); opacity:.8}
.big.trap{border:2px solid #E0A800}
.bar{height:7px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; background:var(--ok); border-radius:6px}
.top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.back{border:1px solid var(--line); background:var(--surface); width:44px; height:44px; border-radius:50%; font-size:20px; flex:none; box-shadow:var(--shadow)}
.prog{height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:12px}
.prog span{display:block; height:100%; background:var(--accent); transition:width .25s}

/* fiszka */
.q{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow)}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.qlab{font:700 13px var(--fh); color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.qt{font:800 21px/1.3 var(--fh); margin:6px 0 14px}
.tag{display:inline-block; background:var(--warnbg); color:var(--warn); border-radius:8px; padding:0 8px; font:700 12px var(--fh)}
.opts{display:grid; gap:8px}
.opt{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; line-height:1.35; font-weight:700}
.opts.two{grid-template-columns:repeat(2,1fr)} .opts.two .opt{text-align:center; padding:16px 4px; font-size:17px}
.opts.five{grid-template-columns:repeat(5,1fr); gap:6px} .opts.five .opt{text-align:center; padding:16px 2px; font-size:16px}
.opts.three{grid-template-columns:repeat(3,1fr)} .opts.three .opt{text-align:center; padding:16px 4px; font-size:17px}
.opt.ok{border-color:var(--ok); background:var(--okbg)} .opt.no{border-color:var(--bad); background:var(--badbg)}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pairs .col{display:grid; gap:8px; align-content:start}
.pb{position:relative; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 10px 9px 12px; line-height:1.3; font-size:15px; font-weight:700; min-height:48px}
.pb.sel{border-color:var(--sel); background:var(--selbg)}
.pb .n{position:absolute; top:-8px; right:-6px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:800 12px var(--fh); color:#fff}
.pb.ok{border-color:var(--ok); background:var(--okbg)} .pb.no{border-color:var(--bad); background:var(--badbg)}
.why{margin-top:12px; border-radius:14px; padding:12px 14px}
.why.ok{background:var(--okbg)} .why.bad{background:var(--badbg)}
.why .h{font:800 18px var(--fh)}
.why .w{margin-top:6px; font-size:16px}
.why ul{margin:6px 0 0; padding-left:1.1em; font-size:16px}
sup,sub{font-size:.72em; line-height:0} sup{vertical-align:.55em} sub{vertical-align:-.3em}
.diff{border-top:1px solid var(--line); padding:10px 0}
.diff .qq{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ============ GRACZ ============ */
const KIDS={wiktor:'Wiktor',igor:'Igor',zoja:'Zoja'};
let kid=(new URLSearchParams(location.search).get('dla')||'wiktor').toLowerCase();
if(!KIDS[kid]) kid='wiktor';

/* ============ PYTANIA ============ */
// Treść wyłącznie z materiału „Chemia kl. 8 – kwasy, zasady, wskaźniki i skala pH” (kartkówka).
// mc: o[0] = poprawna odpowiedź (kolejność jest losowana; Prawda/Fałsz – stała). pairs: [lewa, prawa] = poprawne pary.
// fx: stałe przyciski (dysocjuje / nie dysocjuje, kwasowy / obojętny / zasadowy), c = indeks poprawnej.
// trap: najczęstsze pułapki (częściej w powtórkach + osobny tryb „Pułapki”).
const GROUPS=[
  {id:'g1',n:'Dysocjacja – pojęcia',i:'⚡'},
  {id:'g2',n:'Równania – kwasy',i:'🍋'},
  {id:'g3',n:'Równania – zasady',i:'🧼'},
  {id:'g4',n:'Wskaźniki',i:'🎨'},
  {id:'g5',n:'Skala pH',i:'📏'},
  {id:'g6',n:'pH w życiu i szeregowanie',i:'🔢'},
];
const Q=[];
const DY=['dysocjuje','nie dysocjuje'], OD=['kwasowy','obojętny','zasadowy'];
const mc=(g,id,q,o,e,trap)=>Q.push({g,id,type:'mc',q,o,c:0,e,trap:!!trap});
const fx=(g,id,q,opts,ans,e,trap)=>Q.push({g,id,type:'mc',q,o:opts,c:opts.indexOf(ans),fixed:true,e,trap:!!trap});
const pairs=(g,id,q,p,e,trap)=>Q.push({g,id,type:'pairs',q,p,e,trap:!!trap});

// 1. Dysocjacja – pojęcia
mc('g1','1a','Dysocjacja jonowa to…',['rozpad substancji na jony pod wpływem wody','łączenie się jonów w cząsteczki','rozpuszczanie metalu w kwasie','zmiana barwy wskaźnika'],'W równaniu dysocjacji zapisujemy H₂O nad strzałką.');
pairs('g1','1b','Dobierz nazwę jonu do opisu.',[['kation','jon dodatni, np. H⁺, Na⁺, Ca²⁺'],['anion','jon ujemny, np. Cl⁻, OH⁻, SO₄²⁻']],'Za odczyn kwasowy odpowiadają kationy H⁺, a za zasadowy – aniony OH⁻.');
mc('g1','1c','Kwas dysocjuje na…',['kationy wodoru H⁺ i aniony reszty kwasowej','kationy metalu i aniony wodorotlenkowe OH⁻','kationy metalu i aniony reszty kwasowej','aniony wodoru i kationy reszty kwasowej'],'Jony H⁺ z kwasu odpowiadają za odczyn kwasowy.');
mc('g1','1d','Zasada dysocjuje na…',['kationy metalu i aniony wodorotlenkowe OH⁻','kationy wodoru H⁺ i aniony reszty kwasowej','kationy OH⁺ i aniony metalu','same cząsteczki wody'],'Jony OH⁻ z zasady odpowiadają za odczyn zasadowy.');
mc('g1','1e','Zasada to…',['wodorotlenek, który rozpuszcza się w wodzie','każdy wodorotlenek','każdy tlenek metalu','każda substancja o pH mniejszym niż 7'],'Wodorotlenki nierozpuszczalne w wodzie, np. Cu(OH)₂ i Fe(OH)₃, nie są zasadami i nie dysocjują.',true);
fx('g1','1f','CO₂ (tlenek węgla(IV)) w wodzie…',DY,'nie dysocjuje','Tlenki nie dysocjują – tlenek niemetalu reaguje z wodą i tworzy kwas, a dysocjuje dopiero ten kwas.',true);
fx('g1','1g','Cu(OH)₂ w wodzie…',DY,'nie dysocjuje','Cu(OH)₂ nie rozpuszcza się w wodzie, więc nie jest zasadą i nie dysocjuje.',true);
fx('g1','1h','CaO (tlenek wapnia) w wodzie…',DY,'nie dysocjuje','Tlenek metalu reaguje z wodą i tworzy zasadę (CaO → Ca(OH)₂) – dysocjuje dopiero ta zasada.',true);
fx('g1','1i','KOH w wodzie…',DY,'dysocjuje','KOH to zasada (rozpuszczalny wodorotlenek): KOH → K⁺ + OH⁻.');

// 2. Równania – kwasy
mc('g2','2a','Które równanie dysocjacji HCl jest poprawne?',['HCl → H⁺ + Cl⁻','HCl → H⁻ + Cl⁺','HCl → H + Cl','HCl → 2H⁺ + Cl²⁻'],'Powstaje kation wodoru i anion chlorkowy; ładunek „1” piszemy samym znakiem.');
mc('g2','2b','Które równanie dysocjacji HNO₃ jest poprawne?',['HNO₃ → H⁺ + NO₃⁻','HNO₃ → H⁺ + NO₃','HNO₃ → 3H⁺ + NO⁻','HNO₃ → H₃⁺ + NO⁻'],'Anion azotanowy(V) NO₃⁻ – każdy jon musi mieć ładunek.',true);
mc('g2','2c','Które równanie dysocjacji H₂SO₄ jest poprawne?',['H₂SO₄ → 2H⁺ + SO₄²⁻','H₂SO₄ → H₂⁺ + SO₄²⁻','H₂SO₄ → 2H⁺ + SO₄⁻','H₂SO₄ → H⁺ + SO₄²⁻'],'Kationy wodoru są osobne – liczbę piszemy przed H; reszta (anion siarczanowy(VI)) dostaje tyle minusów, ile oddała H.',true);
mc('g2','2d','Które równanie dysocjacji H₂S jest poprawne?',['H₂S → 2H⁺ + S²⁻','H₂S → H₂⁺ + S²⁻','H₂S → 2H⁺ + S⁻','H₂S → H⁺ + S²⁻'],'Dwa atomy H to dwa kationy H⁺, a S²⁻ to anion siarczkowy.');
mc('g2','2e','Które równanie dysocjacji H₂SO₃ jest poprawne?',['H₂SO₃ → 2H⁺ + SO₃²⁻','H₂SO₃ → 2H⁺ + SO₄²⁻','H₂SO₃ → H₂⁺ + SO₃²⁻','H₂SO₃ → 2H⁺ + SO₃⁻'],'SO₃²⁻ to anion siarczanowy(IV), a SO₄²⁻ – siarczanowy(VI).');
mc('g2','2f','Które równanie dysocjacji H₂CO₃ jest poprawne?',['H₂CO₃ → 2H⁺ + CO₃²⁻','H₂CO₃ → 2H⁺ + CO₃⁻','H₂CO₃ → H₂⁺ + CO₃²⁻','H₂CO₃ → H⁺ + CO₃²⁻'],'CO₃²⁻ to anion węglanowy; sprawdź ładunki: 2 · (+1) + (−2) = 0.');
mc('g2','2g','Które równanie dysocjacji H₃PO₄ jest poprawne?',['H₃PO₄ → 3H⁺ + PO₄³⁻','H₃PO₄ → 3H⁺ + PO₄⁻','H₃PO₄ → H₃⁺ + PO₄³⁻','H₃PO₄ → 3H⁺ + PO₄²⁻'],'Reszta kwasowa oddała 3 atomy H, więc ma ładunek 3− (anion fosforanowy(V)): 3 · (+1) + (−3) = 0.',true);
pairs('g2','2h','Dobierz anion do nazwy.',[['Cl⁻','anion chlorkowy'],['NO₃⁻','anion azotanowy(V)'],['S²⁻','anion siarczkowy'],['SO₃²⁻','anion siarczanowy(IV)'],['SO₄²⁻','anion siarczanowy(VI)']],'Siarczanowy(IV) ma 3 atomy tlenu, siarczanowy(VI) – 4.');
pairs('g2','2i','Dobierz anion do nazwy.',[['CO₃²⁻','anion węglanowy'],['PO₄³⁻','anion fosforanowy(V)'],['OH⁻','anion wodorotlenkowy']],'Anion wodorotlenkowy OH⁻ powstaje przy dysocjacji zasad.');

// 3. Równania – zasady
pairs('g3','3a','Dobierz wzór zasady do nazwy.',[['NaOH','zasada sodowa'],['KOH','zasada potasowa'],['Ca(OH)₂','zasada wapniowa (woda wapienna)'],['Ba(OH)₂','zasada barowa']],'Każda z nich dysocjuje na kation metalu i aniony OH⁻.');
mc('g3','3b','Które równanie dysocjacji NaOH jest poprawne?',['NaOH → Na⁺ + OH⁻','NaOH → Na⁻ + OH⁺','NaOH → Na + OH','NaOH → Na⁺ + O²⁻ + H⁺'],'Każdy jon musi mieć ładunek: kation sodu Na⁺ i anion wodorotlenkowy OH⁻.');
mc('g3','3c','Które równanie dysocjacji Ca(OH)₂ jest poprawne?',['Ca(OH)₂ → Ca²⁺ + 2OH⁻','Ca(OH)₂ → Ca²⁺ + OH⁻','Ca(OH)₂ → Ca⁺ + 2OH⁻','Ca(OH)₂ → Ca²⁺ + (OH)₂²⁻'],'Grupy OH są osobnymi jonami – liczbę za nawiasem piszemy przed OH⁻; wapń ma wartościowość II, więc Ca²⁺.',true);
mc('g3','3d','Które równanie dysocjacji Ba(OH)₂ jest poprawne?',['Ba(OH)₂ → Ba²⁺ + 2OH⁻','Ba(OH)₂ → Ba⁺ + 2OH⁻','Ba(OH)₂ → Ba²⁺ + OH₂⁻','Ba(OH)₂ → Ba²⁺ + 2OH²⁻'],'Metal dostaje ładunek równy wartościowości (Ba²⁺), a jonów OH⁻ jest tyle, ile grup OH; sprawdź: (+2) + 2 · (−1) = 0.');
mc('g3','3e','Prawda czy fałsz: „Ładunek 1 zapisujemy z jedynką, np. H¹⁺, Cl¹⁻.”',['Fałsz – piszemy sam znak: H⁺, Cl⁻','Prawda'],'Ładunek „1” piszemy samym znakiem: H⁺, Na⁺, Cl⁻, OH⁻.',true);

// 4. Wskaźniki
mc('g4','4a','Fenoloftaleina w zasadzie (np. NaOH) ma kolor…',['malinowy','bezbarwny','niebieski','czerwony'],'Fenoloftaleina reaguje tylko na zasady – robi się malinowa.');
mc('g4','4b','Fenoloftaleina w kwasie (np. w occie) jest…',['bezbarwna','czerwona','malinowa','żółta'],'W kwasie i w wodzie fenoloftaleina jest bezbarwna, więc bezbarwny roztwór nie musi być kwasem.',true);
mc('g4','4c','Oranż metylowy w kwasie (np. HCl) ma kolor…',['czerwony','żółty','pomarańczowy','malinowy'],'Oranż metylowy to specjalista od kwasów – z pomarańczowego robi się czerwony.');
mc('g4','4d','Oranż metylowy w wodzie ma kolor…',['pomarańczowy','czerwony','żółty','bezbarwny'],'W zasadzie oranż jest żółty, ale ta zmiana jest słabo widoczna – do wykrywania zasad się nie nadaje.');
pairs('g4','4e','Papierek uniwersalny – dobierz kolor do odczynu.',[['kwasowy','czerwony'],['obojętny (woda)','żółty'],['zasadowy','niebieski']],'Papierek uniwersalny wykryje wszystko, a po porównaniu ze skalą barw pokaże też w przybliżeniu pH.');
pairs('g4','4f','Roztwór lakmusu – dobierz kolor do odczynu.',[['kwasowy','czerwony'],['obojętny','fioletowy'],['zasadowy','niebieski']],'Niebieski papierek lakmusowy w kwasie czerwienieje, a w zasadzie zostaje niebieski.');
pairs('g4','4g','Wywar z czerwonej kapusty – dobierz kolor do odczynu.',[['kwasowy','czerwony'],['obojętny','fioletowy'],['zasadowy','zielony']],'Wywar z kapusty ma trzy różne kolory, więc odróżni kwas, wodę i zasadę.');
mc('g4','4h','Błękit tymolowy w zasadzie ma kolor…',['niebieski','żółty','malinowy','zielony'],'W kwasie i w wodzie błękit tymolowy jest żółty (w bardzo mocnym kwasie – czerwony), dlatego wykrywa zasady.');
mc('g4','4i','Który wskaźnik ma ten sam kolor w kwasie i w wodzie, więc nie wykryje kwasu?',['fenoloftaleina','oranż metylowy','papierek uniwersalny','roztwór lakmusu'],'Prawie każdy wskaźnik w kwasie jest czerwony – wyjątki to fenoloftaleina (bezbarwna) i błękit tymolowy (żółty).',true);
mc('g4','4j','Który zestaw wskaźników wykrywa ZASADY?',['papierek uniwersalny, fenoloftaleina, błękit tymolowy','oranż metylowy, fenoloftaleina, papierek uniwersalny','tylko oranż metylowy','oranż metylowy i błękit tymolowy'],'Zasady wykrywają też lakmus (niebieski) i wywar z kapusty (zielony); oranż metylowy się do tego nie nadaje.');
mc('g4','4k','Który zestaw wskaźników wykrywa KWASY?',['papierek uniwersalny, oranż metylowy, lakmus','fenoloftaleina i błękit tymolowy','tylko fenoloftaleina','fenoloftaleina i lakmus'],'Kwasy wykrywa też wywar z kapusty – wszystkie barwią się w kwasie na czerwono.');
mc('g4','4l','Masz kwas, zasadę i wodę bez etykiet. Który JEDEN wskaźnik rozpozna wszystkie trzy?',['papierek uniwersalny','fenoloftaleina','oranż metylowy','błękit tymolowy'],'Potrzebny jest wskaźnik o trzech różnych kolorach: papierek uniwersalny (czerwony / żółty / niebieski), roztwór lakmusu albo wywar z kapusty.',true);
mc('g4','4m','Do trzech probówek dodano fenoloftaleinę. Malinowa zrobiła się tylko probówka nr 2. Co wiesz na pewno?',['w nr 2 jest zasada, a kwasu i wody jeszcze nie odróżnisz','w nr 1 i nr 3 są kwasy','w nr 2 jest kwas','we wszystkich jest woda'],'Fenoloftaleina w kwasie i w wodzie jest bezbarwna; dalej np. oranż metylowy: czerwony = kwas, pomarańczowy = woda.',true);

// 5. Skala pH
fx('g5','5a','Roztwór o pH = 3 ma odczyn…',OD,'kwasowy','pH mniejsze niż 7 – odczyn kwasowy, więcej jonów H⁺ niż OH⁻.');
fx('g5','5b','Roztwór o pH = 7,5 ma odczyn…',OD,'zasadowy','Już powyżej 7 odczyn jest zasadowy – przy 7,5 bardzo słabo zasadowy.',true);
fx('g5','5c','Roztwór o pH = 6,5 ma odczyn…',OD,'kwasowy','Poniżej 7 odczyn jest kwasowy – przy 6,5 bardzo słabo kwasowy.',true);
fx('g5','5d','Roztwór o pH = 7 ma odczyn…',OD,'obojętny','pH = 7 (np. woda destylowana) to ani kwas, ani zasada – jonów H⁺ i OH⁻ jest tyle samo.');
mc('g5','5e','W roztworze o odczynie zasadowym jest…',['więcej jonów OH⁻ niż H⁺','więcej jonów H⁺ niż OH⁻','tyle samo jonów H⁺ i OH⁻','brak jakichkolwiek jonów'],'Kwasowy: H⁺ > OH⁻; obojętny: H⁺ = OH⁻; zasadowy: OH⁻ > H⁺.',true);
mc('g5','5f','Który roztwór jest mocniej zasadowy?',['pH = 12','pH = 9','pH = 7','pH = 2'],'Im większe pH (powyżej 7), tym mocniejsza zasada; im mniejsze pH, tym mocniejszy kwas.',true);
mc('g5','5g','Roztwory tlenków niemetali (np. SO₃, CO₂) mają odczyn…',['kwasowy – tlenki niemetali tworzą z wodą kwasy','zasadowy – tworzą z wodą zasady','obojętny','zależny od użytego wskaźnika'],'Roztwory tlenków metali (np. Na₂O, CaO) mają odczyn zasadowy – tworzą z wodą zasady.');

// 6. pH w życiu i szeregowanie
pairs('g6','6a','Dobierz substancję do jej pH.',[['sok żołądkowy','1–2'],['ocet','3'],['woda destylowana','7'],['krew','7,4'],['mydło','10']],'Najmocniejszy kwas z tych substancji to sok żołądkowy.');
pairs('g6','6b','Dobierz substancję do jej pH.',[['sok z cytryny','2–2,5'],['mleko','6,5'],['woda morska','8'],['płyn do udrażniania rur','13–14']],'Najmocniejsza zasada z tych substancji to płyn do udrażniania rur.');
mc('g6','6c','Uszereguj kwasy od najmocniejszego: pH 4,5; 0; 5; 2,5.',['0 → 2,5 → 4,5 → 5','5 → 4,5 → 2,5 → 0','2,5 → 0 → 4,5 → 5','0 → 4,5 → 2,5 → 5'],'Kwasy szeregujemy rosnąco – najmocniejszy kwas ma najmniejsze pH.');
mc('g6','6d','Uszereguj zasady od najmocniejszej: pH 11; 9; 12; 7,5; 13.',['13 → 12 → 11 → 9 → 7,5','7,5 → 9 → 11 → 12 → 13','13 → 12 → 11 → 9','12 → 13 → 11 → 9 → 7,5'],'Zasady szeregujemy malejąco – najmocniejsza ma największe pH; 7,5 to też zasada (bardzo słaba).');
mc('g6','6e','Masz wartości pH: 3; 7; 8; 6. Którą pomijasz przy podziale na kwasy i zasady?',['7','6','8','3'],'pH = 7 to odczyn obojętny – nie wpisujemy go ani do kwasów, ani do zasad.',true);

/* ============ ZAPIS ============ */
const KEY='chem-kwasy-v1:'+kid, INT=[0,1,3,7,14], KNOWN=2;
let S={q:{},days:[],rounds:[]}, canSave=true;
try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){ canSave=false; }
const save=()=>{ if(!canSave) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ canSave=false; } };
const dayStr=d=>d.toLocaleDateString('sv');
const today=()=>dayStr(new Date());
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dayStr(d); };
const st=q=>S.q[q.id];
const box=q=>(st(q)||{}).b||0;
const known=q=>box(q)>=KNOWN;
// Pomyłka: pudełko 0 i powrót jeszcze dziś. Dobra odpowiedź: kolejne pudełko i coraz dłuższa przerwa (1, 3, 7, 14 dni).
function record(q,ok){
  const e=S.q[q.id]||(S.q[q.id]={b:0,due:today(),r:0,w:0});
  if(ok){ e.r++; e.b=Math.min(INT.length-1,e.b+1); e.due=addDays(INT[e.b]); } else { e.w++; e.b=0; e.due=today(); }
  const d=today(); if(!S.days.includes(d)) S.days.push(d); save();
}

/* ============ POMOCNICZE ============ */
const $app=document.getElementById('app'), $=id=>document.getElementById(id);
const SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'−'}, SUB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
// Wzory chemiczne: znaki indeksów Unicode (H₂SO₄, SO₄²⁻) zamieniamy na <sub>/<sup>, bo na telefonie są za drobne.
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g,m=>'<sup>'+[...m].map(c=>SUP[c]).join('')+'</sup>')
  .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g,m=>'<sub>'+[...m].map(c=>SUB[c]).join('')+'</sub>');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pct=(a,b)=>b?Math.round(100*a/b):0;
const topBar=t=>`<div class="top"><button class="back" id="bBack" aria-label="Wróć">←</button><h2 style="margin:0;flex:1">${t}</h2></div>`;
const GN=Object.fromEntries(GROUPS.map(g=>[g.id,g]));
const COLORS=['#2F5BD3','#C2410C','#7C3AED','#0E7490'];
function streak(){ let n=0; const d=new Date(); if(!S.days.includes(dayStr(d))) d.setDate(d.getDate()-1); while(S.days.includes(dayStr(d))){ n++; d.setDate(d.getDate()-1); } return n; }

/* ============ DOBÓR FISZEK ============ */
// Najpierw te do powtórki (pomylone i z minionym terminem), potem nowe, a znane tylko wtedy, gdy brakuje innych.
function pick(pool,n){
  const t=today();
  const rank=q=>{ const e=st(q); let k;
    if(!e) k=1; else if(e.due<=t) k=e.b===0?0:.5; else k=2+e.b;
    return k-(q.trap?.4:0)+Math.random()*.6; };
  return pool.map(q=>({q,k:rank(q)})).sort((a,b)=>a.k-b.k).slice(0,n).map(x=>x.q);
}
const dueCount=pool=>pool.filter(q=>{ const e=st(q); return e&&e.due<=today(); }).length;
const hard=()=>Q.filter(q=>{ const e=st(q); return e&&e.w>0&&e.b<KNOWN; });

/* ============ EKRAN GŁÓWNY ============ */
function home(){
  window.scrollTo(0,0);
  const k=Q.filter(known).length, traps=Q.filter(q=>q.trap), hd=hard().length, s=streak(), due=dueCount(Q);
  $app.innerHTML=`<h1>🧪 Kwasy, zasady, pH</h1>
    <p class="muted" style="margin-top:4px">Cześć, ${esc(KIDS[kid])}! Fiszki na kartkówkę z chemii: równania dysocjacji, kolory wskaźników, skala pH i szeregowanie. To, co mylisz, wraca częściej; to, co umiesz – rzadziej.</p>
    <div class="pills"><span class="pill">🔥 ${s} ${s===1?'dzień':'dni'} z rzędu</span><span class="pill">✅ umiesz ${k} z ${Q.length}</span>${due?`<span class="pill">🔁 do powtórki: ${due}</span>`:''}</div>
    <button class="big dark" id="bAll"><span class="i">🎴</span><span><span class="t">Fiszki ze wszystkiego</span><span class="d">12 fiszek – najpierw powtórki i nowe</span></span></button>
    <button class="big trap" id="bTrap"><span class="i">⚠️</span><span><span class="t">Pułapki</span><span class="d">Ładunki jonów, 2H⁺ i 2OH⁻, tlenki nie dysocjują, fenoloftaleina, pH 6,5 i 7,5 (${traps.filter(known).length}/${traps.length})</span></span></button>
    <button class="big" id="bHard" ${hd?'':'disabled style="opacity:.5"'}><span class="i">🩹</span><span><span class="t">Trudne</span><span class="d">${hd?`${hd} ${hd===1?'fiszka sprawia':hd<5?'fiszki sprawiają':'fiszek sprawia'} trudność`:'Na razie nic nie sprawia trudności'}</span></span></button>
    <div class="card"><h2>Grupy</h2>${GROUPS.map(g=>{ const l=Q.filter(q=>q.g===g.id), kk=l.filter(known).length;
      return `<button class="big" data-g="${g.id}" style="box-shadow:none;margin-bottom:8px"><span class="i">${g.i}</span><span style="flex:1"><span class="t">${esc(g.n)}</span><span class="d">umiesz ${kk} z ${l.length}${dueCount(l)?` · do powtórki ${dueCount(l)}`:''}</span><span class="bar"><span style="width:${pct(kk,l.length)}%"></span></span></span></button>`; }).join('')}</div>
    ${canSave?'':'<p class="muted small">Ta przeglądarka nie zapisze postępów.</p>'}`;
  $('bAll').onclick=()=>round(pick(Q,12),'Wszystko');
  $('bTrap').onclick=()=>round(pick(traps,12),'⚠️ Pułapki');
  $('bHard').onclick=()=>{ if(hard().length) round(pick(hard(),12),'🩹 Trudne'); };
  $app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const g=GN[b.dataset.g]; round(pick(Q.filter(q=>q.g===g.id),12),`${g.i} ${g.n}`); });
}

/* ============ RUNDA ============ */
function round(items,title){
  window.scrollTo(0,0);
  const queue=items.map(q=>({q,again:false})), total=items.length, log=new Map(); let done=0;
  function next(){
    if(!queue.length) return finish();
    const cur=queue.shift(), q=cur.q;
    $app.innerHTML=`${topBar(esc(title))}<div class="prog"><span style="width:${100*done/total}%"></span></div>
      <div class="q" id="qc"><div class="qlab"><span>${GN[q.g].i} ${esc(GN[q.g].n)}${q.trap?' <span class="tag">pułapka</span>':''}</span><span>${cur.again?'jeszcze raz 💪':`${done+1}/${total}`}</span></div>
      <div class="qt">${esc(q.q)}</div><div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
    $('bBack').onclick=home;
    const after=(ok,detail)=>{
      if(!cur.again) record(q,ok);
      const L=log.get(q.id)||{q,wrong:0}; if(!ok) L.wrong++; log.set(q.id,L);
      if(!ok&&!cur.again) queue.splice(Math.min(queue.length,3),0,{q,again:true}); // pomylona fiszka wraca w tej samej rundzie
      if(ok||cur.again) done++;
      $('qc').classList.add(ok?'ok':'bad');
      $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Nie tym razem'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
        <button class="btn primary wide" id="bNext" style="margin-top:10px">Dalej</button>`;
      $('bNext').onclick=next; $('bNext').focus({preventScroll:true});
      $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    if(q.type==='mc') askMc(q,after); else askPairs(q,after);
  }
  function finish(){
    const entries=[...log.values()], wrong=entries.filter(x=>x.wrong>0), ok=entries.length-wrong.length;
    S.rounds.push({d:today(),n:entries.length,ok}); save();
    $app.innerHTML=`${topBar(esc(title))}<div class="card" style="text-align:center"><div style="font:800 52px/1 var(--fh)">${ok}/${entries.length}</div>
      <h2 style="margin-top:8px">${!wrong.length?'Bezbłędnie! 🏆':wrong.length<=2?'Bardzo dobrze! 👏':'Dobra robota – trudne fiszki wrócą w powtórce.'}</h2>
      <p class="muted small">dobrze za pierwszym razem</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="bAgain">Kolejna runda</button><button class="btn" id="bHome">Menu</button></div></div>
      ${wrong.length?`<div class="card"><h2>Sprawiły trudność</h2>${wrong.map(x=>`<div class="diff"><div class="qq">${esc(x.q.q)}</div><div>✅ ${x.q.type==='mc'?esc(x.q.o[x.q.c||0]):x.q.p.map(([a,b])=>`${esc(a)} → ${esc(b)}`).join('<br>✅ ')}</div><div class="muted small">${esc(x.q.e)}</div></div>`).join('')}</div>`:''}`;
    $('bBack').onclick=home; $('bHome').onclick=home;
    $('bAgain').onclick=()=>{ const pool=title==='⚠️ Pułapki'?Q.filter(q=>q.trap):title==='🩹 Trudne'?(hard().length?hard():Q):title==='Wszystko'?Q:Q.filter(q=>`${GN[q.g].i} ${GN[q.g].n}`===title); round(pick(pool,12),title); };
  }
  next();
}

/* ============ WYBÓR Z 2–4 ============ */
function askMc(q,after){
  const C=q.c||0;
  const order=q.fixed?q.o.map((_,i)=>i):q.o.length===2&&/^(Fałsz|Prawda|Tak|Nie)\b/.test(q.o[0])?q.o.map((_,i)=>i).sort((a,b)=>/^(Prawda|Tak)\b/.test(q.o[a])?-1:1):shuffle(q.o.map((_,i)=>i));
  $('ans').innerHTML=`<div class="opts${q.fixed?' '+({2:'two',3:'three',5:'five'}[q.o.length]||''):''}">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===C;
    btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===C) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${esc(q.o[C])}</b></div>`); });
}

/* ============ DOBIERZ W PARY ============ */
function askPairs(q,after){
  const L=q.p.map((p,i)=>({i,t:p[0]})), R=shuffle(q.p.map((p,i)=>({i,t:p[1]})));
  const match={}; let selL=null, locked=false;   // match[indeks lewej] = indeks prawej
  const draw=()=>{
    const usedR=Object.values(match), num=Object.keys(match).map(Number);
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotknij pojęcia po lewej, a potem pasującego po prawej.</p>
      <div class="pairs"><div class="col">${L.map(l=>{ const k=num.indexOf(l.i); return `<button class="pb${selL===l.i?' sel':''}" data-l="${l.i}">${esc(l.t)}${l.i in match?`<span class="n" style="background:${COLORS[Object.keys(match).indexOf(String(l.i))%4]}">${Object.keys(match).indexOf(String(l.i))+1}</span>`:''}</button>`; }).join('')}</div>
      <div class="col">${R.map(r=>{ const li=Object.keys(match).find(k=>match[k]===r.i); const k=li!=null?Object.keys(match).indexOf(li):-1; return `<button class="pb" data-r="${r.i}">${esc(r.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div></div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${Object.keys(match).length===L.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ if(locked) return; const i=+b.dataset.l; if(i in match){ delete match[i]; selL=i; } else selL=selL===i?null:i; draw(); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(locked||selL===null) return; const r=+b.dataset.r; const prev=Object.keys(match).find(k=>match[k]===r); if(prev!=null) delete match[prev]; match[selL]=r; selL=null; draw(); });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=L.every(l=>match[l.i]===l.i);
    $('ans').querySelectorAll('[data-l]').forEach(b=>{ const i=+b.dataset.l; b.disabled=true; b.classList.add(match[i]===i?'ok':'no'); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>{ b.disabled=true; const r=+b.dataset.r; const li=Object.keys(match).find(k=>match[k]===r); b.classList.add(+li===r?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<ul>${q.p.map(([a,b],i)=>`<li>${match[i]===i?'✅':'❌'} ${esc(a)} → <b>${esc(b)}</b></li>`).join('')}</ul>`);
  };
  draw();
}

/* ============ START ============ */
home();
</script>
<script src="../nav.js" defer></script>
<script src="../learn.js" defer></script>
