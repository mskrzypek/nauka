<!doctype html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dino – skacz przez kaktusy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#F7F7F7; --fg:#535353; --muted:#8A8A8A; --btn:#E9E9E9; --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif; }
@media (prefers-color-scheme: dark){ :root{ --bg:#16161C; --fg:#E4E4E4; --muted:#9A9AA4; --btn:#26262E; } }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%; background:var(--bg); overscroll-behavior:none}
body{color:var(--fg); font-family:var(--fh); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.wrap{max-width:900px; margin:0 auto; padding:max(14px,env(safe-area-inset-top)) 16px max(80px,calc(env(safe-area-inset-bottom) + 70px)); min-height:100vh; touch-action:manipulation}
h1{font:800 26px var(--fh); margin:0 0 2px; display:flex; justify-content:space-between; align-items:center}
.ib{width:40px; height:40px; border-radius:12px; border:0; background:var(--btn); color:var(--fg); font-size:19px; cursor:pointer}
.hello{color:var(--muted); font-size:15px; margin:0 0 12px}
.stage{position:relative; width:100%; border-radius:14px; overflow:hidden; touch-action:none; cursor:pointer}
canvas{display:block; width:100%}
.ctrls{display:grid; grid-template-columns:1.6fr 1fr; gap:12px; margin-top:14px; touch-action:none}
.ctl{border:0; border-radius:18px; padding:22px 0; background:var(--btn); color:var(--fg); font:800 20px var(--fh); touch-action:none; cursor:pointer}
.ctl:active,.ctl.on{filter:brightness(.9); transform:scale(.98)}
.hint{color:var(--muted); font-size:14px; text-align:center; margin-top:12px; line-height:1.4}
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <h1><span>🦖 Dino</span><button class="ib" id="bMute" aria-label="Dźwięk">🔊</button></h1>
  <div class="hello" id="hello"></div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="Gra: dinozaur przeskakuje kaktusy"></canvas></div>
  <div class="ctrls">
    <button class="ctl" id="bJump">⬆ Skok</button>
    <button class="ctl" id="bDuck">⬇ Schyl się</button>
  </div>
  <p class="hint">Dotknij planszy albo naciśnij spację, żeby skoczyć. Ptak na wysokości głowy? Przytrzymaj „Schyl się” (albo strzałkę w dół). Nad nisko lecącym – przeskocz.</p>
</main>
<script>
"use strict";
/* ============ GRACZ ============ */
const KIDS={igor:'Igor',zoja:'Zoja',wiktor:'Wiktor'};
let kid=(new URLSearchParams(location.search).get('dla')||'igor').toLowerCase();
if(!KIDS[kid]) kid='igor';
const KEY='dino-v1:'+kid;
let hi=0, muted=false;
try{ const r=JSON.parse(localStorage.getItem(KEY)||'null'); if(r){ hi=r.hi||0; muted=!!r.muted; } }catch(e){}
const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({hi,muted})); }catch(e){} };

/* ============ GRAFIKA (piksele) ============ */
const pad=rows=>{ const w=Math.max(...rows.map(r=>r.length)); return rows.map(r=>r.padEnd(w,'.')); };
const BODY=[
  "...........#######",
  "..........##.######",
  "..........#########",
  "..........#########",
  "..........#####",
  "..........#######",
  "#........#####",
  "#.......######",
  "##.....########",
  "###...#######.#",
  "############",
  "############",
  ".##########",
  "..########",
  "...######"];
const LEGS={stand:["...##..##","...#....#","...##...##"],a:["...##.###","...#","...##"],b:["...###.##","........#","........##"]};
const DINO={stand:pad(BODY.concat(LEGS.stand)),a:pad(BODY.concat(LEGS.a)),b:pad(BODY.concat(LEGS.b))};
const DUCKB=["..................########","#.......##########.#######","##....####################","######################",".###################.#","..#################"];
const DUCK={a:pad(DUCKB.concat(["...##..##","...#....##"])),b:pad(DUCKB.concat(["...###.##","........##"]))};
const BIRD={
  up:pad(["......#","......##","......###","..#...####",".##...#####","################","...###########","......######"]),
  down:pad(["","","..#",".##","################","...###########","......#######","......####","......###","......##"])};
const P=2.2; // rozmiar jednego „piksela” w jednostkach gry
function drawMap(map,x,y,col,eyeCol){
  ctx.fillStyle=col;
  for(let r=0;r<map.length;r++){ const row=map[r]; let c=0;
    while(c<row.length){ if(row[c]==='#'){ let e=c; while(e<row.length&&row[e]==='#') e++; ctx.fillRect(x+c*P,y+r*P,(e-c)*P+.3,P+.3); c=e; } else c++; } }
}

/* ============ PŁÓTNO ============ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const H=150, GROUND=136;
let W=400, scale=1, dpr=1;
function resize(){
  const cssW=document.getElementById('stage').clientWidth;
  const cssH=Math.round(Math.max(170,Math.min(cssW*(cssW<600?0.5:0.34),340)));
  dpr=Math.min(2,window.devicePixelRatio||1); scale=cssH/H; W=cssW/scale;
  cv.style.height=cssH+'px'; cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
}

/* ============ DŹWIĘK ============ */
let actx=null;
function tone(f,d,type,vol,delay,slide){
  if(muted) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.04,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sJump=()=>tone(520,.09,'square',.035,0,880);
const sPoint=()=>{ tone(880,.08,'square',.03); tone(1320,.12,'square',.03,.09); };
const sHit=()=>{ tone(180,.25,'sawtooth',.05,0,60); };

/* ============ STAN GRY ============ */
const V0=270, VMAX=640, ACC=5, GRAV=2160, JUMP=-610;
let S, keys={duck:false};
function reset(){
  S={state:'ready',t:0,v:V0,dist:0,score:0,nextPoint:100,
     d:{y:0,vy:0,air:false,duck:false,leg:0},obs:[],nextGap:260,
     clouds:[{x:W*.3,y:30},{x:W*.8,y:48}],ground:0,night:0,nightUntil:-1,nights:0,flash:0,dead:0};
}
function dinoBoxes(){
  const x=24, dk=S.d.duck&&!S.d.air;
  if(dk){ const y=GROUND-8*P; return [[x,y+P,22*P,5*P],[x+18*P,y,8*P,4*P]]; }
  const y=GROUND-18*P+S.d.y;
  return [[x+10*P,y,9*P,5*P],[x+1*P,y+6*P,13*P,9*P],[x+3*P,y+15*P,7*P,3*P]];
}
function spawn(){
  const v=S.v, types=['small'];
  if(v>=300) types.push('large');
  if(S.score>=250) types.push('bird');
  const t=types[Math.floor(Math.random()*types.length)];
  if(t==='bird'){
    const lv=[GROUND-28, GROUND-50, GROUND-82][Math.floor(Math.random()*3)];
    S.obs.push({k:'bird',x:W+10,y:lv,w:16*P,h:8*P,fl:0,vx:Math.random()<.5?30:0});
  } else {
    const max=t==='small'?(v<330?1:v<420?2:3):(v<420?1:v<520?2:3);
    const n=1+Math.floor(Math.random()*max), cw=t==='small'?13:19, ch=t==='small'?28:42;
    const parts=[]; for(let i=0;i<n;i++) parts.push({dx:i*(cw+3),h:ch-(Math.random()<.4?4:0),seed:Math.random()});
    S.obs.push({k:t,x:W+10,y:GROUND,w:n*(cw+3)-3,cw,parts});
  }
  const last=S.obs[S.obs.length-1];
  S.nextGap=last.w+v*(0.62+Math.random()*0.75);
}
const hit=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
function obsBoxes(o){
  if(o.k==='bird') return [[o.x+2*P,o.y+5*P,14*P,2*P], o.fl<.5?[o.x+6*P,o.y+2*P,5*P,4*P]:[o.x+6*P,o.y+7*P,6*P,4*P]];
  return o.parts.map(p=>[o.x+p.dx+2,o.y-p.h+2,o.cw-4,p.h-2]);
}

/* ============ PĘTLA ============ */
function update(dt){
  if(S.state!=='run') return;
  S.t+=dt; S.v=Math.min(VMAX,S.v+ACC*dt);
  const dx=S.v*dt; S.dist+=dx;
  S.score=Math.floor(S.dist/30);
  if(S.score>=S.nextPoint){ S.nextPoint+=100; S.flash=1; sPoint(); }
  const nc=Math.floor(S.score/700); if(nc>S.nights){ S.nights=nc; S.nightUntil=S.score+250; }
  S.night+=((S.score<S.nightUntil)?1:-1)*dt*1.2; S.night=Math.max(0,Math.min(1,S.night));
  // dinozaur
  const d=S.d; d.duck=keys.duck;
  if(d.air){ d.vy+=GRAV*(d.duck?3:1)*dt; d.y+=d.vy*dt; if(d.y>=0){ d.y=0; d.vy=0; d.air=false; } }
  d.leg+=dt*S.v/22;
  // przeszkody
  S.nextGap-=dx; if(S.nextGap<=0) spawn();
  S.obs.forEach(o=>{ o.x-=dx+(o.vx||0)*dt; if(o.k==='bird') o.fl=(o.fl+dt*4)%1; });
  S.obs=S.obs.filter(o=>o.x+o.w>-20);
  S.clouds.forEach(c=>c.x-=dx*.18); if(S.clouds.length<4&&Math.random()<dt*.4) S.clouds.push({x:W+30,y:18+Math.random()*50}); S.clouds=S.clouds.filter(c=>c.x>-60);
  S.ground=(S.ground+dx)%24;
  S.flash=Math.max(0,S.flash-dt*2.5);
  // kolizje
  const db=dinoBoxes();
  for(const o of S.obs){ for(const b of obsBoxes(o)){ if(db.some(a=>hit(a,b))){ die(); return; } } }
}
function jump(){
  if(S.state==='ready'){ S.state='run'; }
  else if(S.state==='over'){ if(S.dead>0.45){ reset(); S.state='run'; } return; }
  else if(S.state==='pause'){ S.state='run'; last=performance.now(); return; }
  if(!S.d.air&&S.state==='run'){ S.d.air=true; S.d.vy=JUMP; sJump(); }
}
function die(){
  S.state='over'; S.dead=0; sHit();
  if(S.score>hi){ hi=S.score; S.record=true; persist(); hello(); }
}

/* ============ RYSOWANIE ============ */
const mix=(a,b,t)=>{ const p=x=>[parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)]; const A=p(a),B=p(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; };
function colors(){
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const day=dark?['#16161C','#E4E4E4','#3A3A46']:['#F7F7F7','#535353','#D9D9D9'];
  const night=dark?['#F2F2F2','#3A3A3A','#C8C8C8']:['#1E1E2A','#E6E6E6','#44445A'];
  return day.map((c,i)=>mix(c,night[i],S.night));
}
function cactus(x,base,w,h,seed,col){
  ctx.fillStyle=col;
  const tw=Math.max(4,w*.36), tx=x+(w-tw)/2;
  ctx.fillRect(tx,base-h,tw,h); ctx.fillRect(tx+1,base-h-1,tw-2,1.5);
  const ay=base-h*(0.45+seed*0.2), ah=h*0.32, aw=Math.max(2.4,w*.2);
  ctx.fillRect(x,ay-ah,aw,ah); ctx.fillRect(x,ay-2,tx-x+1,aw*.9);
  const by=base-h*(0.55-seed*0.15), bh=h*0.28;
  ctx.fillRect(x+w-aw,by-bh,aw,bh); ctx.fillRect(tx+tw-1,by-2,x+w-(tx+tw)+1,aw*.9);
}
function draw(){
  const [bg,fg,soft]=colors();
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // chmury
  ctx.fillStyle=soft; S.clouds.forEach(c=>{ ctx.beginPath(); ctx.roundRect?ctx.roundRect(c.x,c.y,38,10,5):ctx.rect(c.x,c.y,38,10); ctx.fill(); ctx.beginPath(); ctx.roundRect?ctx.roundRect(c.x+9,c.y-6,18,10,5):ctx.rect(c.x+9,c.y-6,18,10); ctx.fill(); });
  // ziemia
  ctx.fillStyle=fg; ctx.fillRect(0,GROUND-1,W,1.4);
  for(let x=-S.ground;x<W;x+=24){ ctx.fillRect(x+3,GROUND+4,2,1); ctx.fillRect(x+13,GROUND+7,3,1); }
  // przeszkody
  S.obs.forEach(o=>{
    if(o.k==='bird') drawMap(o.fl<.5?BIRD.up:BIRD.down,o.x,o.y+(o.fl<.5?0:P),fg);
    else o.parts.forEach(p=>cactus(o.x+p.dx,o.y,o.cw,p.h,p.seed,fg));
  });
  // dinozaur
  const d=S.d, x=24;
  if(d.duck&&!d.air&&S.state==='run') drawMap(Math.floor(d.leg)%2?DUCK.a:DUCK.b,x,GROUND-8*P,fg);
  else {
    const m=(S.state!=='run'||d.air)?DINO.stand:(Math.floor(d.leg)%2?DINO.a:DINO.b);
    drawMap(m,x,GROUND-18*P+d.y,fg);
    if(S.state==='over'){ ctx.fillStyle=bg; ctx.fillRect(x+12*P-.5,GROUND-18*P+d.y+.5*P,P*1.2,P*1.2); ctx.fillStyle=fg; ctx.fillRect(x+12*P,GROUND-18*P+d.y+P,P*.5,P*.5); }
  }
  // wynik
  ctx.fillStyle=fg; ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.font='9px "Press Start 2P", monospace';
  const pad5=n=>String(n).padStart(5,'0');
  const sc=(S.flash>0&&Math.floor(S.flash*8)%2)?'':pad5(S.score);
  ctx.globalAlpha=.7; ctx.fillText('REK '+pad5(hi),W-66,8); ctx.globalAlpha=1; ctx.fillText(sc,W-8,8);
  // napisy
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(S.state==='ready'){ ctx.font='9px "Press Start 2P", monospace'; ctx.fillText('DOTKNIJ, ŻEBY ZACZĄĆ',W/2,58); }
  if(S.state==='pause'){ ctx.font='10px "Press Start 2P", monospace'; ctx.fillText('PAUZA',W/2,52); ctx.font='7px "Press Start 2P", monospace'; ctx.fillText('dotknij, żeby grać dalej',W/2,70); }
  if(S.state==='over'){
    ctx.font='11px "Press Start 2P", monospace'; ctx.fillText(S.record?'NOWY REKORD!':'KONIEC GRY',W/2,46);
    if(S.dead>0.45){ // przycisk „jeszcze raz”
      ctx.strokeStyle=fg; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(W/2,76,9,-Math.PI*.15,Math.PI*1.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W/2+9,70); ctx.lineTo(W/2+9,77); ctx.lineTo(W/2+2.5,73); ctx.closePath(); ctx.fill();
    }
  }
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  update(dt); if(S.state==='over') S.dead+=dt;
  draw(); requestAnimationFrame(loop);
}

/* ============ STEROWANIE ============ */
const bDuck=document.getElementById('bDuck');
const setDuck=v=>{ keys.duck=v; bDuck.classList.toggle('on',v); };
document.getElementById('wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('#bDuck')||e.target.closest('#bMute')) return;
  e.preventDefault(); jump();
});
bDuck.addEventListener('pointerdown',e=>{ e.preventDefault(); if(S.state==='ready'||S.state==='pause') jump(); setDuck(true); });
['pointerup','pointercancel','pointerleave'].forEach(ev=>bDuck.addEventListener(ev,()=>setDuck(false)));
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); if(!e.repeat) jump(); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); setDuck(true); }
});
document.addEventListener('keyup',e=>{ if(e.code==='ArrowDown'||e.code==='KeyS') setDuck(false); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.state==='run') S.state='pause'; });
document.getElementById('bMute').onclick=()=>{ muted=!muted; persist(); document.getElementById('bMute').textContent=muted?'🔇':'🔊'; };
document.getElementById('bMute').textContent=muted?'🔇':'🔊';
const hello=()=>document.getElementById('hello').textContent=`Cześć, ${KIDS[kid]}! Skacz przez kaktusy i uważaj na ptaki. Twój rekord: ${hi}.`; hello();
window.addEventListener('resize',()=>{ resize(); });
document.addEventListener('gesturestart',e=>e.preventDefault());

resize(); reset(); requestAnimationFrame(loop);
</script>
<script src="../nav.js" defer></script>
<script src="../gate.js" defer></script>
</body>
</html>
