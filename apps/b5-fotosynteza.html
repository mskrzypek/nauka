<!doctype html>
<html lang="pl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B5 Fotosynteza, oddychanie, fermentacja – fiszki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7F3; --grid:#DFEBE2; --ink:#16271D; --muted:#56695C; --line:#CADCCF; --surface:#FFFFFF; --soft:#E9F2EC;
  --accent:#2E8B57; --accent-ink:#FFFFFF; --ok:#1C7F54; --okbg:#E2F3EA; --bad:#C0284E; --badbg:#FBE5EB; --warn:#9A6700; --warnbg:#FFF4D6;
  --sel:#2F5BD3; --selbg:#E6EDFF;
  --shadow:0 1px 2px rgba(22,39,29,.06),0 6px 18px rgba(22,39,29,.06);
  --fh:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1813; --grid:#16231B; --ink:#E6F0E9; --muted:#9DB3A4; --line:#29402F; --surface:#15221A; --soft:#1B2B21;
    --accent:#5CC98A; --accent-ink:#0F1813; --ok:#55D197; --okbg:#10362A; --bad:#FF7C9C; --badbg:#3C1628; --warn:#FFD36B; --warnbg:#3A3116;
    --sel:#8FB0FF; --selbg:#1C2847; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; color:var(--ink); font:18px/1.5 var(--fb); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px}
.wrap{max-width:660px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px max(90px,calc(env(safe-area-inset-bottom) + 80px))}
h1,h2{font-family:var(--fh); line-height:1.12; margin:0}
h1{font-size:clamp(26px,7vw,36px); font-weight:800; letter-spacing:-.02em}
h2{font-size:21px; font-weight:800; margin-bottom:8px}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px}
.btn{border:2px solid var(--ink); background:transparent; border-radius:12px; padding:9px 16px; font:800 16px var(--fh)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%; padding:13px}
.btn:disabled{opacity:.4}
.pills{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15px; font-weight:700}
.big{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow); margin-bottom:10px}
.big .i{font-size:28px; width:38px; text-align:center; flex:none}
.big .t{font:800 18px var(--fh); display:block}
.big .d{color:var(--muted); font-size:14px; line-height:1.35; display:block}
.big.dark{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.big.dark .d{color:var(--paper); opacity:.8}
.big.trap{border:2px solid #E0A800}
.bar{height:7px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; background:var(--ok); border-radius:6px}
.top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.back{border:1px solid var(--line); background:var(--surface); width:44px; height:44px; border-radius:50%; font-size:20px; flex:none; box-shadow:var(--shadow)}
.prog{height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:12px}
.prog span{display:block; height:100%; background:var(--accent); transition:width .25s}

/* fiszka */
.q{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow)}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.qlab{font:700 13px var(--fh); color:var(--muted); display:flex; justify-content:space-between; gap:8px}
.qt{font:800 21px/1.3 var(--fh); margin:6px 0 14px}
.tag{display:inline-block; background:var(--warnbg); color:var(--warn); border-radius:8px; padding:0 8px; font:700 12px var(--fh)}
.opts{display:grid; gap:8px}
.opt{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; line-height:1.35; font-weight:700}
.opts.three{grid-template-columns:repeat(3,1fr)} .opts.three .opt{text-align:center; padding:16px 4px; font-size:17px}
.opt.ok{border-color:var(--ok); background:var(--okbg)} .opt.no{border-color:var(--bad); background:var(--badbg)}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pairs .col{display:grid; gap:8px; align-content:start}
.pb{position:relative; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 10px 9px 12px; line-height:1.3; font-size:15px; font-weight:700; min-height:48px}
.pb.sel{border-color:var(--sel); background:var(--selbg)}
.pb .n{position:absolute; top:-8px; right:-6px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:800 12px var(--fh); color:#fff}
.pb.ok{border-color:var(--ok); background:var(--okbg)} .pb.no{border-color:var(--bad); background:var(--badbg)}
.why{margin-top:12px; border-radius:14px; padding:12px 14px}
.why.ok{background:var(--okbg)} .why.bad{background:var(--badbg)}
.why .h{font:800 18px var(--fh)}
.why .w{margin-top:6px; font-size:16px}
.why ul{margin:6px 0 0; padding-left:1.1em; font-size:16px}
.diff{border-top:1px solid var(--line); padding:10px 0}
.diff .qq{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ============ GRACZ ============ */
const KIDS={wiktor:'Wiktor',igor:'Igor',zoja:'Zoja'};
let kid=(new URLSearchParams(location.search).get('dla')||'wiktor').toLowerCase();
if(!KIDS[kid]) kid='wiktor';

/* ============ PYTANIA ============ */
// Treść wyłącznie z materiału „B5 · Fotosynteza, oddychanie, fermentacja” i jego klucza.
// mc: o[0] = poprawna odpowiedź (kolejność jest losowana). pairs: [lewa, prawa] = poprawne pary.
// sp: „substrat czy produkt?” – stała kolejność przycisków, c = indeks poprawnej.
// trap: najczęstsze pułapki (częściej w powtórkach + osobny tryb „Pułapki”).
const GROUPS=[
  {id:'g1',n:'Substraty i produkty',i:'⚗️'},
  {id:'g2',n:'Gdzie i kiedy',i:'📍'},
  {id:'g3',n:'Czynniki fotosyntezy',i:'🌡️'},
  {id:'g4',n:'Dzień i noc',i:'🌗'},
  {id:'g5',n:'Fermentacje',i:'🍞'},
  {id:'g6',n:'Wykrywanie',i:'🔬'},
  {id:'g7',n:'Słowniczek',i:'📖'},
];
const Q=[];
const SP=['substrat','produkt','nie występuje'];
const mc=(g,id,q,o,e,trap)=>Q.push({g,id,type:'mc',q,o,c:0,e,trap:!!trap});
const sp=(g,id,q,ans,e,trap)=>Q.push({g,id,type:'mc',q,o:SP,c:SP.indexOf(ans),fixed:true,e,trap:!!trap});
const pairs=(g,id,q,p,e,trap)=>Q.push({g,id,type:'pairs',q,p,e,trap:!!trap});

// 1. Substraty i produkty
sp('g1','1a','Tlen w oddychaniu tlenowym to…','substrat','Oddychasz, żeby wziąć tlen – w oddychaniu tlen jest „na wejściu” i jest zużywany; powstaje dopiero w fotosyntezie.',true);
sp('g1','1b','CO₂ w oddychaniu tlenowym to…','produkt','CO₂ wydychasz – w oddychaniu jest „na wyjściu”: glukoza + tlen → CO₂ + woda + energia.');
sp('g1','1c','Tlen w fotosyntezie to…','produkt','Fotosynteza: CO₂ + woda → glukoza + tlen – nadmiar tlenu wychodzi przez aparaty szparkowe.');
sp('g1','1d','Woda w fotosyntezie to…','substrat','Woda to substrat fotosyntezy – roślina pobiera ją z gleby korzeniami i transportuje drewnem do liści.');
sp('g1','1f','CO₂ w fermentacji mlekowej to…','nie występuje','Fermentacja mlekowa: glukoza → kwas mlekowy – bez CO₂; CO₂ powstaje tylko w fermentacji alkoholowej.',true);
sp('g1','1g','CO₂ w fermentacji alkoholowej to…','produkt','Fermentacja alkoholowa: glukoza → alkohol etylowy + CO₂ – to ten CO₂ spulchnia ciasto.');
mc('g1','1h','Na schemacie mitochondrium rysujesz groty strzałek przy glukozie i tlenie. W którą stronę?',['do mitochondrium – to substraty','od mitochondrium – to produkty','tlen do, glukoza od mitochondrium','tlen od, glukoza do mitochondrium'],'Substraty (glukoza, tlen) – strzałki do mitochondrium, produkty (CO₂, woda) – od niego; groty też są punktowane.',true);
pairs('g1','1i','Dobierz proces do jego produktów.',[['fotosynteza','glukoza + tlen'],['oddychanie tlenowe','CO₂ + woda + energia'],['fermentacja alkoholowa','alkohol etylowy + CO₂'],['fermentacja mlekowa','kwas mlekowy']],'Produkty jednego procesu są substratami drugiego (lustro), a fermentacja mlekowa jako jedyna nie daje CO₂.');

// 2. Gdzie i kiedy
pairs('g2','2a','Gdzie zachodzi dany proces?',[['fotosynteza','chloroplast'],['oddychanie tlenowe','mitochondrium'],['fermentacja','cytoplazma']],'Fotosynteza – w chloroplastach (tylko w świetle), oddychanie – w mitochondriach (zawsze), fermentacja – w cytoplazmie.');
mc('g2','2b','Czy komórki korzenia marchwi przeprowadzają fotosyntezę i oddychanie?',['fotosyntezy nie, ale oddychają','fotosyntezę tak, oddychania nie','oba procesy','żadnego z nich'],'W korzeniu nie ma światła ani chloroplastów, ale mitochondria są w każdej komórce rośliny – oddychanie zachodzi zawsze, u wszystkich.',true);
mc('g2','2c','Chlorofil to…',['zielony barwnik w chloroplastach, który pochłania światło','barwnik w mitochondriach','bezbarwny magazyn skrobi','enzym oddychania'],'Chlorofil w chloroplastach pochłania światło – dlatego fotosynteza zachodzi tylko w świetle.');
mc('g2','2d','Fotosynteza zachodzi głównie w…',['miękiszu asymilacyjnym liści','miękiszu spichrzowym','leukoplastach','korzeniach'],'Chloroplasty są licznie w miękiszu asymilacyjnym liści; leukoplasty (np. w miękiszu spichrzowym) tylko magazynują skrobię.');

// 3. Czynniki fotosyntezy
mc('g3','3a','Jak temperatura wpływa na fotosyntezę?',['rośnie do optimum (ok. 25–35°C), powyżej spada','im cieplej, tym zawsze szybciej','temperatura nie ma wpływu','najszybsza jest w najniższej temperaturze'],'Powyżej optimum enzymy działają coraz słabiej, a w wysokiej temperaturze ulegają zniszczeniu.');
mc('g3','3b','Moczarka w trzech zestawach: 5°C, 20°C i 35°C. Gdzie fotosynteza jest najintensywniejsza?',['35°C','20°C','5°C','wszędzie tak samo'],'35°C mieści się w optimum (ok. 25–35°C) – szkodzi dopiero wyraźnie wyższa temperatura.');
mc('g3','3c','Masz podać DWA różne czynniki hamujące fotosyntezę. Która para da punkt?',['brak światła + brak wody','mało światła + słaba lampa','noc + ciemność','zbyt niska temperatura + zimno'],'Dwa czynniki muszą być z różnych punktów listy (światło, CO₂, temperatura, woda) – jeden czynnik powtórzony innymi słowami = 0 pkt.',true);
mc('g3','3d','Dlaczego przy suszy fotosynteza słabnie?',['roślina zamyka aparaty szparkowe i nie pobiera CO₂','w suszy jest za mało światła','woda niszczy chlorofil','korzenie przejmują fotosyntezę'],'Przy suszy roślina zamyka aparaty szparkowe, żeby nie tracić wody – a wtedy nie pobiera CO₂.');
mc('g3','3e','Skąd moczarka (roślina wodna) bierze CO₂ do fotosyntezy?',['z otaczającej wody – CO₂ jest w niej rozpuszczony','z powietrza przez aparaty szparkowe','z gleby przez korzenie','sama go wytwarza w fotosyntezie'],'Rośliny wodne pobierają CO₂ i wodę bezpośrednio z otaczającej wody i do wody oddają tlen.');

// 4. Dzień i noc
mc('g4','4a','Co roślina pobiera, a co oddaje w nocy?',['pobiera tlen, oddaje CO₂','pobiera CO₂, oddaje tlen','nic – w nocy nie oddycha','pobiera tlen i CO₂'],'W nocy nie ma fotosyntezy – zostaje samo oddychanie: roślina pobiera tlen i oddaje CO₂.');
mc('g4','4b','Prawda czy fałsz: „Rośliny oddychają tylko w nocy.”',['Fałsz – oddychają cały czas','Prawda'],'Rośliny oddychają zawsze; w nocy po prostu nie ma fotosyntezy, która by to „przykryła”.',true);

// 5. Fermentacje
mc('g5','5a','Które produkty powstają dzięki fermentacji mlekowej?',['jogurt, kefir, kiszone ogórki','chleb, wino, piwo','chleb i jogurt','wino i kiszona kapusta'],'Fermentację mlekową prowadzą bakterie mlekowe (jogurt, kefir, sery, kiszonki); chleb i wino to fermentacja alkoholowa drożdży.');
mc('g5','5b','Dlaczego ciasto drożdżowe rośnie?',['drożdże fermentują i wydzielają CO₂, który tworzy pęcherzyki','drożdże wydzielają tlen','kwas mlekowy spulchnia ciasto','alkohol paruje i unosi ciasto'],'Wewnątrz ciasta szybko brakuje tlenu, drożdże fermentują, a CO₂ tworzy w cieście pęcherzyki.');
mc('g5','5c','Jaka fermentacja zachodzi w mięśniach sprintera i dlaczego?',['mlekowa – krew nie nadąża dostarczać tlenu','alkoholowa – mięśnie wytwarzają alkohol','mlekowa – mięśnie mają za dużo tlenu','żadna – mięśnie zawsze oddychają tlenowo'],'Przy dużym, szybkim wysiłku brakuje tlenu, więc komórki mięśni przechodzą na fermentację mlekową i szybko się męczą.');
mc('g5','5d','Który proces daje więcej energii z jednej cząsteczki glukozy?',['oddychanie tlenowe','fermentacja alkoholowa','fermentacja mlekowa','wszystkie tyle samo'],'W fermentacji glukoza nie jest rozłożona do końca – w produktach zostaje sporo energii.');

// 6. Wykrywanie
pairs('g6','6a','Jak to wykryjesz?',[['tlen','tlące się łuczywko się zapala'],['CO₂','woda wapienna mętnieje'],['skrobia','płyn Lugola – kolor granatowy'],['zużycie tlenu','płomień świecy gaśnie']],'Tlen podtrzymuje palenie, CO₂ mąci wodę wapienną, skrobię barwi płyn Lugola, a bez tlenu płomień gaśnie.');
mc('g6','6b','Kiełkujące nasiona w termosie podnoszą temperaturę. Co jest próbą kontrolną?',['nasiona sparzone (martwe)','nasiona w lodówce','pusty termos','suche nasiona w świetle'],'Sparzone nasiona to klasyczna kontrola – pokazuje, że ciepło wydzielają żywe, oddychające komórki.');
mc('g6','6c','Gaz znad drożdży zmętnił wodę wapienną, a gaz znad jogurtu – nie. Dlaczego?',['w fermentacji mlekowej nie powstaje CO₂','jogurt wydziela tlen','woda wapienna wykrywa alkohol','w jogurcie nie ma bakterii'],'CO₂ powstaje w fermentacji alkoholowej (drożdże), a w mlekowej (jogurt) – nie.',true);

// 7. Słowniczek
mc('g7','7a','Fotosynteza to proces…',['anaboliczny – energia jest pobierana','kataboliczny – energia jest uwalniana','ani anaboliczny, ani kataboliczny'],'Anaboliczne budują złożone związki z prostych (fotosynteza), kataboliczne je rozkładają i uwalniają energię (oddychanie, fermentacja).');
mc('g7','7b','ATP to…',['„bateria” komórki – przechowuje energię z oddychania','zielony barwnik pochłaniający światło','zapasowa skrobia','gaz z fermentacji'],'Energia uwolniona w oddychaniu jest przechowywana w ATP i z niego zużywana.');
pairs('g7','7c','Dobierz plastyd do opisu.',[['chloroplasty','zielone – fotosynteza'],['leukoplasty','bezbarwne – magazyn skrobi'],['chromoplasty','barwne – kwiaty, owoce']],'Plastydy to organella roślin: chloroplasty robią fotosyntezę, leukoplasty (korzenie, bulwy, nasiona) magazynują skrobię, chromoplasty barwią.');
mc('g7','7d','Stonka zjada liście ziemniaków – zmniejsza się powierzchnia asymilacyjna. Co to jest i dlaczego plon maleje?',['łączna powierzchnia liści i zielonych części – mniej fotosyntezy, mniej glukozy','powierzchnia korzeni – mniej wody','powierzchnia bulw – mniej skrobi w glebie','powierzchnia aparatów szparkowych – mniej tlenu'],'Asymilacja to fotosynteza: mniej liści → mniej fotosyntezy → mniej glukozy do wzrostu → mniejszy plon.');
mc('g7','7e','Rosiczka łapie i trawi owady. Jest organizmem…',['samożywnym – ma chlorofil, z owadów bierze azot','cudzożywnym – bo zjada owady','cudzożywnym – bo nie ma chlorofilu','samożywnym – z owadów bierze glukozę'],'Rosiczka przeprowadza fotosyntezę (zielone liście z chlorofilem), a z owadów bierze brakujący azot do budowy białek, a nie energię.',true);

/* ============ ZAPIS ============ */
const KEY='b5-fiszki-v1:'+kid, INT=[0,1,3,7,14], KNOWN=2;
let S={q:{},days:[],rounds:[]}, canSave=true;
try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){ canSave=false; }
const save=()=>{ if(!canSave) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ canSave=false; } };
const dayStr=d=>d.toLocaleDateString('sv');
const today=()=>dayStr(new Date());
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dayStr(d); };
const st=q=>S.q[q.id];
const box=q=>(st(q)||{}).b||0;
const known=q=>box(q)>=KNOWN;
// Pomyłka: pudełko 0 i powrót jeszcze dziś. Dobra odpowiedź: kolejne pudełko i coraz dłuższa przerwa (1, 3, 7, 14 dni).
function record(q,ok){
  const e=S.q[q.id]||(S.q[q.id]={b:0,due:today(),r:0,w:0});
  if(ok){ e.r++; e.b=Math.min(INT.length-1,e.b+1); e.due=addDays(INT[e.b]); } else { e.w++; e.b=0; e.due=today(); }
  const d=today(); if(!S.days.includes(d)) S.days.push(d); save();
}

/* ============ POMOCNICZE ============ */
const $app=document.getElementById('app'), $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pct=(a,b)=>b?Math.round(100*a/b):0;
const topBar=t=>`<div class="top"><button class="back" id="bBack" aria-label="Wróć">←</button><h2 style="margin:0;flex:1">${t}</h2></div>`;
const GN=Object.fromEntries(GROUPS.map(g=>[g.id,g]));
const COLORS=['#2F5BD3','#C2410C','#7C3AED','#0E7490'];
function streak(){ let n=0; const d=new Date(); if(!S.days.includes(dayStr(d))) d.setDate(d.getDate()-1); while(S.days.includes(dayStr(d))){ n++; d.setDate(d.getDate()-1); } return n; }

/* ============ DOBÓR FISZEK ============ */
// Najpierw te do powtórki (pomylone i z minionym terminem), potem nowe, a znane tylko wtedy, gdy brakuje innych.
function pick(pool,n){
  const t=today();
  const rank=q=>{ const e=st(q); let k;
    if(!e) k=1; else if(e.due<=t) k=e.b===0?0:.5; else k=2+e.b;
    return k-(q.trap?.4:0)+Math.random()*.6; };
  return pool.map(q=>({q,k:rank(q)})).sort((a,b)=>a.k-b.k).slice(0,n).map(x=>x.q);
}
const dueCount=pool=>pool.filter(q=>{ const e=st(q); return e&&e.due<=today(); }).length;
const hard=()=>Q.filter(q=>{ const e=st(q); return e&&e.w>0&&e.b<KNOWN; });

/* ============ EKRAN GŁÓWNY ============ */
function home(){
  window.scrollTo(0,0);
  const k=Q.filter(known).length, traps=Q.filter(q=>q.trap), hd=hard().length, s=streak(), due=dueCount(Q);
  $app.innerHTML=`<h1>🌱 B5 – fotosynteza i oddychanie</h1>
    <p class="muted" style="margin-top:4px">Cześć, ${esc(KIDS[kid])}! Fiszki do konkursu: fotosynteza, oddychanie, fermentacja. To, co mylisz, wraca częściej; to, co umiesz – rzadziej.</p>
    ${zButton()}
    <div class="pills">${zBadge()}<span class="pill">🔥 ${s} ${s===1?'dzień':'dni'} z rzędu</span><span class="pill">✅ umiesz ${k} z ${Q.length}</span>${due?`<span class="pill">🔁 do powtórki: ${due}</span>`:''}</div>
    <button class="big dark" id="bAll"><span class="i">🎴</span><span><span class="t">Fiszki ze wszystkiego</span><span class="d">12 fiszek – najpierw powtórki i nowe</span></span></button>
    <button class="big trap" id="bTrap"><span class="i">⚠️</span><span><span class="t">Pułapki</span><span class="d">Tlen w oddychaniu, CO₂ w fermentacji mlekowej, roślina oddycha zawsze, dwa czynniki, rosiczka (${traps.filter(known).length}/${traps.length})</span></span></button>
    <button class="big" id="bHard" ${hd?'':'disabled style="opacity:.5"'}><span class="i">🩹</span><span><span class="t">Trudne</span><span class="d">${hd?`${hd} ${hd===1?'fiszka sprawia':hd<5?'fiszki sprawiają':'fiszek sprawia'} trudność`:'Na razie nic nie sprawia trudności'}</span></span></button>
    <div class="card"><h2>Grupy</h2>${GROUPS.map(g=>{ const l=Q.filter(q=>q.g===g.id), kk=l.filter(known).length;
      return `<button class="big" data-g="${g.id}" style="box-shadow:none;margin-bottom:8px"><span class="i">${g.i}</span><span style="flex:1"><span class="t">${esc(g.n)}</span><span class="d">umiesz ${kk} z ${l.length}${dueCount(l)?` · do powtórki ${dueCount(l)}`:''}</span><span class="bar"><span style="width:${pct(kk,l.length)}%"></span></span></span></button>`; }).join('')}</div>
    ${canSave?'':'<p class="muted small">Ta przeglądarka nie zapisze postępów.</p>'}`;
  $('bZal').onclick=zalicz;
  $('bAll').onclick=()=>round(pick(Q,12),'Wszystko');
  $('bTrap').onclick=()=>round(pick(traps,12),'⚠️ Pułapki');
  $('bHard').onclick=()=>{ if(hard().length) round(pick(hard(),12),'🩹 Trudne'); };
  $app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const g=GN[b.dataset.g]; round(pick(Q.filter(q=>q.g===g.id),12),`${g.i} ${g.n}`); });
}

/* ============ RUNDA ============ */
function round(items,title){
  window.scrollTo(0,0);
  const queue=items.map(q=>({q,again:false})), total=items.length, log=new Map(); let done=0;
  function next(){
    if(!queue.length) return finish();
    const cur=queue.shift(), q=cur.q;
    $app.innerHTML=`${topBar(esc(title))}<div class="prog"><span style="width:${100*done/total}%"></span></div>
      <div class="q" id="qc"><div class="qlab"><span>${GN[q.g].i} ${esc(GN[q.g].n)}${q.trap?' <span class="tag">pułapka</span>':''}</span><span>${cur.again?'jeszcze raz 💪':`${done+1}/${total}`}</span></div>
      <div class="qt">${esc(q.q)}</div><div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
    $('bBack').onclick=home;
    const after=(ok,detail)=>{
      if(!cur.again) record(q,ok);
      const L=log.get(q.id)||{q,wrong:0}; if(!ok) L.wrong++; log.set(q.id,L);
      if(!ok&&!cur.again) queue.splice(Math.min(queue.length,3),0,{q,again:true}); // pomylona fiszka wraca w tej samej rundzie
      if(ok||cur.again) done++;
      $('qc').classList.add(ok?'ok':'bad');
      $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Nie tym razem'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
        <button class="btn primary wide" id="bNext" style="margin-top:10px">Dalej</button>`;
      $('bNext').onclick=next; $('bNext').focus({preventScroll:true});
      $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
    };
    if(q.type==='mc') askMc(q,after); else askPairs(q,after);
  }
  function finish(){
    const entries=[...log.values()], wrong=entries.filter(x=>x.wrong>0), ok=entries.length-wrong.length;
    S.rounds.push({d:today(),n:entries.length,ok}); save();
    $app.innerHTML=`${topBar(esc(title))}<div class="card" style="text-align:center"><div style="font:800 52px/1 var(--fh)">${ok}/${entries.length}</div>
      <h2 style="margin-top:8px">${!wrong.length?'Bezbłędnie! 🏆':wrong.length<=2?'Bardzo dobrze! 👏':'Dobra robota – trudne fiszki wrócą w powtórce.'}</h2>
      <p class="muted small">dobrze za pierwszym razem</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="bAgain">Kolejna runda</button><button class="btn" id="bHome">Menu</button></div></div>
      ${wrong.length?`<div class="card"><h2>Sprawiły trudność</h2>${wrong.map(x=>`<div class="diff"><div class="qq">${esc(x.q.q)}</div><div>✅ ${x.q.type==='mc'?esc(x.q.o[x.q.c||0]):x.q.p.map(([a,b])=>`${esc(a)} → ${esc(b)}`).join('<br>✅ ')}</div><div class="muted small">${esc(x.q.e)}</div></div>`).join('')}</div>`:''}`;
    $('bBack').onclick=home; $('bHome').onclick=home;
    $('bAgain').onclick=()=>{ const pool=title==='⚠️ Pułapki'?Q.filter(q=>q.trap):title==='🩹 Trudne'?(hard().length?hard():Q):title==='Wszystko'?Q:Q.filter(q=>`${GN[q.g].i} ${GN[q.g].n}`===title); round(pick(pool,12),title); };
  }
  next();
}

/* ============ WYBÓR Z 2–4 ============ */
function askMc(q,after){
  const C=q.c||0;
  const order=q.fixed?q.o.map((_,i)=>i):q.o.length===2&&/^(Fałsz|Prawda)/.test(q.o[0])?q.o.map((_,i)=>i).sort((a,b)=>/^Prawda/.test(q.o[a])?-1:1):shuffle(q.o.map((_,i)=>i));
  $('ans').innerHTML=`<div class="opts${q.fixed?' three':''}">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')}</div>`;
  const btns=[...$('ans').querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===C;
    btns.forEach(x=>{ x.disabled=true; if(+x.dataset.i===C) x.classList.add('ok'); else if(x===b) x.classList.add('no'); });
    after(ok,ok?'':`<div>Poprawnie: <b>${esc(q.o[C])}</b></div>`); });
}

/* ============ DOBIERZ W PARY ============ */
function askPairs(q,after){
  const L=q.p.map((p,i)=>({i,t:p[0]})), R=shuffle(q.p.map((p,i)=>({i,t:p[1]})));
  const match={}; let selL=null, locked=false;   // match[indeks lewej] = indeks prawej
  const draw=()=>{
    const usedR=Object.values(match), num=Object.keys(match).map(Number);
    $('ans').innerHTML=`<p class="muted small" style="margin:-6px 0 10px">Dotknij pojęcia po lewej, a potem pasującego po prawej.</p>
      <div class="pairs"><div class="col">${L.map(l=>{ const k=num.indexOf(l.i); return `<button class="pb${selL===l.i?' sel':''}" data-l="${l.i}">${esc(l.t)}${l.i in match?`<span class="n" style="background:${COLORS[Object.keys(match).indexOf(String(l.i))%4]}">${Object.keys(match).indexOf(String(l.i))+1}</span>`:''}</button>`; }).join('')}</div>
      <div class="col">${R.map(r=>{ const li=Object.keys(match).find(k=>match[k]===r.i); const k=li!=null?Object.keys(match).indexOf(li):-1; return `<button class="pb" data-r="${r.i}">${esc(r.t)}${k>=0?`<span class="n" style="background:${COLORS[k%4]}">${k+1}</span>`:''}</button>`; }).join('')}</div></div>
      <button class="btn primary wide" id="bChk" style="margin-top:12px" ${Object.keys(match).length===L.length?'':'disabled'}>Sprawdź</button>`;
    $('ans').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ if(locked) return; const i=+b.dataset.l; if(i in match){ delete match[i]; selL=i; } else selL=selL===i?null:i; draw(); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(locked||selL===null) return; const r=+b.dataset.r; const prev=Object.keys(match).find(k=>match[k]===r); if(prev!=null) delete match[prev]; match[selL]=r; selL=null; draw(); });
    $('bChk').onclick=check;
  };
  const check=()=>{
    locked=true; const ok=L.every(l=>match[l.i]===l.i);
    $('ans').querySelectorAll('[data-l]').forEach(b=>{ const i=+b.dataset.l; b.disabled=true; b.classList.add(match[i]===i?'ok':'no'); });
    $('ans').querySelectorAll('[data-r]').forEach(b=>{ b.disabled=true; const r=+b.dataset.r; const li=Object.keys(match).find(k=>match[k]===r); b.classList.add(+li===r?'ok':'no'); });
    $('bChk').remove();
    after(ok,ok?'':`<ul>${q.p.map(([a,b],i)=>`<li>${match[i]===i?'✅':'❌'} ${esc(a)} → <b>${esc(b)}</b></li>`).join('')}</ul>`);
  };
  draw();
}

/* ============ ZALICZ WSZYSTKO ============ */
// Wszystkie pytania do skutku: pomyłka wraca na koniec kolejki, zalicza dopiero dobra odpowiedź.
// Stan w S.z (q – kolejka id, ok – zaliczone, miss – pomylone choć raz) zapisuje się po każdej odpowiedzi; odznaka w S.zDone.
const zAll=()=>typeof fullSet==='function'?fullSet():Q;
const zGet=id=>typeof getQ==='function'?getQ(id):Q.find(q=>q.id===id);
const zToday=()=>new Date().toLocaleDateString('sv');
const zDate=d=>d.split('-').reverse().join('.');
const zPl=n=>n===1?'pytanie':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'pytania':'pytań';
function zState(){
  if(!S.z){ S.z={q:shuffle(zAll()).map(q=>q.id),ok:[],miss:[]}; save(); return S.z; }
  const z=S.z; z.q=z.q.filter(id=>zGet(id)); z.ok=z.ok.filter(id=>zGet(id));
  const seen=new Set([...z.q,...z.ok]), add=shuffle(Q.filter(q=>!seen.has(q.id))).map(q=>q.id);
  if(add.length){ z.q.push(...add); save(); }  // pytania dopisane do quizu po starcie trybu
  if(!z.q.length&&!S.zDone){ S.zDone={d:zToday(),n:z.ok.length}; save(); }
  return z;
}
function zCount(){ if(!S.z) return [0,zAll().length]; const z=zState(); return [z.ok.length,z.ok.length+z.q.length]; }
const zBadge=()=>S.zDone?`<span class="pill">✅ zaliczony 100% (${zDate(S.zDone.d)})</span>`:'';
function zButton(){
  const [x,n]=zCount();
  const sub=S.z&&!S.z.q.length?`zaliczony 100% (${zDate(S.zDone.d)}) – możesz zacząć od nowa`
    :S.z&&(x||S.z.miss.length)?`Wznów – do zaliczenia jeszcze ${n-x}`:`Wszystkie ${n} ${zPl(n)} do skutku – pomyłki wracają na koniec kolejki`;
  return `<button class="big" id="bZal" style="border:2px solid var(--ok)"><span class="i">✅</span><span style="flex:1"><span class="t">Zalicz wszystko (${x}/${n})</span><span class="d">${sub}</span><span class="bar"><span style="width:${n?Math.round(100*x/n):0}%"></span></span></span></button>`;
}
function zalicz(){
  const z=zState();
  if(!z.q.length) return zFinish();
  const id=z.q[0], q=zGet(id), n=z.ok.length+z.q.length, again=z.miss.includes(id);
  const nx=z.q[1]&&zGet(z.q[1]); if(nx&&nx.img){ const i=new Image(); i.src=nx.img; }  // następne zdjęcie ładuje się z góry
  const lab=typeof GN!=='undefined'?`${GN[q.g].i} ${esc(GN[q.g].n)}${q.trap?' <span class="tag">pułapka</span>':''}`:`${esc(SECTIONS[q.s])} · ${KIND[q.type]}`;
  window.scrollTo(0,0);
  $app.innerHTML=`${topBar('✅ Zalicz wszystko')}<div style="position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0 1px;margin-top:-6px"><div class="row" style="justify-content:space-between;font-weight:700;margin-bottom:6px"><span>zaliczone ${z.ok.length} z ${n}</span><span class="muted small">${again?'jeszcze raz 💪':`w kolejce: ${z.q.length}`}</span></div>
    <div class="prog"><span style="width:${100*z.ok.length/n}%"></span></div></div>
    <div class="q" id="qc"><div class="qlab"><span>${lab}</span></div>
    <div class="qt">${esc(q.q)}</div>${q.quote?`<blockquote class="quote">${esc(q.quote)}</blockquote>`:''}${q.img&&typeof photo==='function'?photo(q):''}${q.svg?`<div class="svgfig">${q.svg}</div>`:''}<div id="ans"></div><div id="why" aria-live="polite"></div></div>`;
  $('bBack').onclick=home;
  const after=(ok,detail)=>{
    if(typeof record==='function'&&!again) record(q,ok);  // fiszki: pierwsza odpowiedź liczy się też do powtórek
    z.q.shift();
    if(ok) z.ok.push(id); else { z.q.push(id); if(!again) z.miss.push(id); }
    const fin=!z.q.length; if(fin) S.zDone={d:zToday(),n};
    save();
    $('qc').classList.add(ok?'ok':'bad');
    $('why').innerHTML=`<div class="why ${ok?'ok':'bad'}"><div class="h">${ok?'Dobrze! ✅':'Źle ❌ – to pytanie wróci na końcu kolejki'}</div>${detail||''}<div class="w"><b>Dlaczego:</b> ${esc(q.e)}</div></div>
      <button class="btn primary wide" id="bNext" style="margin-top:10px">${fin?'Wynik':'Dalej'}</button>`;
    $('bNext').onclick=zalicz; $('bNext').focus({preventScroll:true});
    $('why').scrollIntoView({block:'nearest',behavior:'smooth'});
  };
  window['ask'+q.type[0].toUpperCase()+q.type.slice(1)](q,after);
}
function zFinish(){
  const z=S.z, n=z.ok.length;
  window.scrollTo(0,0);
  $app.innerHTML=`${topBar('✅ Zalicz wszystko')}<div class="card" style="text-align:center"><div style="font:800 52px/1 var(--fh)">100%</div>
    <h2 style="margin-top:8px">zaliczone wszystkie ${n} ${zPl(n)} 🏆</h2>
    <p class="muted">${zDate(S.zDone.d)} · ${z.miss.length?`po drodze poprawione: ${z.miss.length}`:'bez ani jednej pomyłki'}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="bZNew">Zacznij od nowa</button><button class="btn" id="bHome">Menu</button></div></div>`;
  $('bBack').onclick=home; $('bHome').onclick=home;
  $('bZNew').onclick=()=>{ S.z=null; save(); zalicz(); };
}

/* ============ START ============ */
home();
</script>
