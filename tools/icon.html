<!doctype html>
<!-- Szablon ikonki PWA, renderowany przez scripts/pwa.mjs (headless Chrome).
     ?name=Wiktor&color=%23E4572E → ikonka dziecka; bez parametrów → ikonka ogólna. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Rounded"; src:local("SF Pro Rounded"),url("file:///System/Library/Fonts/SFNSRounded.ttf"); font-weight:100 900}
html,body{margin:0; width:100vw; height:100vh; overflow:hidden}
body{
  display:grid; place-items:center; position:relative;
  background:
    linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px) 0 0/12.5vw 12.5vw,
    linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px) 0 0/12.5vw 12.5vw,
    linear-gradient(150deg,var(--c1),var(--c2));
}
.letter{font:800 50vw/1 "Rounded",system-ui,sans-serif; color:#fff; letter-spacing:-.02em;
  text-shadow:0 1.2vw 0 rgba(0,0,0,.14); transform:translate(-4vw,-5vw)}
.emoji{font-size:48vw; line-height:1; filter:drop-shadow(0 1.5vw 0 rgba(0,0,0,.15))}
.badge{position:absolute; right:10vw; bottom:10vw; width:25vw; height:25vw; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:16vw; line-height:1; box-shadow:0 1vw 0 rgba(0,0,0,.14)}
</style>
</head>
<body>
<script>
const p=new URLSearchParams(location.search), name=p.get('name'), color=p.get('color')||'#7B3FE4';
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+amt)))); return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`; }
document.body.style.setProperty('--c1',shade(color,.18));
document.body.style.setProperty('--c2',shade(color,-.22));
document.body.innerHTML=name
  ? `<span class="letter">${name[0].toUpperCase()}</span><span class="badge">🎒</span>`
  : `<span class="emoji">🎒</span>`;
</script>
</body>
</html>
